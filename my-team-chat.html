<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>UNGANI OS - Team Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.41.0/dist/umd/lucide.js"></script>
  <script src="pwa-register.js"></script>
  <script src="ungani-theme.js"></script>
  <script src="client-shared.js" onerror="window.__unganiClientSharedFailed = true;"></script>
  <script src="team-chat-shared.js"></script>
  <script src="ungani-nav-config.js"></script>
  <script>
    (function () {
      function showUnganiLoadError() {
        if (typeof UnganiClientShared !== "undefined") return;

        var banner = document.createElement("div");
        banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#B91C1C;color:#fff;padding:12px 16px;font:14px/1.4 -apple-system,sans-serif;text-align:center;";
        banner.innerHTML = "Some page resources failed to load. Please check your connection. " +
          "<button style=\"margin-left:10px;padding:4px 12px;border:none;border-radius:6px;background:#fff;color:#B91C1C;font-weight:700;cursor:pointer;\" onclick=\"window.location.reload()\">Reload</button>";

        if (document.body) {
          document.body.prepend(banner);
        } else {
          document.addEventListener("DOMContentLoaded", function () {
            document.body.prepend(banner);
          });
        }
      }

      if (window.__unganiClientSharedFailed) {
        showUnganiLoadError();
      } else {
        setTimeout(function () {
          if (typeof UnganiClientShared === "undefined") showUnganiLoadError();
        }, 4000);
      }
    })();
  </script>
  <script src="nia-assistant.js"></script>

  <style>
    .ttc-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 18px;
      height: calc(100vh - 210px);
      min-height: 480px;
    }

    @media (max-width: 900px) {
      .ttc-layout {
        grid-template-columns: 1fr;
        height: auto;
      }

      .ttc-sidebar {
        max-height: 320px;
      }
    }

    .ttc-sidebar {
      background: var(--ungani-card);
      border: 1px solid var(--ungani-border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .ttc-sidebar-head {
      padding: 16px;
      border-bottom: 1px solid var(--ungani-border);
      flex: none;
    }

    .ttc-sidebar-head h3 {
      margin: 0 0 4px;
      color: var(--ungani-text);
      font-size: 15px;
    }

    .ttc-sidebar-head p {
      margin: 0;
      color: var(--ungani-muted);
      font-size: 12px;
    }

    .ttc-conversation-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .ttc-conv {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 14px;
      padding: 11px 12px;
      margin-bottom: 4px;
      cursor: pointer;
      color: var(--ungani-text);
      font-size: 13.5px;
      font-weight: 700;
    }

    .ttc-conv:hover {
      background: var(--ungani-soft);
    }

    .ttc-conv.active {
      background: var(--ungani-navy);
      color: #FFFFFF;
      border-color: var(--ungani-navy);
    }

    .ttc-conv-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--ungani-red);
      flex: none;
    }

    .ttc-conv-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .ttc-conv-left span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ungani-chat-avatar {
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      flex: none;
      line-height: 1;
    }

    .ttc-thread-head-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ttc-msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .ttc-msg-row.mine {
      justify-content: flex-end;
    }

    .ttc-new-dm {
      padding: 10px;
      border-top: 1px solid var(--ungani-border);
      flex: none;
      display: flex;
      gap: 6px;
    }

    .ttc-new-dm select {
      flex: 1;
      border-radius: 10px;
      border: 1px solid var(--ungani-border);
      padding: 8px;
      font-size: 12.5px;
      background: var(--ungani-bg);
      color: var(--ungani-text);
    }

    .ttc-new-dm button {
      border: none;
      background: var(--ungani-gold);
      color: var(--ungani-navy);
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 800;
      font-size: 12.5px;
      cursor: pointer;
      flex: none;
    }

    .ttc-new-dm input {
      flex: 1;
      border-radius: 10px;
      border: 1px solid var(--ungani-border);
      padding: 8px 10px;
      font-size: 12.5px;
      background: var(--ungani-bg);
      color: var(--ungani-text);
    }

    .ttc-sidebar-head.ttc-channels-head {
      border-top: 1px solid var(--ungani-border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .ttc-head-add-btn {
      flex: none;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: none;
      background: var(--ungani-gold);
      color: var(--ungani-navy);
      font-weight: 900;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ttc-thread {
      background: var(--ungani-card);
      border: 1px solid var(--ungani-border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .ttc-thread-head {
      padding: 16px;
      border-bottom: 1px solid var(--ungani-border);
      flex: none;
    }

    .ttc-thread-head h3 {
      margin: 0 0 3px;
      color: var(--ungani-text);
      font-size: 15px;
    }

    .ttc-thread-head p {
      margin: 0;
      color: var(--ungani-muted);
      font-size: 12px;
    }

    .ttc-messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ttc-empty {
      margin: auto;
      text-align: center;
      color: var(--ungani-muted);
      max-width: 320px;
    }

    .ttc-empty h4 {
      margin: 0 0 6px;
      color: var(--ungani-text);
    }

    .ttc-bubble {
      max-width: 70%;
      padding: 11px 15px;
      border-radius: 16px;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .ttc-bubble .ttc-sender {
      display: block;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 3px;
      opacity: 0.7;
    }

    .ttc-bubble .ttc-time {
      display: block;
      font-size: 10.5px;
      margin-top: 5px;
      opacity: 0.6;
    }

    .ttc-bubble.mine {
      align-self: flex-end;
      background: var(--ungani-gold);
      color: var(--ungani-navy);
      border-bottom-right-radius: 4px;
    }

    .ttc-bubble.theirs {
      align-self: flex-start;
      background: var(--ungani-soft);
      color: var(--ungani-text);
      border: 1px solid var(--ungani-border);
      border-bottom-left-radius: 4px;
    }

    .ttc-input-row {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid var(--ungani-border);
      flex: none;
    }

    .ttc-input-row input {
      flex: 1;
      border-radius: 999px;
      border: 1px solid var(--ungani-border);
      background: var(--ungani-bg);
      color: var(--ungani-text);
      padding: 11px 18px;
      font-size: 13.5px;
      outline: none;
    }

    .ttc-input-row button {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 0;
      background: var(--ungani-gold);
      color: var(--ungani-navy);
      font-weight: 900;
      cursor: pointer;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>

<body>
  <script>
    let currentContext = null;
    let shellBuilt = false;

    window.addEventListener("load", function () {
      UnganiClientShared.initPage({
        pageKey: "team-chat",
        pageTitle: "Team Chat",
        pageSubtitle: "Internal team communication for this business workspace.",
        onReady: startTeamChatPage
      });
    });

    async function startTeamChatPage(context) {
      currentContext = context;

      UnganiTeamChat.setRenderCallback(renderTeamChatPage);
      await UnganiTeamChat.init(function () { return currentContext; });
      await UnganiTeamChat.loadChannels();
      UnganiTeamChat.startPolling();

      // Channels live outside team-chat-shared.js's own Team/DM poll (see
      // its file header - the popup never loads or shows channels), so
      // this page runs its own lightweight refresh loop for them: the
      // channel list/unread counts, plus the open channel's messages if
      // one is active.
      setInterval(function () {
        UnganiTeamChat.loadChannels();
        UnganiTeamChat.refreshActiveChannel();
      }, 15000);
    }

    // Builds the two-pane shell exactly once - every later call (poll
    // refresh, switching conversations, sending) only replaces the
    // conversation list and message list innerHTML, never the outer
    // shell or the compose input. This is deliberately simpler than the
    // popup's own "is the user currently typing" heuristic (see
    // team-chat-shared.js's loadMessages()) and fully avoids that whole
    // class of bug: the input element is never rebuilt after first paint,
    // so a 12s poll landing mid-keystroke can't wipe a draft.
    function renderTeamChatPage() {
      if (!shellBuilt) {
        UnganiClientShared.setContent(`
          <div class="ttc-layout">
            <div class="ttc-sidebar">
              <div class="ttc-sidebar-head">
                <h3>Conversations</h3>
                <p>Your team's broadcast channel plus any private messages.</p>
              </div>
              <div id="ttcConversationList" class="ttc-conversation-list"></div>
              <div class="ttc-new-dm" id="ttcNewDmRow"></div>

              <div class="ttc-sidebar-head ttc-channels-head">
                <div>
                  <h3>Channels</h3>
                  <p>Topic channels your team creates, like #nairobi-branch.</p>
                </div>
                <button type="button" id="ttcNewChannelBtn" class="ttc-head-add-btn" style="display:none;" title="Create a channel" onclick="toggleNewChannelRow()">+</button>
              </div>
              <div class="ttc-new-dm" id="ttcNewChannelRow" style="display:none;">
                <input id="ttcNewChannelInput" type="text" placeholder="channel-name" autocomplete="off" />
                <button type="button" onclick="submitNewChannel()">Create</button>
              </div>
              <div id="ttcChannelList" class="ttc-conversation-list"></div>
            </div>

            <div class="ttc-thread">
              <div class="ttc-thread-head" id="ttcThreadHead"></div>
              <div id="ttcMessages" class="ttc-messages"></div>
              <form class="ttc-input-row" onsubmit="UnganiTeamChat.send(event); return false;">
                <input id="ttcInput" type="text" placeholder="Message your team..." autocomplete="off" />
                <button type="submit" title="Send"><i data-lucide="send"></i></button>
              </form>
            </div>
          </div>
        `);

        shellBuilt = true;
        if (window.lucide) window.lucide.createIcons();
      }

      renderConversationList();
      renderNewDmRow();
      renderChannelsSection();
      renderThreadHead();
      renderMessages();

      const inputEl = document.getElementById("ttcInput");
      const activeKey = UnganiTeamChat.getActiveKey();
      if (inputEl) {
        inputEl.placeholder = activeKey === "team"
          ? "Message your team..."
          : activeKey.indexOf("channel:") === 0
            ? "Message this channel..."
            : "Send a private message...";
      }
    }

    function renderConversationList() {
      const box = document.getElementById("ttcConversationList");
      if (!box) return;

      const list = UnganiTeamChat.getConversationList();
      const activeKey = UnganiTeamChat.getActiveKey();

      box.innerHTML = list.map(function (c) {
        return `
          <button type="button" class="ttc-conv${c.key === activeKey ? " active" : ""}" onclick="UnganiTeamChat.selectConversation('${UnganiClientShared.attr(c.key)}')">
            <span class="ttc-conv-left">
              ${UnganiTeamChat.avatarHtml(c.avatarKey, c.avatarName, 26)}
              <span>${UnganiClientShared.safe(c.label)}</span>
            </span>
            ${c.unread > 0 ? '<span class="ttc-conv-dot"></span>' : ""}
          </button>
        `;
      }).join("");
    }

    function renderNewDmRow() {
      const row = document.getElementById("ttcNewDmRow");
      if (!row) return;

      const targets = UnganiTeamChat.getAvailableDmTargets();

      if (!targets.length) {
        row.innerHTML = "";
        return;
      }

      row.innerHTML = `
        <select id="ttcNewDmSelect">
          ${targets.map(function (t) { return `<option value="${UnganiClientShared.attr(t.key)}">${UnganiClientShared.safe(t.label)}</option>`; }).join("")}
        </select>
        <button type="button" onclick="startNewDm()">New DM</button>
      `;
    }

    function startNewDm() {
      const select = document.getElementById("ttcNewDmSelect");
      if (!select || !select.value) return;
      UnganiTeamChat.startDm(select.value);
    }

    function renderChannelsSection() {
      const btn = document.getElementById("ttcNewChannelBtn");
      if (btn) btn.style.display = UnganiTeamChat.getIsOwner() ? "flex" : "none";

      const box = document.getElementById("ttcChannelList");
      if (!box) return;

      const channels = UnganiTeamChat.getChannelList();
      const activeKey = UnganiTeamChat.getActiveKey();

      if (!channels.length) {
        box.innerHTML = `<p style="padding:10px;margin:0;color:var(--ungani-muted);font-size:12px;">No channels yet.${UnganiTeamChat.getIsOwner() ? " Tap + to create one." : ""}</p>`;
        return;
      }

      box.innerHTML = channels.map(function (c) {
        const key = "channel:" + c.id;
        return `
          <button type="button" class="ttc-conv${key === activeKey ? " active" : ""}" onclick="UnganiTeamChat.selectChannel('${UnganiClientShared.attr(c.id)}')">
            <span class="ttc-conv-left">
              ${UnganiTeamChat.avatarHtml("channel", c.name, 26)}
              <span>#${UnganiClientShared.safe(c.name)}</span>
            </span>
            ${c.unread > 0 ? '<span class="ttc-conv-dot"></span>' : ""}
          </button>
        `;
      }).join("");
    }

    function toggleNewChannelRow() {
      const row = document.getElementById("ttcNewChannelRow");
      if (!row) return;
      row.style.display = row.style.display === "none" ? "flex" : "none";
      if (row.style.display === "flex") {
        const input = document.getElementById("ttcNewChannelInput");
        if (input) input.focus();
      }
    }

    async function submitNewChannel() {
      const input = document.getElementById("ttcNewChannelInput");
      if (!input) return;
      const name = input.value.trim().replace(/^#+/, "");
      if (!name) return;

      const result = await UnganiTeamChat.createChannel(name, "");
      if (!result.ok) {
        if (window.UnganiClientShared && UnganiClientShared.showToast) {
          UnganiClientShared.showToast(result.message || "Could not create channel.");
        } else {
          alert(result.message || "Could not create channel.");
        }
        return;
      }

      input.value = "";
      document.getElementById("ttcNewChannelRow").style.display = "none";
    }

    function renderThreadHead() {
      const head = document.getElementById("ttcThreadHead");
      if (!head) return;

      const activeKey = UnganiTeamChat.getActiveKey();

      if (activeKey === "team") {
        head.innerHTML = `<div class="ttc-thread-head-row">${UnganiTeamChat.avatarHtml("team", "Team", 34)}<div><h3>Team</h3><p>Visible to your whole team.</p></div></div>`;
        return;
      }

      if (activeKey.indexOf("channel:") === 0) {
        const channelId = activeKey.slice(8);
        const channel = UnganiTeamChat.getChannelList().find(function (c) { return c.id === channelId; });
        const channelName = channel ? channel.name : "channel";
        head.innerHTML = `<div class="ttc-thread-head-row">${UnganiTeamChat.avatarHtml("channel", channelName, 34)}<div><h3>#${UnganiClientShared.safe(channelName)}</h3><p>Visible to your whole team.</p></div></div>`;
        return;
      }

      const list = UnganiTeamChat.getConversationList();
      const active = list.find(function (c) { return c.key === activeKey; });
      const label = active ? active.label : "Team";
      const avatarKey = active ? active.avatarKey : "team";
      const avatarName = active ? active.avatarName : label;
      head.innerHTML = `<div class="ttc-thread-head-row">${UnganiTeamChat.avatarHtml(avatarKey, avatarName, 34)}<div><h3>${UnganiClientShared.safe(label)}</h3><p>Private conversation.</p></div></div>`;
    }

    function renderMessages() {
      const box = document.getElementById("ttcMessages");
      if (!box) return;

      const rows = UnganiTeamChat.getMessagesForActive();
      const me = UnganiTeamChat.getMyIdentity();
      const activeKey = UnganiTeamChat.getActiveKey();

      const isChannel = activeKey.indexOf("channel:") === 0;
      const isMultiParty = activeKey === "team" || isChannel;

      if (!rows.length) {
        box.innerHTML = `
          <div class="ttc-empty">
            <h4>No messages yet</h4>
            <p>${isMultiParty ? "Send a quick note to get started." : "Send the first private message to start this conversation."}</p>
          </div>
        `;
        return;
      }

      const wasNearBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 80;

      box.innerHTML = rows.map(function (row) {
        const isMine = row.sender_user_id === me.authUserId;
        const senderName = UnganiClientShared.getValue(row, ["sender_name"], isMine ? "You" : "Team Member");
        const body = UnganiClientShared.getValue(row, ["message_body", "message", "body"], "");
        const time = UnganiTeamChat.formatTime(UnganiClientShared.getValue(row, ["created_at"], ""));
        const avatar = isMine ? "" : UnganiTeamChat.avatarHtml(row.sender_user_id, senderName, 28);

        return `
          <div class="ttc-msg-row ${isMine ? "mine" : "theirs"}">
            ${avatar}
            <div class="ttc-bubble ${isMine ? "mine" : "theirs"}">
              ${isMine || !isMultiParty ? "" : `<span class="ttc-sender">${UnganiClientShared.safe(senderName)}</span>`}
              <span style="white-space:pre-wrap;">${UnganiClientShared.safe(body)}</span>
              <span class="ttc-time">${UnganiClientShared.safe(time)}</span>
            </div>
          </div>
        `;
      }).join("");

      if (wasNearBottom) box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>

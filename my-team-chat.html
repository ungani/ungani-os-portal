<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>UNGANI OS - Team Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.41.0/dist/umd/lucide.js"></script>
  <script src="pwa-register.js"></script>
  <script src="ungani-theme.js"></script>
  <script src="client-shared.js" onerror="window.__unganiClientSharedFailed = true;"></script>
  <script src="team-chat-shared.js"></script>
  <script src="ungani-nav-config.js"></script>
  <script>
    (function () {
      function showUnganiLoadError() {
        if (typeof UnganiClientShared !== "undefined") return;

        var banner = document.createElement("div");
        banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#B91C1C;color:#fff;padding:12px 16px;font:14px/1.4 -apple-system,sans-serif;text-align:center;";
        banner.innerHTML = "Some page resources failed to load. Please check your connection. " +
          "<button style=\"margin-left:10px;padding:4px 12px;border:none;border-radius:6px;background:#fff;color:#B91C1C;font-weight:700;cursor:pointer;\" onclick=\"window.location.reload()\">Reload</button>";

        if (document.body) {
          document.body.prepend(banner);
        } else {
          document.addEventListener("DOMContentLoaded", function () {
            document.body.prepend(banner);
          });
        }
      }

      if (window.__unganiClientSharedFailed) {
        showUnganiLoadError();
      } else {
        setTimeout(function () {
          if (typeof UnganiClientShared === "undefined") showUnganiLoadError();
        }, 4000);
      }
    })();
  </script>
  <script src="nia-assistant.js"></script>

  <style>
    .ttc-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 18px;
      height: calc(100vh - 210px);
      min-height: 480px;
    }

    @media (max-width: 900px) {
      .ttc-layout {
        grid-template-columns: 1fr;
        height: auto;
      }

      .ttc-sidebar {
        max-height: 320px;
      }
    }

    .ttc-sidebar {
      background: var(--ungani-card);
      border: 1px solid var(--ungani-border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .ttc-sidebar-head {
      padding: 16px;
      border-bottom: 1px solid var(--ungani-border);
      flex: none;
    }

    .ttc-sidebar-head h3 {
      margin: 0 0 4px;
      color: var(--ungani-text);
      font-size: 15px;
    }

    .ttc-sidebar-head p {
      margin: 0;
      color: var(--ungani-muted);
      font-size: 12px;
    }

    .ttc-conversation-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .ttc-conv {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 14px;
      padding: 11px 12px;
      margin-bottom: 4px;
      cursor: pointer;
      color: var(--ungani-text);
      font-size: 13.5px;
      font-weight: 700;
    }

    .ttc-conv:hover {
      background: var(--ungani-soft);
    }

    .ttc-conv.active {
      background: var(--ungani-navy);
      color: #FFFFFF;
      border-color: var(--ungani-navy);
    }

    .ttc-conv-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--ungani-red);
      flex: none;
    }

    .ttc-conv-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .ttc-conv-left span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ungani-chat-avatar {
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      flex: none;
      line-height: 1;
    }

    .ttc-thread-head-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ttc-members-link {
      border: none;
      background: none;
      padding: 0;
      margin: 0;
      font: inherit;
      font-size: 12px;
      color: var(--ungani-muted);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .ttc-members-link:hover {
      color: var(--ungani-text);
    }

    .ttc-member-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid var(--ungani-border);
    }

    .ttc-member-row:last-child {
      border-bottom: none;
    }

    .ttc-member-name {
      font-weight: 700;
      font-size: 13.5px;
      color: var(--ungani-text);
    }

    .ttc-member-role {
      font-size: 11.5px;
      color: var(--ungani-muted);
      text-transform: capitalize;
    }

    .ttc-msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .ttc-msg-row.mine {
      justify-content: flex-end;
    }

    .ttc-new-dm {
      padding: 10px;
      border-top: 1px solid var(--ungani-border);
      flex: none;
      display: flex;
      gap: 6px;
    }

    .ttc-new-dm select {
      flex: 1;
      border-radius: 10px;
      border: 1px solid var(--ungani-border);
      padding: 8px;
      font-size: 12.5px;
      background: var(--ungani-bg);
      color: var(--ungani-text);
    }

    .ttc-new-dm button {
      border: none;
      background: var(--ungani-gold);
      color: var(--ungani-navy);
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 800;
      font-size: 12.5px;
      cursor: pointer;
      flex: none;
    }

    .ttc-new-dm input {
      flex: 1;
      border-radius: 10px;
      border: 1px solid var(--ungani-border);
      padding: 8px 10px;
      font-size: 12.5px;
      background: var(--ungani-bg);
      color: var(--ungani-text);
    }

    .ttc-sidebar-head.ttc-channels-head {
      border-top: 1px solid var(--ungani-border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .ttc-head-add-btn {
      flex: none;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: none;
      background: var(--ungani-gold);
      color: var(--ungani-navy);
      font-weight: 900;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ttc-thread {
      background: var(--ungani-card);
      border: 1px solid var(--ungani-border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .ttc-thread-head {
      padding: 16px;
      border-bottom: 1px solid var(--ungani-border);
      flex: none;
    }

    .ttc-thread-head h3 {
      margin: 0 0 3px;
      color: var(--ungani-text);
      font-size: 15px;
    }

    .ttc-thread-head p {
      margin: 0;
      color: var(--ungani-muted);
      font-size: 12px;
    }

    .ttc-messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ttc-empty {
      margin: auto;
      text-align: center;
      color: var(--ungani-muted);
      max-width: 320px;
    }

    .ttc-empty h4 {
      margin: 0 0 6px;
      color: var(--ungani-text);
    }

    .ttc-bubble {
      max-width: 70%;
      padding: 11px 15px;
      border-radius: 16px;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .ttc-bubble .ttc-sender {
      display: block;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 3px;
      opacity: 0.7;
    }

    .ttc-bubble .ttc-time {
      display: inline-block;
      font-size: 10.5px;
      margin-top: 5px;
      opacity: 0.6;
    }

    .ttc-receipt {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10.5px;
      margin-top: 5px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .ttc-receipt i {
      width: 12px;
      height: 12px;
    }

    .ttc-receipt.sent {
      color: rgba(11, 31, 58, 0.45);
    }

    .ttc-receipt.read {
      color: #2F80ED;
    }

    .ttc-bubble.mine {
      align-self: flex-end;
      background: var(--ungani-gold);
      color: var(--ungani-navy);
      border-bottom-right-radius: 4px;
    }

    .ttc-bubble.theirs {
      align-self: flex-start;
      background: var(--ungani-soft);
      color: var(--ungani-text);
      border: 1px solid var(--ungani-border);
      border-bottom-left-radius: 4px;
    }

    .ttc-input-row {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid var(--ungani-border);
      flex: none;
    }

    .ttc-input-row input {
      flex: 1;
      border-radius: 999px;
      border: 1px solid var(--ungani-border);
      background: var(--ungani-bg);
      color: var(--ungani-text);
      padding: 11px 18px;
      font-size: 13.5px;
      outline: none;
    }

    .ttc-input-row button {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 0;
      background: var(--ungani-gold);
      color: var(--ungani-navy);
      font-weight: 900;
      cursor: pointer;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>

<body>
  <script>
    let currentContext = null;
    let shellBuilt = false;

    window.addEventListener("load", function () {
      UnganiClientShared.initPage({
        pageKey: "team-chat",
        pageTitle: "Team Chat",
        pageSubtitle: "Internal team communication for this business workspace.",
        onReady: startTeamChatPage
      });
    });

    async function startTeamChatPage(context) {
      currentContext = context;

      UnganiTeamChat.setRenderCallback(renderTeamChatPage);
      await UnganiTeamChat.init(function () { return currentContext; });
      await UnganiTeamChat.loadChannels();
      UnganiTeamChat.startPolling();

      // Deep-link support for the header launcher (team-chat-shared.js's
      // renderPanel()), which links each unread row to
      // my-team-chat.html?open=<key> instead of trying to render a second
      // copy of the conversation/channel itself. init()/loadChannels() must
      // both finish first so the target conversation/channel actually
      // exists in state before we try to select it.
      const openKey = new URLSearchParams(window.location.search).get("open");
      if (openKey) {
        if (openKey.indexOf("channel:") === 0) {
          await UnganiTeamChat.selectChannel(openKey.slice(8));
        } else {
          UnganiTeamChat.selectConversation(openKey);
        }
      }

      // Channels live outside team-chat-shared.js's own Team/DM poll (see
      // its file header - the popup never loads or shows channels), so
      // this page runs its own lightweight refresh loop for them: the
      // channel list/unread counts, plus the open channel's messages if
      // one is active.
      setInterval(function () {
        UnganiTeamChat.loadChannels();
        UnganiTeamChat.refreshActiveChannel();
      }, 15000);
    }

    // Builds the two-pane shell exactly once - every later call (poll
    // refresh, switching conversations, sending) only replaces the
    // conversation list and message list innerHTML, never the outer
    // shell or the compose input. This is deliberately simpler than the
    // popup's own "is the user currently typing" heuristic (see
    // team-chat-shared.js's loadMessages()) and fully avoids that whole
    // class of bug: the input element is never rebuilt after first paint,
    // so a 12s poll landing mid-keystroke can't wipe a draft.
    function renderTeamChatPage() {
      if (!shellBuilt) {
        UnganiClientShared.setContent(`
          <div class="ttc-layout">
            <div class="ttc-sidebar">
              <div class="ttc-sidebar-head">
                <h3>Conversations</h3>
                <p>Your team's broadcast channel plus any private messages.</p>
              </div>
              <div id="ttcConversationList" class="ttc-conversation-list"></div>
              <div class="ttc-new-dm" id="ttcNewDmRow"></div>

              <div class="ttc-sidebar-head ttc-channels-head">
                <div>
                  <h3>Channels</h3>
                  <p>Topic channels your team creates, like #nairobi-branch.</p>
                </div>
                <button type="button" id="ttcNewChannelBtn" class="ttc-head-add-btn" title="Create a channel" onclick="openCreateChannelModal()">+</button>
              </div>
              <div id="ttcChannelList" class="ttc-conversation-list"></div>
            </div>

            <div class="ttc-thread">
              <div class="ttc-thread-head" id="ttcThreadHead"></div>
              <div id="ttcMessages" class="ttc-messages"></div>
              <form class="ttc-input-row" onsubmit="UnganiTeamChat.send(event); return false;">
                <input id="ttcInput" type="text" placeholder="Message your team..." autocomplete="off" />
                <button type="submit" title="Send"><i data-lucide="send"></i></button>
              </form>
            </div>
          </div>
        `);

        shellBuilt = true;
        if (window.lucide) window.lucide.createIcons();
      }

      renderConversationList();
      renderNewDmRow();
      renderChannelsSection();
      renderThreadHead();
      renderMessages();

      const inputEl = document.getElementById("ttcInput");
      const activeKey = UnganiTeamChat.getActiveKey();
      if (inputEl) {
        inputEl.placeholder = activeKey === "team"
          ? "Message your team..."
          : activeKey.indexOf("channel:") === 0
            ? "Message this channel..."
            : "Send a private message...";
      }
    }

    function renderConversationList() {
      const box = document.getElementById("ttcConversationList");
      if (!box) return;

      const list = UnganiTeamChat.getConversationList();
      const activeKey = UnganiTeamChat.getActiveKey();

      box.innerHTML = list.map(function (c) {
        return `
          <button type="button" class="ttc-conv${c.key === activeKey ? " active" : ""}" onclick="UnganiTeamChat.selectConversation('${UnganiClientShared.attr(c.key)}')">
            <span class="ttc-conv-left">
              ${UnganiTeamChat.avatarHtml(c.avatarKey, c.avatarName, 26)}
              <span>${UnganiClientShared.safe(c.label)}</span>
            </span>
            ${c.unread > 0 ? '<span class="ttc-conv-dot"></span>' : ""}
          </button>
        `;
      }).join("");
    }

    function renderNewDmRow() {
      const row = document.getElementById("ttcNewDmRow");
      if (!row) return;

      const targets = UnganiTeamChat.getAvailableDmTargets();

      if (!targets.length) {
        row.innerHTML = "";
        return;
      }

      row.innerHTML = `
        <select id="ttcNewDmSelect">
          ${targets.map(function (t) { return `<option value="${UnganiClientShared.attr(t.key)}">${UnganiClientShared.safe(t.label)}</option>`; }).join("")}
        </select>
        <button type="button" onclick="startNewDm()">New DM</button>
      `;
    }

    function startNewDm() {
      const select = document.getElementById("ttcNewDmSelect");
      if (!select || !select.value) return;
      UnganiTeamChat.startDm(select.value);
    }

    function renderChannelsSection() {
      const box = document.getElementById("ttcChannelList");
      if (!box) return;

      const channels = UnganiTeamChat.getChannelList();
      const activeKey = UnganiTeamChat.getActiveKey();

      if (!channels.length) {
        box.innerHTML = `<p style="padding:10px;margin:0;color:var(--ungani-muted);font-size:12px;">No channels yet. Tap + to create one.</p>`;
        return;
      }

      box.innerHTML = channels.map(function (c) {
        const key = "channel:" + c.id;
        return `
          <button type="button" class="ttc-conv${key === activeKey ? " active" : ""}" onclick="UnganiTeamChat.selectChannel('${UnganiClientShared.attr(c.id)}')">
            <span class="ttc-conv-left">
              ${UnganiTeamChat.avatarHtml("channel", c.name, 26)}
              <span>#${UnganiClientShared.safe(c.name)}</span>
            </span>
            ${c.unread > 0 ? '<span class="ttc-conv-dot"></span>' : ""}
          </button>
        `;
      }).join("");
    }

    // Any active staff member can create a channel now (loosened from
    // owner-only per explicit direction - creating a channel is low-risk).
    // The "#" prefix is never typed by the user - they type a plain name
    // ("gensets") and every render site (conversation list, thread head,
    // message avatars) already prepends "#" itself, so there's nothing
    // special-character-shaped for the user to remember.
    function openCreateChannelModal() {
      UnganiClientShared.openModal({
        title: "Create Channel",
        bodyHtml: `
          <div style="display:flex;flex-direction:column;gap:14px;">
            <div>
              <label style="display:block;font-size:12px;font-weight:800;color:var(--ungani-muted);margin-bottom:6px;">Channel name</label>
              <div style="display:flex;align-items:center;gap:4px;border:1px solid var(--ungani-border);border-radius:10px;padding:0 12px;background:var(--ungani-bg);">
                <span style="color:var(--ungani-muted);font-weight:800;">#</span>
                <input id="ttcModalChannelName" type="text" placeholder="gensets" autocomplete="off" style="flex:1;border:none;background:transparent;padding:11px 0;font-size:14px;color:var(--ungani-text);outline:none;" />
              </div>
              <p style="margin:6px 0 0;font-size:11.5px;color:var(--ungani-muted);">Visible to your whole team. The # is added automatically wherever this channel is shown.</p>
            </div>
            <button type="button" onclick="submitNewChannelFromModal()" style="border:none;background:var(--ungani-gold);color:var(--ungani-navy);border-radius:10px;padding:11px;font-weight:800;font-size:13.5px;cursor:pointer;">Create Channel</button>
          </div>
        `,
        onOpen: function () {
          const input = document.getElementById("ttcModalChannelName");
          if (!input) return;
          input.focus();
          input.addEventListener("keydown", function (event) {
            if (event.key === "Enter") submitNewChannelFromModal();
          });
        }
      });
    }

    async function submitNewChannelFromModal() {
      const input = document.getElementById("ttcModalChannelName");
      if (!input) return;
      const name = input.value.trim().replace(/^#+/, "");
      if (!name) return;

      const result = await UnganiTeamChat.createChannel(name, "");
      if (!result.ok) {
        if (window.UnganiClientShared && UnganiClientShared.showToast) {
          UnganiClientShared.showToast(result.message || "Could not create channel.");
        } else {
          alert(result.message || "Could not create channel.");
        }
        return;
      }

      UnganiClientShared.closeModal();
    }

    // Channels are tenant-wide by design (sql/ungani-connect-phase1-channels.sql)
    // - every active team member already has access to every channel, the
    // same as the Team broadcast tab. There's no per-channel membership to
    // manage, so this is a read-only roster, not an invite/add flow - it
    // exists purely to make that "everyone already has access" fact
    // visible instead of leaving people to wonder how membership works.
    function openChannelMembersModal() {
      const roster = UnganiTeamChat.getRoster();
      const rows = [];

      if (roster.owner) {
        rows.push({ id: roster.owner.auth_user_id || "owner", name: roster.owner.full_name || "Owner", role: "Owner" });
      }
      (roster.members || []).forEach(function (m) {
        rows.push({ id: m.auth_user_id, name: m.full_name, role: m.role_key || "Staff" });
      });

      const listHtml = rows.map(function (r) {
        return `
          <div class="ttc-member-row">
            ${UnganiTeamChat.avatarHtml(r.id, r.name, 34)}
            <div>
              <div class="ttc-member-name">${UnganiClientShared.safe(r.name)}</div>
              <div class="ttc-member-role">${UnganiClientShared.safe(r.role)}</div>
            </div>
          </div>
        `;
      }).join("");

      UnganiClientShared.openModal({
        title: "Channel Members",
        bodyHtml: `
          <p style="margin:0 0 12px;font-size:12.5px;color:var(--ungani-muted);">Every active team member automatically has access to every channel - there's no separate invite step.</p>
          ${listHtml || '<p style="color:var(--ungani-muted);font-size:13px;">No other team members yet.</p>'}
        `
      });
    }

    function renderThreadHead() {
      const head = document.getElementById("ttcThreadHead");
      if (!head) return;

      const activeKey = UnganiTeamChat.getActiveKey();

      if (activeKey === "team") {
        head.innerHTML = `<div class="ttc-thread-head-row">${UnganiTeamChat.avatarHtml("team", "Team", 34)}<div><h3>Team</h3><p>Visible to your whole team.</p></div></div>`;
        return;
      }

      if (activeKey.indexOf("channel:") === 0) {
        const channelId = activeKey.slice(8);
        const channel = UnganiTeamChat.getChannelList().find(function (c) { return c.id === channelId; });
        const channelName = channel ? channel.name : "channel";
        const roster = UnganiTeamChat.getRoster();
        const memberCount = (roster.owner ? 1 : 0) + (roster.members || []).length;
        head.innerHTML = `
          <div class="ttc-thread-head-row">
            ${UnganiTeamChat.avatarHtml("channel", channelName, 34)}
            <div>
              <h3>#${UnganiClientShared.safe(channelName)}</h3>
              <p><button type="button" class="ttc-members-link" onclick="openChannelMembersModal()">${memberCount} member${memberCount === 1 ? "" : "s"}</button></p>
            </div>
          </div>
        `;
        return;
      }

      const list = UnganiTeamChat.getConversationList();
      const active = list.find(function (c) { return c.key === activeKey; });
      const label = active ? active.label : "Team";
      const avatarKey = active ? active.avatarKey : "team";
      const avatarName = active ? active.avatarName : label;
      head.innerHTML = `<div class="ttc-thread-head-row">${UnganiTeamChat.avatarHtml(avatarKey, avatarName, 34)}<div><h3>${UnganiClientShared.safe(label)}</h3><p>Private conversation.</p></div></div>`;
    }

    function renderMessages() {
      const box = document.getElementById("ttcMessages");
      if (!box) return;

      const rows = UnganiTeamChat.getMessagesForActive();
      const me = UnganiTeamChat.getMyIdentity();
      const activeKey = UnganiTeamChat.getActiveKey();

      const isChannel = activeKey.indexOf("channel:") === 0;
      const isMultiParty = activeKey === "team" || isChannel;

      if (!rows.length) {
        box.innerHTML = `
          <div class="ttc-empty">
            <h4>No messages yet</h4>
            <p>${isMultiParty ? "Send a quick note to get started." : "Send the first private message to start this conversation."}</p>
          </div>
        `;
        return;
      }

      const wasNearBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 80;

      box.innerHTML = rows.map(function (row) {
        const isMine = row.sender_user_id === me.authUserId;
        // realSenderName drives the avatar's initials/color (always the
        // actual person, even for your own messages, so the same person
        // gets the same avatar everywhere) - displayLabel is the visible
        // text label, which reads "You" instead of your own name.
        const realSenderName = UnganiClientShared.getValue(row, ["sender_name"], "Team Member");
        const displayLabel = isMine ? "You" : realSenderName;
        const body = UnganiClientShared.getValue(row, ["message_body", "message", "body"], "");
        const time = UnganiTeamChat.formatTime(UnganiClientShared.getValue(row, ["created_at"], ""));
        const avatar = UnganiTeamChat.avatarHtml(row.sender_user_id, realSenderName, 28);
        const receipt = isMine ? UnganiTeamChat.readReceiptHtml(row) : "";

        const bubbleHtml = `
          <div class="ttc-bubble ${isMine ? "mine" : "theirs"}">
            ${!isMultiParty ? "" : `<span class="ttc-sender">${UnganiClientShared.safe(displayLabel)}</span>`}
            <span style="white-space:pre-wrap;">${UnganiClientShared.safe(body)}</span>
            <span class="ttc-time">${UnganiClientShared.safe(time)}</span>${receipt}
          </div>
        `;

        // Avatar sits on the outside of the bubble on whichever side that
        // bubble is aligned to - left of "theirs" (left-aligned), right
        // of "mine" (right-aligned) - so identity is visible everywhere
        // without ever feeling mirrored/backwards.
        return `
          <div class="ttc-msg-row ${isMine ? "mine" : "theirs"}">
            ${isMine ? bubbleHtml + avatar : avatar + bubbleHtml}
          </div>
        `;
      }).join("");

      if (wasNearBottom) box.scrollTop = box.scrollHeight;
      if (window.lucide) window.lucide.createIcons();
    }
  </script>
</body>
</html>

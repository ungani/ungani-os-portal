<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>UNGANI OS - Item Profile</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="pwa-register.js"></script>
  <script src="ungani-theme.js"></script>
  <script src="client-shared.js" onerror="window.__unganiClientSharedFailed = true;"></script>
  <script src="team-chat-shared.js"></script>
  <script src="ungani-nav-config.js"></script>
  <script>
    (function () {
      function showUnganiLoadError() {
        if (typeof UnganiClientShared !== "undefined") return;

        var banner = document.createElement("div");
        banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#B91C1C;color:#fff;padding:12px 16px;font:14px/1.4 -apple-system,sans-serif;text-align:center;";
        banner.innerHTML = "Some page resources failed to load. Please check your connection. " +
          "<button style=\"margin-left:10px;padding:4px 12px;border:none;border-radius:6px;background:#fff;color:#B91C1C;font-weight:700;cursor:pointer;\" onclick=\"window.location.reload()\">Reload</button>";

        if (document.body) {
          document.body.prepend(banner);
        } else {
          document.addEventListener("DOMContentLoaded", function () {
            document.body.prepend(banner);
          });
        }
      }

      if (window.__unganiClientSharedFailed) {
        showUnganiLoadError();
      } else {
        setTimeout(function () {
          if (typeof UnganiClientShared === "undefined") showUnganiLoadError();
        }, 4000);
      }
    })();
  </script>
  <script src="ungani-business-config.js"></script>
  <script src="nia-assistant.js"></script>

  <style>
    .profile-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ungani-muted, #6B7280);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 14px;
    }

    .profile-back:hover {
      color: var(--ungani-navy, #061C3D);
    }

    .profile-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: flex-start;
    }

    .profile-photo {
      width: 100%;
      max-width: 320px;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .profile-photo img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .profile-hero h1 {
      margin: 0 0 6px;
      font-size: 26px;
      letter-spacing: -0.02em;
    }

    .profile-hero-sub {
      margin: 0 0 14px;
      color: var(--ungani-muted, #6B7280);
      font-size: 14px;
    }

    .profile-value-label {
      display: block;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--ungani-gold, #D4A63A);
      margin-bottom: 4px;
    }

    .profile-value {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .profile-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }

    @media (max-width: 720px) {
      .profile-hero {
        grid-template-columns: 1fr;
      }

      .profile-actions {
        flex-direction: row;
        align-items: center;
      }
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 24px;
    }

    @media (max-width: 640px) {
      .detail-grid {
        grid-template-columns: 1fr;
      }
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--ungani-border, rgba(6,28,61,0.1));
    }

    .detail-row label {
      color: var(--ungani-muted, #6B7280);
      font-size: 13px;
      font-weight: 700;
    }

    .detail-row span {
      text-align: right;
      font-size: 13.5px;
      font-weight: 700;
    }

    .profile-footer-meta {
      margin-top: 18px;
      color: var(--ungani-muted, #6B7280);
      font-size: 12.5px;
      text-align: center;
    }

    .timeline-list {
      display: grid;
      gap: 10px;
    }

    .timeline-item {
      position: relative;
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px 12px 12px 14px;
      border: 1px solid var(--ungani-border, rgba(6,28,61,0.1));
      background: var(--ungani-soft, rgba(6,28,61,0.03));
      border-radius: 14px;
      border-left: 3px solid var(--accent, var(--ungani-muted, #64748B));
    }

    .timeline-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      background: var(--ungani-card, #FFFFFF);
    }

    .timeline-icon svg {
      width: 16px;
      height: 16px;
      stroke-width: 2px;
    }

    .timeline-item strong {
      display: block;
      font-size: 13.5px;
    }

    .timeline-item p {
      margin: 2px 0 0;
      color: var(--ungani-muted, #6B7280);
      font-size: 12px;
      line-height: 1.4;
    }

    .timeline-time {
      white-space: nowrap;
    }

    @media (max-width: 560px) {
      .timeline-item {
        grid-template-columns: 30px minmax(0, 1fr);
      }

      .timeline-time {
        grid-column: 2;
        justify-self: start;
      }
    }

    .document-link-list {
      display: grid;
      gap: 10px;
    }

    .document-link-row {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px 12px 12px 14px;
      border: 1px solid var(--ungani-border, rgba(6,28,61,0.1));
      background: var(--ungani-soft, rgba(6,28,61,0.03));
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      transition: 0.18s ease;
    }

    .document-link-row:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px var(--ungani-shadow, rgba(6,28,61,0.1));
    }

    .document-link-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      background: var(--ungani-card, #FFFFFF);
    }

    .document-link-icon svg {
      width: 16px;
      height: 16px;
      stroke-width: 2px;
    }

    .document-link-body strong {
      display: block;
      font-size: 13.5px;
    }

    @media (max-width: 560px) {
      .document-link-row {
        grid-template-columns: 30px minmax(0, 1fr);
      }

      .document-link-row .ungani-badge {
        grid-column: 2;
        justify-self: start;
      }
    }

    .maintenance-due-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--ungani-border, rgba(6,28,61,0.1));
      background: var(--ungani-soft, rgba(6,28,61,0.03));
      border-radius: 14px;
      font-size: 13.5px;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <script>
    let currentContext = null;
    let isRealEstate = false;
    let currentItem = null;

    window.addEventListener("load", function () {
      UnganiClientShared.initPage({
        pageKey: "items",
        pageTitle: "Item Profile",
        pageSubtitle: "Full details for this item, property, or listing.",
        onReady: startItemProfilePage
      });
    });

    async function startItemProfilePage(context) {
      currentContext = context;
      isRealEstate = detectRealEstate(context.tenant);

      const itemId = new URLSearchParams(window.location.search).get("id");

      if (!itemId) {
        context.contentEl.innerHTML = UnganiClientShared.errorCard(
          "No item specified",
          "This link is missing the item to show. Go back to Items / Assets and click a record to view its profile."
        );
        return;
      }

      await loadItemProfile(itemId);
    }

    async function loadItemProfile(itemId) {
      currentContext.contentEl.innerHTML = UnganiClientShared.loadingCard("Loading item profile...");

      let response;

      try {
        response = await currentContext.supabaseClient
          .from("business_items")
          .select("*")
          .eq("id", itemId)
          .eq("tenant_id", currentContext.tenantId)
          .maybeSingle();
      } catch (error) {
        currentContext.contentEl.innerHTML = UnganiClientShared.errorCard(
          "Could not load item",
          error.message || "Network error. Please check your connection."
        );
        return;
      }

      if (response.error) {
        currentContext.contentEl.innerHTML = UnganiClientShared.errorCard("Could not load item", response.error.message);
        return;
      }

      if (!response.data) {
        currentContext.contentEl.innerHTML = UnganiClientShared.errorCard(
          isRealEstate ? "Property not found" : "Item not found",
          "This record may have been deleted, or it does not belong to your business."
        );
        return;
      }

      currentItem = response.data;

      const titleEl = document.querySelector(".ungani-topbar h2");
      if (titleEl) titleEl.innerText = getItemName(currentItem);

      renderItemProfile(currentItem);
    }

    // Property -> Units hierarchy (real client feedback: a building needs
    // its own snapshot of floors/units, each unit's own tenant/status, and
    // a rollup of income). parent_item_id is a plain nullable self-FK on
    // business_items (same shape as ungani_order_items.order_id), not a
    // stored "is this a building" flag - so "is this row a building" is
    // derived at render time by checking whether anything points at it.
    // Location/Property 360: uses the shared client-shared.js query
    // (loadLocationConnections) for units/tenants/commitments, rather than
    // this page's own copy - it used to query client_people.lease_end_date
    // directly, which went stale/empty once Cluster 4's full cutover moved
    // Real Estate lease data onto ungani_commitments (this page was missed
    // in that cutover pass since it's a separate standalone page from the
    // my-items.html side panel that WAS updated). Parent-property lookup
    // stays a local query since it's a distinct "breadcrumb" concept, not
    // part of "what's connected to this record".
    async function loadPropertyHierarchy(itemId) {
      if (!isRealEstate) return;

      const [connections, parentResponse] = await Promise.all([
        UnganiClientShared.loadLocationConnections(currentContext.supabaseClient, currentContext.tenantId, itemId),
        currentItem.parent_item_id
          ? currentContext.supabaseClient
              .from("business_items")
              .select("id, property_name, item_name, name")
              .eq("id", currentItem.parent_item_id)
              .maybeSingle()
          : Promise.resolve({ data: null, error: null })
      ]);

      const units = connections.units || [];
      const tenants = connections.tenants || [];
      const commitments = connections.commitments || [];
      const parent = parentResponse ? parentResponse.data : null;

      renderPropertyParentLink(parent);
      renderCurrentTenantCard(tenants, commitments);

      if (units.length > 0) {
        renderUnitsCard(units);
        await loadPropertyRollup(itemId, units.map(function (u) { return u.id; }));
      }
    }

    function renderPropertyParentLink(parent) {
      const el = document.getElementById("propertyParentLink");
      if (!el) return;

      if (!parent) {
        el.innerHTML = "";
        return;
      }

      const parentName = UnganiClientShared.getValue(parent, ["property_name", "item_name", "name"], "Property");
      el.innerHTML = `<a class="ungani-small" href="my-item-profile.html?id=${encodeURIComponent(parent.id)}">&larr; Belongs to: ${UnganiClientShared.safe(parentName)}</a>`;
    }

    function renderCurrentTenantCard(tenants, commitments) {
      const el = document.getElementById("currentTenantCard");
      if (!el) return;

      if (!tenants.length) {
        el.innerHTML = "";
        return;
      }

      const rowsHtml = tenants.map(function (person) {
        const name = UnganiClientShared.getValue(person, ["full_name", "name"], "Tenant");
        const commitment = (commitments || []).filter(function (c) { return String(c.person_id) === String(person.id); })[0];
        const lease = commitment && (commitment.start_date || commitment.end_date)
          ? `${commitment.start_date ? UnganiClientShared.formatDate(commitment.start_date) : "—"} to ${commitment.end_date ? UnganiClientShared.formatDate(commitment.end_date) : "—"}`
          : "No lease dates set";

        return `
          <div class="detail-row">
            <span>${UnganiClientShared.safe(name)}</span>
            <span class="ungani-small">${UnganiClientShared.safe(person.phone || "No phone")} · ${UnganiClientShared.safe(lease)}</span>
          </div>
        `;
      }).join("");

      el.innerHTML = `
        <div class="ungani-card" style="margin-top:18px;">
          <div class="ungani-section-title"><div><h3>Current Tenant</h3></div></div>
          ${rowsHtml}
        </div>
      `;
    }

    function renderUnitsCard(units) {
      const el = document.getElementById("propertyUnitsCard");
      if (!el) return;

      const rowsHtml = units.map(function (unit) {
        const name = getItemName(unit);
        const status = getStatus(unit);
        const floor = UnganiClientShared.getValue(unit.custom_fields || {}, ["floor_number"], "");
        const bedrooms = UnganiClientShared.getValue(unit, ["bedrooms"], "");
        const price = Number(UnganiClientShared.getValue(unit, ["property_price"], 0) || 0);

        return `
          <tr onclick="window.location.href='my-item-profile.html?id=${encodeURIComponent(unit.id)}'" style="cursor:pointer;">
            <td>${UnganiClientShared.safe(name)}</td>
            <td>${floor !== "" ? UnganiClientShared.safe(floor) : "—"}</td>
            <td>${bedrooms !== "" ? UnganiClientShared.safe(bedrooms) + " bed" : "—"}</td>
            <td>${statusBadge(status)}</td>
            <td>${price > 0 ? UnganiClientShared.safe(UnganiClientShared.formatKES(price)) : "—"}</td>
          </tr>
        `;
      }).join("");

      el.innerHTML = `
        <div class="ungani-card" style="margin-top:18px;">
          <div class="ungani-section-title">
            <div>
              <h3>Units</h3>
              <p class="ungani-small">${units.length} unit(s) in this property. Click one to see its own details.</p>
            </div>
          </div>
          <div class="people-table-wrap">
            <table class="ungani-table">
              <thead><tr><th>Unit</th><th>Floor</th><th>Bedrooms</th><th>Status</th><th>Price</th></tr></thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    // Sale-side categories come from the real estate "Sales" section's own
    // incomeCategories/expenseCategories (ungani-business-config.js) -
    // single source of truth, not a second hardcoded list, so this stays
    // correct if that section's categories ever change. Anything not in
    // this set (Rental Income, Booking Deposit, Management Fee, Property
    // Maintenance, or a freeform category) is treated as recurring rather
    // than a one-time sale.
    function getRealEstateSalesCategorySets() {
      const fallback = { income: ["Property Sale"], expense: ["Agent Commission", "Marketing / Advertising", "Legal / Documentation Fees"] };
      if (!window.UnganiBusinessConfig || typeof UnganiBusinessConfig.resolve !== "function") return fallback;

      const type = UnganiBusinessConfig.resolve(currentContext.tenant);
      const salesSection = type && Array.isArray(type.sections)
        ? type.sections.filter(function (s) { return s.key === "sales"; })[0]
        : null;

      return {
        income: (salesSection && salesSection.incomeCategories) || fallback.income,
        expense: (salesSection && salesSection.expenseCategories) || fallback.expense
      };
    }

    // Split into two blocks rather than one blended "Gross Revenue" figure -
    // a one-time property sale and recurring monthly rent are financially
    // different things and blending them (the old behavior) made a single
    // big sale look like an ongoing rental run-rate. Agent Commission is
    // its own line (real client meeting feedback) rather than a % rate,
    // since a sale commission is a real negotiated expense that's already
    // recorded, not a stored rate like the rental management commission.
    async function loadPropertyRollup(buildingId, unitIds) {
      const el = document.getElementById("propertyRollupCard");
      if (!el) return;

      const allIds = [buildingId].concat(unitIds);

      let response;

      try {
        response = await currentContext.supabaseClient
          .from("transactions")
          .select("transaction_type, amount, amount_kes, category")
          .eq("tenant_id", currentContext.tenantId)
          .in("related_item_id", allIds)
          .is("deleted_at", null);
      } catch (error) {
        el.innerHTML = '<div class="ungani-card" style="margin-top:18px;"><p class="ungani-small">Could not load financial rollup: ' + UnganiClientShared.safe(error.message) + "</p></div>";
        return;
      }

      const rows = (response && response.data) || [];
      const salesCategories = getRealEstateSalesCategorySets();

      let rentalIncome = 0;
      let rentalExpenses = 0;
      let saleProceeds = 0;
      let agentCommission = 0;
      let otherSaleCosts = 0;

      rows.forEach(function (row) {
        const amount = Number(UnganiClientShared.getValue(row, ["amount_kes", "amount"], 0) || 0);
        const type = String(UnganiClientShared.getValue(row, ["transaction_type"], "") || "").toLowerCase();
        const category = String(UnganiClientShared.getValue(row, ["category"], "") || "");
        const isIncome = type.indexOf("income") !== -1 || type.indexOf("revenue") !== -1;

        if (isIncome && salesCategories.income.indexOf(category) !== -1) {
          saleProceeds += amount;
        } else if (!isIncome && category === "Agent Commission") {
          agentCommission += amount;
        } else if (!isIncome && salesCategories.expense.indexOf(category) !== -1) {
          otherSaleCosts += amount;
        } else if (isIncome) {
          rentalIncome += amount;
        } else {
          rentalExpenses += amount;
        }
      });

      const commissionType = UnganiClientShared.getValue(currentItem, ["management_commission_type"], "");
      const commissionValue = Number(UnganiClientShared.getValue(currentItem, ["management_commission_value"], 0) || 0);
      const rentalCommission = commissionType === "percentage" ? rentalIncome * (commissionValue / 100) : (commissionType === "flat" ? commissionValue : 0);
      const netRentalIncome = rentalIncome - rentalCommission - rentalExpenses;

      const netSaleProceeds = saleProceeds - agentCommission - otherSaleCosts;
      const hasSaleActivity = saleProceeds > 0 || agentCommission > 0 || otherSaleCosts > 0;

      const rentalBlockHtml = `
        <div class="ungani-card" style="margin-top:18px;">
          <div class="ungani-section-title">
            <div>
              <h3>Rental Performance</h3>
              <p class="ungani-small">Recurring rent, deposits and management fees linked to this property and its units.</p>
            </div>
          </div>
          <div class="detail-grid">
            <div class="detail-row"><span>Gross Rental Income</span><span>${UnganiClientShared.safe(UnganiClientShared.formatKES(rentalIncome))}</span></div>
            <div class="detail-row"><span>Management Commission${commissionType ? " (" + (commissionType === "percentage" ? commissionValue + "%" : UnganiClientShared.formatKES(commissionValue)) + ")" : " (not set)"}</span><span>- ${UnganiClientShared.safe(UnganiClientShared.formatKES(rentalCommission))}</span></div>
            <div class="detail-row"><span>Expenses</span><span>- ${UnganiClientShared.safe(UnganiClientShared.formatKES(rentalExpenses))}</span></div>
            <div class="detail-row" style="font-weight:800;border-top:1px solid var(--border,#e2e5ea);padding-top:8px;margin-top:4px;"><span>Net Rental Income</span><span>${UnganiClientShared.safe(UnganiClientShared.formatKES(netRentalIncome))}</span></div>
          </div>
          ${!commissionType ? '<p class="ungani-small" style="margin-top:8px;opacity:.75;">Set a management commission rate on this property\'s Edit Details to include it here.</p>' : ""}
        </div>
      `;

      const saleBlockHtml = hasSaleActivity ? `
        <div class="ungani-card" style="margin-top:18px;">
          <div class="ungani-section-title">
            <div>
              <h3>Sale Proceeds</h3>
              <p class="ungani-small">A one-time sale, kept separate from the recurring rental figures above.</p>
            </div>
          </div>
          <div class="detail-grid">
            <div class="detail-row"><span>Sale Price</span><span>${UnganiClientShared.safe(UnganiClientShared.formatKES(saleProceeds))}</span></div>
            <div class="detail-row"><span>Agent Commission</span><span>- ${UnganiClientShared.safe(UnganiClientShared.formatKES(agentCommission))}</span></div>
            <div class="detail-row"><span>Marketing / Legal Costs</span><span>- ${UnganiClientShared.safe(UnganiClientShared.formatKES(otherSaleCosts))}</span></div>
            <div class="detail-row" style="font-weight:800;border-top:1px solid var(--border,#e2e5ea);padding-top:8px;margin-top:4px;"><span>Net Sale Proceeds</span><span>${UnganiClientShared.safe(UnganiClientShared.formatKES(netSaleProceeds))}</span></div>
          </div>
        </div>
      ` : "";

      el.innerHTML = rentalBlockHtml + saleBlockHtml;
    }

    function renderItemProfile(row) {
      const name = getItemName(row);
      const status = getStatus(row);
      const sectionLabel = UnganiClientShared.getValue(row, ["section_label"], "");
      const itemType = UnganiClientShared.getValue(row, ["item_type", "type"], isRealEstate ? "Property" : "Item");
      const value = Number(UnganiClientShared.getValue(row, ["property_price", "selling_price", "cost_price"], 0) || 0);
      const notes = UnganiClientShared.getValue(row, ["notes", "description"], "");
      const photo = UnganiClientShared.getValue(row, ["photo_url", "image_url", "thumbnail_url"], "");
      const fieldSet = UnganiBusinessConfig.resolveItemFieldSet(currentContext.tenant, sectionLabel);

      const backHref = isRealEstate ? "my-items.html" : "my-items.html";
      const editHref = "my-items.html?highlight=" + encodeURIComponent(row.id);

      const subtitleParts = [toTitle(itemType)];
      if (sectionLabel) subtitleParts.push(sectionLabel);

      currentContext.contentEl.innerHTML = `
        <a class="profile-back" href="${UnganiClientShared.attr(backHref)}">&larr; ${isRealEstate ? "Back to Properties" : "Back to Items"}</a>
        <div id="propertyParentLink" style="margin-bottom:8px;"></div>

        <div class="ungani-card">
          <div class="profile-hero">
            <div>
              ${photo ? `
                <div class="profile-photo">
                  <img src="${UnganiClientShared.attr(photo)}" alt="${UnganiClientShared.attr(name)}" onerror="this.parentElement.style.display='none';" />
                </div>
              ` : ""}

              <h1>${UnganiClientShared.safe(name)}</h1>
              <p class="profile-hero-sub">${UnganiClientShared.safe(subtitleParts.join(" · "))}</p>

              ${value > 0 ? `
                <span class="profile-value-label">${UnganiClientShared.safe(fieldSet.valueLabel || "Price / Value")}</span>
                <span class="profile-value">${UnganiClientShared.safe(UnganiClientShared.formatKES(value))}</span>
              ` : ""}
            </div>

            <div class="profile-actions">
              ${statusBadge(status)}
              <a class="ungani-btn gold" href="${UnganiClientShared.attr(editHref)}">Edit Details</a>
              <a class="ungani-btn dark" href="${UnganiClientShared.attr("my-item-label.html?id=" + encodeURIComponent(row.id))}">Print Label</a>
            </div>
          </div>
        </div>

        <div class="ungani-card" style="margin-top:18px;">
          <div class="ungani-section-title">
            <div>
              <h3>Details</h3>
            </div>
          </div>

          <div class="detail-grid">
            ${renderFieldRows(row, fieldSet)}
          </div>
        </div>

        <div id="currentTenantCard"></div>
        <div id="propertyUnitsCard"></div>
        <div id="propertyRollupCard"></div>

        <div class="ungani-card" style="margin-top:18px;">
          <div class="ungani-section-title">
            <div>
              <h3>Maintenance</h3>
              <p class="ungani-small">Scheduling and service history for this ${isRealEstate ? "property" : "item"}.</p>
            </div>
            <button class="ungani-btn small gold" type="button" onclick="openLogMaintenanceModal()">Log Maintenance</button>
          </div>

          <div class="maintenance-due-row">
            <span>Next Maintenance Due</span>
            ${maintenanceDueBadge(UnganiClientShared.getValue(row.custom_fields || {}, ["next_maintenance_date"], ""))}
          </div>

          <div id="itemLinkedTasksList" style="margin-top:12px;"></div>
        </div>

        <div class="ungani-card" style="margin-top:18px;">
          <div class="ungani-section-title">
            <div>
              <h3>Documents</h3>
              <p class="ungani-small">Files and records linked to this ${isRealEstate ? "property" : "item"}.</p>
            </div>
            <a class="ungani-btn small gold" href="${UnganiClientShared.attr("my-documents.html?action=add&linkedItemId=" + encodeURIComponent(row.id))}">Attach Document</a>
          </div>

          <div id="itemDocumentsList" class="document-link-list">
            <p class="ungani-small">Loading documents...</p>
          </div>
        </div>

        ${notes ? `
          <div class="ungani-card" style="margin-top:18px;">
            <div class="ungani-section-title">
              <div>
                <h3>Notes</h3>
              </div>
            </div>
            <p class="ungani-small" style="white-space:pre-wrap;">${UnganiClientShared.safe(notes)}</p>
          </div>
        ` : ""}

        <div class="ungani-card" style="margin-top:18px;">
          <div class="ungani-section-title">
            <div>
              <h3>Activity Timeline</h3>
              <p class="ungani-small">Everything logged against this record, newest first.</p>
            </div>
          </div>

          <div id="itemTimelineList" class="timeline-list">
            <p class="ungani-small">Loading activity...</p>
          </div>
        </div>

        <p class="profile-footer-meta">
          Added ${UnganiClientShared.safe(UnganiClientShared.formatDateTime(row.created_at))}
          ${row.updated_at ? " · Last updated " + UnganiClientShared.safe(UnganiClientShared.formatDateTime(row.updated_at)) : ""}
        </p>
      `;

      loadItemTimeline(row.id);
      loadItemDocuments(row.id);
      loadItemLinkedTasks(row.id);
      loadPropertyHierarchy(row.id);
    }

    // Any task tagged to this item (maintenance/electrician/watchman visit,
    // via tasks.linked_item_id) - not Real-Estate-gated, since any business
    // type's business_items row can have a task linked to it.
    async function loadItemLinkedTasks(itemId) {
      const el = document.getElementById("itemLinkedTasksList");
      if (!el) return;

      let response;

      try {
        response = await currentContext.supabaseClient
          .from("tasks")
          .select("id, task_title, status, due_date, assigned_to")
          .eq("tenant_id", currentContext.tenantId)
          .eq("linked_item_id", itemId)
          .is("deleted_at", null)
          .order("due_date", { ascending: true });
      } catch (error) {
        el.innerHTML = "";
        return;
      }

      const tasks = (response && response.data) || [];

      if (!tasks.length) {
        el.innerHTML = "";
        return;
      }

      el.innerHTML = tasks.map(function (t) {
        const title = UnganiClientShared.getValue(t, ["task_title"], "Task");
        const due = UnganiClientShared.getValue(t, ["due_date"], "");
        const assigned = UnganiClientShared.getValue(t, ["assigned_to"], "");

        return `
          <div class="detail-row">
            <span>${UnganiClientShared.safe(title)}</span>
            <span class="ungani-small">${assigned ? UnganiClientShared.safe(assigned) + " · " : ""}${due ? "Due " + UnganiClientShared.safe(UnganiClientShared.formatDate(due)) : "No due date"}</span>
          </div>
        `;
      }).join("");
    }

    async function loadItemDocuments(itemId) {
      const container = document.getElementById("itemDocumentsList");
      if (!container) return;

      let response;

      try {
        response = await currentContext.supabaseClient
          .from("documents")
          .select("id, document_title, document_type, document_date, status, file_url, file_name")
          .eq("linked_item_id", itemId)
          .eq("tenant_id", currentContext.tenantId)
          .order("document_date", { ascending: false });
      } catch (error) {
        container.innerHTML = `<p class="ungani-small">Could not load documents.</p>`;
        return;
      }

      if (response.error) {
        container.innerHTML = `<p class="ungani-small">Could not load documents.</p>`;
        return;
      }

      renderItemDocuments(response.data || []);
    }

    function renderItemDocuments(rows) {
      const container = document.getElementById("itemDocumentsList");
      if (!container) return;

      if (!rows.length) {
        container.innerHTML = `<p class="ungani-small">No documents linked yet - use "Attach Document" above to add one.</p>`;
        return;
      }

      container.innerHTML = rows.map(function (row) {
        const title = UnganiClientShared.getValue(row, ["document_title", "title", "name", "file_name"], "Document");
        const docType = UnganiClientShared.getValue(row, ["document_type", "type"], "Document");
        const editHref = "my-documents.html?highlight=" + encodeURIComponent(row.id);

        return `
          <a class="document-link-row" href="${UnganiClientShared.attr(row.file_url || editHref)}"${row.file_url ? ' target="_blank" rel="noopener noreferrer"' : ""}>
            <span class="document-link-icon"><i data-lucide="file-text"></i></span>
            <span class="document-link-body">
              <strong>${UnganiClientShared.safe(title)}</strong>
              <span class="ungani-small">${UnganiClientShared.safe(toTitle(docType))} · ${UnganiClientShared.safe(UnganiClientShared.formatDate(row.document_date))}</span>
            </span>
            ${documentStatusBadge(row.status)}
          </a>
        `;
      }).join("");
    }

    function documentStatusBadge(status) {
      const lower = String(status || "").toLowerCase();
      let color = "blue";

      if (lower.includes("active") || lower.includes("uploaded") || lower.includes("completed")) color = "green";
      else if (lower.includes("expired") || lower.includes("missing") || lower.includes("cancelled") || lower.includes("failed")) color = "red";
      else if (lower.includes("pending") || lower.includes("review")) color = "gold";

      return `<span class="ungani-badge ${color}">${UnganiClientShared.safe(toTitle(status || "active"))}</span>`;
    }

    async function loadItemTimeline(itemId) {
      const container = document.getElementById("itemTimelineList");
      if (!container) return;

      let response;

      try {
        response = await currentContext.supabaseClient
          .from("ungani_audit_log")
          .select("id, action, actor_email, description, metadata, created_at")
          .eq("entity_type", "business_items")
          .eq("entity_id", itemId)
          .eq("tenant_id", currentContext.tenantId)
          .order("created_at", { ascending: false })
          .limit(30);
      } catch (error) {
        container.innerHTML = `<p class="ungani-small">Could not load activity history.</p>`;
        return;
      }

      if (response.error) {
        container.innerHTML = `<p class="ungani-small">Could not load activity history.</p>`;
        return;
      }

      renderItemTimeline(response.data || []);
    }

    function renderItemTimeline(rows) {
      const container = document.getElementById("itemTimelineList");
      if (!container) return;

      if (!rows.length) {
        container.innerHTML = `<p class="ungani-small">No activity logged yet - creating, editing, or changing this record's status will show up here.</p>`;
        return;
      }

      container.innerHTML = rows.map(function (row) {
        return `
          <div class="timeline-item" style="--accent:${timelineActionAccent(row.action)};">
            <div class="timeline-icon">${timelineActionIcon(row.action)}</div>
            <div>
              <strong>${UnganiClientShared.safe(timelineActionLabel(row.action))}</strong>
              <p>${UnganiClientShared.safe(row.description || "")}${row.actor_email ? " · " + UnganiClientShared.safe(row.actor_email) : ""}</p>
            </div>
            <span class="ungani-small timeline-time">${UnganiClientShared.safe(timeAgo(row.created_at))}</span>
          </div>
        `;
      }).join("");
    }

    function timelineActionLabel(action) {
      const map = {
        record_created: "Item created",
        record_updated: "Details updated",
        status_changed: "Status changed",
        record_deleted: "Item deleted",
        maintenance_performed: "Maintenance logged"
      };

      return map[action] || UnganiClientShared.cleanText(action);
    }

    function timelineActionIcon(action) {
      const map = {
        record_created: '<i data-lucide="sparkles"></i>',
        record_updated: '<i data-lucide="pencil"></i>',
        status_changed: '<i data-lucide="refresh-cw"></i>',
        record_deleted: '<i data-lucide="trash-2"></i>',
        maintenance_performed: '<i data-lucide="wrench"></i>'
      };

      return map[action] || '<i data-lucide="clipboard-list"></i>';
    }

    function timelineActionAccent(action) {
      if (action === "record_created") return "#16A34A";
      if (action === "record_deleted") return "#DC2626";
      if (action === "status_changed" || action === "maintenance_performed") return "#D4A63A";
      return "#2563EB";
    }

    function timeAgo(timestamp) {
      if (!timestamp) return "";

      const then = new Date(timestamp).getTime();
      if (isNaN(then)) return "";

      const diffSeconds = Math.max(0, Math.floor((Date.now() - then) / 1000));

      if (diffSeconds < 60) return "Just now";
      if (diffSeconds < 3600) return Math.floor(diffSeconds / 60) + "m ago";
      if (diffSeconds < 86400) return Math.floor(diffSeconds / 3600) + "h ago";
      if (diffSeconds < 172800) return "Yesterday";
      if (diffSeconds < 604800) return Math.floor(diffSeconds / 86400) + "d ago";

      return UnganiClientShared.formatDate(timestamp);
    }

    function renderFieldRows(row, fieldSet) {
      const customFields = row.custom_fields || {};
      const fields = fieldSet.fields || [];

      if (!fields.length) {
        return `<div class="ungani-empty" style="grid-column:1/-1;"><p>No additional fields for this business type.</p></div>`;
      }

      return fields.map(function (field) {
        const raw = field.column
          ? UnganiClientShared.getValue(row, [field.column], "")
          : UnganiClientShared.getValue(customFields, [field.id], "");

        let valueHtml;

        if (!raw) {
          valueHtml = "—";
        } else if (field.type === "date") {
          valueHtml = UnganiClientShared.safe(UnganiClientShared.formatDate(raw));
        } else if (field.type === "url") {
          valueHtml = `<a href="${UnganiClientShared.attr(raw)}" target="_blank" rel="noopener noreferrer">View ↗</a>`;
        } else {
          valueHtml = UnganiClientShared.safe(raw);
        }

        return `
          <div class="detail-row">
            <label>${UnganiClientShared.safe(field.label)}</label>
            <span>${valueHtml}</span>
          </div>
        `;
      }).join("");
    }

    function getItemName(row) {
      return UnganiClientShared.getValue(row, ["property_name", "item_name", "name", "title"], isRealEstate ? "Property" : "Item");
    }

    function getStatus(row) {
      return UnganiClientShared.getValue(row, ["property_status", "item_status", "status"], "available");
    }

    function statusBadge(status) {
      const color = statusColor(status);
      return `<span class="ungani-badge ${UnganiClientShared.attr(color)}">${UnganiClientShared.safe(toTitle(status))}</span>`;
    }

    function statusColor(status) {
      const lower = String(status || "").toLowerCase();

      if (lower.includes("available") || lower.includes("sold") || lower.includes("rented") || lower.includes("completed")) return "green";
      if (lower.includes("reserved") || lower.includes("negotiation") || lower.includes("pending") || lower.includes("review")) return "gold";
      if (lower.includes("maintenance") || lower.includes("inactive") || lower.includes("cancelled") || lower.includes("lost")) return "red";

      return "blue";
    }

    function toTitle(value) {
      return String(value || "")
        .replace(/_/g, " ")
        .replace(/\w\S*/g, function (text) {
          return text.charAt(0).toUpperCase() + text.substr(1).toLowerCase();
        });
    }

    // ---- Maintenance (Phase 5 of the Asset Management module) ----
    // Universal, custom_fields-only - no schema change. next_maintenance_date
    // is written by my-items.html's form and by submitMaintenanceLog() here;
    // "maintenance_performed" audit log entries render automatically in the
    // Activity Timeline above (Phase 2) once mapped in timelineActionLabel/
    // timelineActionIcon/timelineActionAccent.

    function daysUntil(dateStr) {
      const target = new Date(dateStr);
      if (isNaN(target.getTime())) return null;

      const now = new Date();
      target.setHours(0, 0, 0, 0);
      now.setHours(0, 0, 0, 0);

      return Math.round((target.getTime() - now.getTime()) / 86400000);
    }

    function maintenanceDueBadge(dateStr) {
      if (!dateStr) {
        return '<span class="ungani-badge blue">Not scheduled</span>';
      }

      const days = daysUntil(dateStr);
      const formatted = UnganiClientShared.formatDate(dateStr);

      if (days === null) {
        return '<span class="ungani-badge blue">' + UnganiClientShared.safe(formatted) + '</span>';
      }

      if (days < 0) {
        return '<span class="ungani-badge red">' + UnganiClientShared.safe(formatted) + ' – overdue</span>';
      }

      if (days <= 30) {
        return '<span class="ungani-badge gold">' + UnganiClientShared.safe(formatted) + ' – due soon</span>';
      }

      return '<span class="ungani-badge green">' + UnganiClientShared.safe(formatted) + '</span>';
    }

    function openLogMaintenanceModal() {
      if (!currentItem) return;

      const customFields = currentItem.custom_fields || {};
      const currentNextDue = customFields.next_maintenance_date || "";
      const today = new Date().toISOString().slice(0, 10);

      UnganiClientShared.openModal({
        title: "Log Maintenance",
        bodyHtml: `
          <form id="maintenanceForm" onsubmit="submitMaintenanceLog(event)">
            <label for="maintenancePerformedDate">Date Performed</label>
            <input id="maintenancePerformedDate" type="date" required value="${UnganiClientShared.attr(today)}" />

            <label for="maintenanceNotes">Notes (optional)</label>
            <textarea id="maintenanceNotes" placeholder="What was done, cost, technician..."></textarea>

            <label for="maintenanceNextDue">Next Maintenance Due (optional)</label>
            <input id="maintenanceNextDue" type="date" value="${UnganiClientShared.attr(currentNextDue)}" />

            <div class="ungani-button-row">
              <button class="ungani-btn green" type="submit">Save</button>
              <button class="ungani-btn dark" type="button" onclick="UnganiClientShared.closeModal()">Cancel</button>
            </div>
          </form>
        `
      });
    }

    async function submitMaintenanceLog(event) {
      event.preventDefault();
      if (!currentItem) return;

      const performedDate = UnganiClientShared.value("maintenancePerformedDate");
      const notes = UnganiClientShared.value("maintenanceNotes");
      const nextDue = UnganiClientShared.value("maintenanceNextDue") || null;

      const updatedCustomFields = Object.assign({}, currentItem.custom_fields || {}, { next_maintenance_date: nextDue });

      try {
        const response = await currentContext.supabaseClient
          .from("business_items")
          .update({ custom_fields: updatedCustomFields, updated_at: new Date().toISOString() })
          .eq("id", currentItem.id)
          .eq("tenant_id", currentContext.tenantId);

        if (response.error) {
          UnganiClientShared.showToast("Could not log maintenance: " + response.error.message);
          return;
        }

        let description = "Maintenance performed on " + UnganiClientShared.formatDate(performedDate);
        if (notes) description += " – " + notes;
        description += nextDue ? ". Next due " + UnganiClientShared.formatDate(nextDue) + "." : ".";

        // Awaited (unlike the fire-and-forget logAuditEvent() calls
        // elsewhere in this module) because the very next step reloads
        // this same page's own Activity Timeline, which reads this same
        // audit log back - without awaiting, the reload's read can race
        // ahead of this write completing, and the just-logged entry
        // wouldn't show up until a second refresh.
        await UnganiClientShared.logAuditEvent("maintenance_performed", {
          entityType: "business_items",
          entityId: String(currentItem.id),
          description: description,
          metadata: { performed_date: performedDate, notes: notes || null, next_due: nextDue }
        });

        UnganiClientShared.showToast("Maintenance logged ✓");
        UnganiClientShared.closeModal();

        await loadItemProfile(currentItem.id);
      } catch (error) {
        UnganiClientShared.showToast("Could not log maintenance: " + ((error && error.message) || "Network error. Please check your connection."));
      }
    }

    function detectRealEstate(tenant) {
      if (window.UnganiBusinessConfig && typeof UnganiBusinessConfig.resolve === "function") {
        const matched = UnganiBusinessConfig.resolve(tenant);
        if (matched) return matched.key === "real_estate";
      }

      const businessType = String(UnganiClientShared.getValue(tenant, ["business_type", "business_type_key"], "")).toLowerCase();
      const businessTypeKey = String(UnganiClientShared.getValue(tenant, ["business_type_key"], "")).toLowerCase();

      return businessType.includes("real estate") || businessTypeKey.includes("real_estate");
    }
  </script>

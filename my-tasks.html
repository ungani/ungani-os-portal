<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>UNGANI OS - Tasks</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="pwa-register.js"></script>
  <script src="ungani-theme.js"></script>
  <script src="client-shared.js" onerror="window.__unganiClientSharedFailed = true;"></script>
  <script src="team-chat-shared.js"></script>
  <script src="ungani-connect-panel.js"></script>
  <script src="ungani-nav-config.js"></script>
  <script>
    (function () {
      function showUnganiLoadError() {
        if (typeof UnganiClientShared !== "undefined") return;

        var banner = document.createElement("div");
        banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#B91C1C;color:#fff;padding:12px 16px;font:14px/1.4 -apple-system,sans-serif;text-align:center;";
        banner.innerHTML = "Some page resources failed to load. Please check your connection. " +
          "<button style=\"margin-left:10px;padding:4px 12px;border:none;border-radius:6px;background:#fff;color:#B91C1C;font-weight:700;cursor:pointer;\" onclick=\"window.location.reload()\">Reload</button>";

        if (document.body) {
          document.body.prepend(banner);
        } else {
          document.addEventListener("DOMContentLoaded", function () {
            document.body.prepend(banner);
          });
        }
      }

      if (window.__unganiClientSharedFailed) {
        showUnganiLoadError();
      } else {
        setTimeout(function () {
          if (typeof UnganiClientShared === "undefined") showUnganiLoadError();
        }, 4000);
      }
    })();
  </script>
  <script src="ungani-business-config.js"></script>
  <script src="ungani-analytics.js"></script>
  <script src="ungani-presets.js"></script>
  <script src="nia-assistant.js"></script>
</head>

<body>
  <script>
    let currentContext = null;
    let businessPreset = null;
    let taskRows = [];
    let editingTaskId = null;
    let highlightApplied = false;
    let sectionOptions = [];
    let currentSectionFilter = "";
    let activeTaskCategory = "all";
    let lastStatusRows = [];
    let lastPriorityRows = [];
    let urlActionApplied = false;

    // "My Tasks" filtering + the assignee picker both key off who's
    // actually logged in - resolved once at page load via the app's single
    // source of truth for owner/staff identity (the same RPC the page
    // guards use), not re-derived here.
    let myStaffAccess = null;
    let assignableTeamMembers = [];
    let editingTaskOriginalAssignee = { teamMemberId: null, isOwner: false };
    let editingTaskOriginalStatus = "";

    // See my-money.html for the full rationale: taskSummaryRows covers every
    // row in the current tenant/section/status/priority/search scope with
    // only narrow columns (not select("*")) - drives KPI counts, charts,
    // and category tile counts. taskRows is the wide (select *) data for
    // just the current page's ids.
    const TASK_PAGE_SIZE = 50;
    let taskSummaryRows = [];
    let taskPageOffset = 0;
    let taskIsLoadingMore = false;
    let taskSearchDebounceTimer = null;

    const TILE_PALETTE = ["#D4A63A", "#2563EB", "#16A34A", "#DC2626", "#7C3AED", "#0EA5E9", "#EA580C", "#059669", "#DB2777"];

    window.addEventListener("load", function () {
      UnganiClientShared.initPage({
        pageKey: "tasks",
        pageTitle: "Tasks",
        pageSubtitle: "Manage tasks, follow-ups, reminders, and work progress.",
        onReady: startTasksPage
      });
    });

    async function startTasksPage(context) {
      currentContext = context;

      if (window.UnganiAnalytics) {
        UnganiAnalytics.injectChartStyles();
      }

      businessPreset = UnganiPresets.getPreset(context.tenant);
      sectionOptions = businessPreset.selectedSectionLabels || [];
      currentSectionFilter = new URLSearchParams(window.location.search).get("section") || "";

      const titleEl = document.querySelector(".ungani-topbar h2");
      const subEl = document.querySelector(".ungani-topbar p");

      if (titleEl) {
        titleEl.innerText = businessPreset.tasksLabel;
      }

      if (subEl) {
        subEl.innerText = "Tasks, follow-ups, reminders, and deadlines for " + businessPreset.name + ".";
      }

      await loadMyStaffAccessAndTeamMembers();
      await loadTaskRows();
    }

    async function loadMyStaffAccessAndTeamMembers() {
      try {
        const accessResponse = await currentContext.supabaseClient.rpc("get_my_ungani_staff_access");
        myStaffAccess = (!accessResponse.error && accessResponse.data) ? accessResponse.data : null;
      } catch (error) {
        console.warn("Could not load staff access:", error.message);
        myStaffAccess = null;
      }

      try {
        const membersResponse = await currentContext.supabaseClient.rpc("get_my_ungani_team_members_for_assignment");
        assignableTeamMembers = (!membersResponse.error && membersResponse.data && membersResponse.data.ok === true)
          ? (membersResponse.data.members || [])
          : [];
      } catch (error) {
        console.warn("Could not load team members for assignment:", error.message);
        assignableTeamMembers = [];
      }
    }

    // "type" removed - never written anywhere for tasks (saveTaskRecord()'s
    // payload only ever writes task_type). Same bug class as documents.type,
    // introduced by the same commit (ae27767) across all six list pages -
    // this one hadn't been hit live yet, found via a full repo sweep.
    const TASK_SUMMARY_COLUMNS = "id, status, priority, due_date, task_type";

    function applyTaskCommonFilters(query) {
      query = query.eq("tenant_id", currentContext.tenantId);

      if (currentSectionFilter) {
        query = query.eq("section_label", currentSectionFilter);
      }

      const filterStatus = getStoredOrInput("filterStatus", "ungani_task_filter_status").toLowerCase();
      if (filterStatus) {
        query = query.ilike("status", "%" + UnganiClientShared.escapePostgrestFilterValue(filterStatus) + "%");
      }

      const filterPriority = getStoredOrInput("filterPriority", "ungani_task_filter_priority").toLowerCase();
      if (filterPriority) {
        query = query.ilike("priority", "%" + UnganiClientShared.escapePostgrestFilterValue(filterPriority) + "%");
      }

      const search = getStoredOrInput("filterSearch", "ungani_task_filter_search").trim();
      if (search) {
        query = query.or(UnganiClientShared.buildSearchOrFilter(["task_title", "assigned_to", "notes"], search));
      }

      if (isMyTasksOnlyChecked()) {
        if (myStaffAccess && myStaffAccess.is_owner === true) {
          query = query.eq("assigned_to_is_owner", true);
        } else if (myStaffAccess && myStaffAccess.team_member_id) {
          query = query.eq("assigned_to_team_member_id", myStaffAccess.team_member_id);
        } else {
          // No resolvable identity yet (access still loading, or a guest
          // session) - "my tasks" can't mean anything real here, so match
          // nothing rather than silently showing everyone's tasks.
          query = query.eq("id", "00000000-0000-0000-0000-000000000000");
        }
      }

      return query;
    }

    function isMyTasksOnlyChecked() {
      const el = document.getElementById("filterMyTasksOnly");
      if (el) return el.checked;
      return sessionStorage.getItem("ungani_task_filter_my_tasks_only") === "true";
    }

    async function loadTaskSummaryRows() {
      let response;

      try {
        response = await applyTaskCommonFilters(
          currentContext.supabaseClient.from("tasks").select(TASK_SUMMARY_COLUMNS)
        ).order("created_at", { ascending: false });
      } catch (error) {
        return { error: error.message || "Network error. Please check your connection." };
      }

      if (response.error) {
        return { error: response.error.message };
      }

      taskSummaryRows = response.data || [];
      return { error: null };
    }

    function getTaskCategoryFilteredIds() {
      const categories = buildTaskCategories();
      const category = categories.find(function (item) { return item.key === activeTaskCategory; }) || categories[0];
      return taskSummaryRows.filter(category.match).map(function (row) { return row.id; });
    }

    function taskHasMoreRows() {
      return taskPageOffset < getTaskCategoryFilteredIds().length;
    }

    async function exportTaskCsv() {
      await UnganiClientShared.exportRecordsToCsv({
        supabaseClient: currentContext.supabaseClient,
        table: "tasks",
        ids: getTaskCategoryFilteredIds(),
        filenamePrefix: "tasks"
      });
    }

    async function loadTaskPage(replace) {
      if (replace) {
        taskPageOffset = 0;
      }

      const allIds = getTaskCategoryFilteredIds();
      const pageIds = allIds.slice(taskPageOffset, taskPageOffset + TASK_PAGE_SIZE);

      if (!pageIds.length) {
        if (replace) taskRows = [];
        return { error: null };
      }

      let response;

      try {
        response = await currentContext.supabaseClient
          .from("tasks")
          .select("*")
          .in("id", pageIds)
          .order("created_at", { ascending: false });
      } catch (error) {
        return { error: error.message || "Network error. Please check your connection." };
      }

      if (response.error) {
        return { error: response.error.message };
      }

      const newRows = response.data || [];
      taskRows = replace ? newRows : taskRows.concat(newRows);
      taskPageOffset += pageIds.length;

      return { error: null };
    }

    async function loadTaskRows() {
      currentContext.contentEl.innerHTML = UnganiClientShared.loadingCard("Loading tasks...");

      const summaryResult = await loadTaskSummaryRows();

      if (summaryResult.error) {
        UnganiClientShared.setContent(
          UnganiClientShared.errorCard("Could not load tasks", summaryResult.error)
        );
        return;
      }

      const pageResult = await loadTaskPage(true);

      if (pageResult.error) {
        UnganiClientShared.setContent(
          UnganiClientShared.errorCard("Could not load tasks", pageResult.error)
        );
        return;
      }

      renderTasksPage();
    }

    async function refreshTaskData() {
      const focusedId = document.activeElement ? document.activeElement.id : null;

      const summaryResult = await loadTaskSummaryRows();

      if (summaryResult.error) {
        UnganiClientShared.showToast("Could not update tasks: " + summaryResult.error);
        return;
      }

      const pageResult = await loadTaskPage(true);

      if (pageResult.error) {
        UnganiClientShared.showToast("Could not update tasks: " + pageResult.error);
        return;
      }

      renderTasksPage();

      if (focusedId) {
        const el = document.getElementById(focusedId);
        if (el && typeof el.focus === "function") el.focus();
      }
    }

    async function loadMoreTaskRows() {
      if (taskIsLoadingMore) return;
      taskIsLoadingMore = true;

      const btn = document.getElementById("taskLoadMoreBtn");
      if (btn) {
        btn.disabled = true;
        btn.innerText = "Loading...";
      }

      const result = await loadTaskPage(false);

      taskIsLoadingMore = false;

      if (result.error) {
        UnganiClientShared.showToast("Could not load more tasks: " + result.error);
        return;
      }

      renderTasksPage();
    }

    function onTaskSearchInput() {
      saveTaskFilters();

      if (taskSearchDebounceTimer) clearTimeout(taskSearchDebounceTimer);
      taskSearchDebounceTimer = setTimeout(refreshTaskData, 350);
    }

    function onTaskFilterChange() {
      saveTaskFilters();
      refreshTaskData();
    }

    function renderTasksPage() {
      const filteredRows = getFilteredRows();
      const categories = buildTaskCategories();
      const category = categories.find(function (item) { return item.key === activeTaskCategory; }) || categories[0];
      const summaryScopeRows = taskSummaryRows.filter(category.match);
      const summary = calculateTaskSummary(summaryScopeRows);
      const statusRows = buildStatusRows(summaryScopeRows);
      const priorityRows = buildPriorityRows(summaryScopeRows);

      lastStatusRows = statusRows;
      lastPriorityRows = priorityRows;

      UnganiClientShared.setContent(`
        <style>
          .tasks-hero-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
            gap: 18px;
            align-items: stretch;
          }

          .tasks-preset-box {
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(255,255,255,0.09);
            border-radius: 24px;
            padding: 18px;
          }

          .tasks-preset-box h3 {
            color: white;
            margin: 0 0 8px;
          }

          .tasks-preset-box p {
            color: rgba(255,255,255,0.74);
            margin: 0;
            line-height: 1.55;
          }

          .task-chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
          }

          .task-chip {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 8px 11px;
            background: rgba(255,255,255,0.12);
            color: white;
            font-size: 12px;
            font-weight: 850;
          }

          .task-kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 18px;
          }

          .task-kpi-card {
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            background: var(--ungani-card);
            border: 1px solid var(--ungani-border);
            box-shadow: var(--ungani-shadow);
            padding: 20px;
            min-height: 140px;
          }

          .task-kpi-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 18px;
            bottom: 18px;
            width: 5px;
            border-radius: 0 999px 999px 0;
            background: var(--accent);
          }

          .task-kpi-card span {
            color: var(--ungani-muted);
            font-size: 12px;
            font-weight: 950;
            text-transform: uppercase;
            letter-spacing: 0.055em;
          }

          .task-kpi-card h3 {
            margin: 17px 0 8px;
            font-size: clamp(25px, 3vw, 36px);
            line-height: 1;
            letter-spacing: -0.055em;
          }

          .task-kpi-card p {
            margin: 0;
            color: var(--ungani-muted);
            font-size: 13px;
          }

          .task-form-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
          }

          .task-form-grid .wide {
            grid-column: span 3;
          }

          .task-chart-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            margin-bottom: 18px;
            align-items: start;
          }

          .task-type-section {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
          }

          .type-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
          }

          .type-pill {
            border: 1px solid var(--ungani-border);
            background: var(--ungani-soft);
            color: var(--ungani-text);
            border-radius: 999px;
            padding: 8px 11px;
            font-size: 12px;
            font-weight: 850;
            cursor: pointer;
          }

          .type-pill:hover {
            border-color: rgba(212,166,58,0.65);
          }

          .category-tiles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 18px;
          }

          .category-tile {
            background: var(--ungani-card);
            border: 1px solid var(--ungani-border);
            border-left: 5px solid var(--tile-accent, var(--ungani-gold));
            border-radius: 18px;
            padding: 14px 16px;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            transition: 0.18s ease;
          }

          .category-tile:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px var(--ungani-shadow);
          }

          .category-tile.active {
            box-shadow: 0 0 0 2px var(--tile-accent, var(--ungani-gold));
          }

          .category-tile .tile-count {
            display: block;
            font-size: 22px;
            font-weight: 900;
            color: var(--ungani-text);
          }

          .category-tile .tile-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--ungani-muted);
            margin-top: 4px;
          }

          .task-table-wrap {
            overflow-x: auto;
          }

          .task-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 780px;
          }

          .task-table th {
            text-align: left;
            color: var(--ungani-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 13px 12px;
            border-bottom: 1px solid var(--ungani-border);
          }

          .task-table td {
            padding: 14px 12px;
            border-bottom: 1px solid var(--ungani-border);
            vertical-align: top;
          }

          .task-table td:first-child {
            border-left: 4px solid var(--accent, #64748B);
          }

          .task-table tbody tr {
            cursor: pointer;
          }

          .task-table tbody tr:hover td {
            background: var(--ungani-soft);
          }

          .insights-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            width: 100%;
            text-align: left;
            background: var(--ungani-card);
            border: 1px solid var(--ungani-border);
            border-left: 6px solid var(--ungani-gold);
            border-radius: 20px;
            padding: 16px 18px;
            margin-bottom: 18px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.18s ease;
          }

          .insights-banner:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px var(--ungani-shadow);
          }

          .insights-banner strong {
            font-size: 16px;
            color: var(--ungani-text);
          }

          .insights-banner .insights-sub {
            display: block;
            margin-top: 3px;
            color: var(--ungani-muted);
            font-size: 13px;
          }

          .insights-banner .insights-cta {
            color: var(--ungani-gold);
            font-weight: 800;
            font-size: 13px;
            white-space: nowrap;
          }

          .task-table .row-sub {
            display: block;
            color: var(--ungani-muted);
            font-size: 12px;
            margin-top: 2px;
          }

          @media (max-width: 1180px) {
            .tasks-hero-grid,
            .task-chart-grid {
              grid-template-columns: 1fr;
            }

            .task-kpi-grid {
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }
          }

          @media (max-width: 720px) {
            .task-kpi-grid,
            .task-form-grid {
              grid-template-columns: 1fr;
            }

            .task-form-grid .wide {
              grid-column: span 1;
            }
          }

        </style>

        <section class="ungani-card ungani-hero">
          <div class="tasks-hero-grid">
            <div>
              <span class="ungani-badge gold">${UnganiClientShared.safe(businessPreset.name)}</span>
              <h2 style="font-size:clamp(32px,4vw,52px);line-height:1.02;margin:18px 0 12px;">
                Tasks that match your business workflow.
              </h2>
              <p>
                Create follow-ups, reminders, operational tasks, deadlines, and work actions using presets for ${UnganiClientShared.safe(businessPreset.name)}.
              </p>

              <div class="ungani-button-row">
                <button class="ungani-btn gold" onclick="openTaskModal()">Add Task</button>
                <button class="ungani-btn green" onclick="loadTaskRows()">Refresh</button>
                <a class="ungani-btn light" href="my-charts.html">View Charts</a>
              </div>

              ${renderSectionSwitcher()}
            </div>

            <div class="tasks-preset-box">
              <h3>Business task preset active</h3>
              <p>The task types on this page now adapt to the business type selected by the client.</p>

              <div class="task-chip-row">
                ${businessPreset.taskTypes.slice(0, 6).map(function (item) {
                  return `<span class="task-chip">${UnganiClientShared.safe(item)}</span>`;
                }).join("")}
              </div>
            </div>
          </div>
        </section>

        ${renderCategoryTiles()}

        <section class="task-kpi-grid">
          ${taskKpi("Pending", summary.pending, "Tasks not completed", "#D4A63A")}
          ${taskKpi("In Progress", summary.inProgress, "Work currently moving", "#2563EB")}
          ${taskKpi("Completed", summary.completed, "Finished tasks", "#16A34A")}
          ${taskKpi("Overdue", summary.overdue, "Needs attention", summary.overdue > 0 ? "#DC2626" : "#16A34A")}
        </section>

        <section class="ungani-card">
          <div class="ungani-section-title">
            <div>
              <h3>Filters</h3>
              <p class="ungani-small">Search and filter this business task view.</p>
            </div>

            <button class="ungani-btn dark" onclick="resetTaskFilters()">Reset Filters</button>
          </div>

          <div class="task-form-grid">
            <div>
              <label for="filterStatus">Status</label>
              <select id="filterStatus" onchange="onTaskFilterChange();">
                <option value="">All Status</option>
                <option value="pending">Pending</option>
                <option value="in progress">In Progress</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>

            <div>
              <label for="filterPriority">Priority</label>
              <select id="filterPriority" onchange="onTaskFilterChange();">
                <option value="">All Priority</option>
                <option value="low">Low</option>
                <option value="normal">Normal</option>
                <option value="high">High</option>
                <option value="urgent">Urgent</option>
              </select>
            </div>

            <div>
              <label for="filterSearch">Search</label>
              <input id="filterSearch" placeholder="Search task, type, assigned person..." oninput="onTaskSearchInput();" />
            </div>

            ${myStaffAccess && (myStaffAccess.is_owner === true || myStaffAccess.team_member_id) ? `
              <div style="display:flex;align-items:flex-end;">
                <label style="flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:normal;font-weight:600;">
                  <input id="filterMyTasksOnly" type="checkbox" style="width:auto;" onchange="onTaskFilterChange();" />
                  My Tasks Only
                </label>
              </div>
            ` : ""}
          </div>
        </section>

        <button type="button" class="insights-banner" onclick="openInsightsModal()">
          <span>
            <strong>📊 Insights &amp; Tools</strong>
            <span class="insights-sub">Charts, quick-fill task types, and the task guide</span>
          </span>
          <span class="insights-cta">Open →</span>
        </button>

        <section class="ungani-card">
          <div class="ungani-section-title">
            <div>
              <h3>Task List</h3>
              <p class="ungani-small">${filteredRows.length} of ${summaryScopeRows.length} task(s) shown.</p>
            </div>

            <div class="ungani-button-row" style="margin-top:0;">
              <button class="ungani-btn gold" onclick="openTaskModal()">+ Add Task</button>
              <button class="ungani-btn green" onclick="loadTaskRows()">Refresh</button>
              <button class="ungani-btn dark" onclick="exportTaskCsv()">Export CSV</button>
            </div>
          </div>

          ${renderTaskList(filteredRows)}

          ${taskHasMoreRows() ? `
            <div class="ungani-button-row" style="justify-content:center; margin-top:14px;">
              <button class="ungani-btn dark" id="taskLoadMoreBtn" onclick="loadMoreTaskRows()">Load More Tasks</button>
            </div>
          ` : ""}
        </section>

        <p class="ungani-small">
          Tasks Version: Step 310B-2 Business-Type Task Presets · ungani.com · info@ungani.com
        </p>
      `);

      restoreTaskFilters();

      applyHighlightFromUrl();
    }

    function openInsightsModal() {
      const bodyHtml = `
        <div class="task-chart-grid" style="margin-bottom:18px;">
          <div class="ungani-card ungani-chart-card" style="box-shadow:none;">
            <div class="ungani-chart-head">
              <div>
                <h3>Task Status</h3>
                <p class="ungani-small">Animated chart showing task progress.</p>
              </div>
            </div>

    async function applyHighlightFromUrl() {
      if (!highlightApplied) {
        const highlightId = new URLSearchParams(window.location.search).get("highlight");

        if (highlightId) {
          let row = taskRows.find(function (item) { return String(item.id) === String(highlightId); });

          // With pagination, a deep-linked task may not be on the
          // currently loaded page - fetch it directly rather than
          // silently failing to open it.
          if (!row) {
            try {
              const lookup = await currentContext.supabaseClient
                .from("tasks")
                .select("*")
                .eq("id", highlightId)
                .eq("tenant_id", currentContext.tenantId)
                .maybeSingle();

              if (lookup.data) {
                row = lookup.data;
                taskRows = [row].concat(taskRows);
              }
            } catch (error) {
              console.warn("Highlight lookup failed:", error.message);
            }
          }

          if (row) {
            highlightApplied = true;
            setTimeout(function () { openTaskModal(highlightId); }, 250);
            return;
          }
        }
      }

      applyUrlActions();
    }

    function applyUrlActions() {
      if (urlActionApplied) return;

      if (action !== "add") return;

      urlActionApplied = true;

    function calculateTaskSummary(rows) {
      const today = new Date().toISOString().slice(0, 10);
      let pending = 0;
      let inProgress = 0;
      let completed = 0;
      let overdue = 0;

      rows.forEach(function (row) {
        const status = String(UnganiClientShared.getValue(row, ["status"], "pending")).toLowerCase();
        const due = String(UnganiClientShared.getValue(row, ["due_date"], "")).slice(0, 10);

        if (status.includes("completed")) {
          completed++;
        } else if (status.includes("progress")) {
          inProgress++;
        } else if (!status.includes("cancelled")) {
          pending++;
        }

        if (due && due < today && !status.includes("completed") && !status.includes("cancelled")) {
          overdue++;
        }
      });

      return { pending, inProgress, completed, overdue };
    }

    function buildStatusRows(rows) {
      const today = new Date().toISOString().slice(0, 10);
      const map = {
        Pending: 0,
        "In Progress": 0,
        Completed: 0,
        Overdue: 0
      };

      rows.forEach(function (row) {
        const status = String(UnganiClientShared.getValue(row, ["status"], "pending")).toLowerCase();
        const due = String(UnganiClientShared.getValue(row, ["due_date"], "")).slice(0, 10);

        if (due && due < today && !status.includes("completed") && !status.includes("cancelled")) {
          map.Overdue += 1;
        }

        if (status.includes("completed")) {
          map.Completed += 1;
        } else if (status.includes("progress")) {
          map["In Progress"] += 1;
        } else if (!status.includes("cancelled")) {
          map.Pending += 1;
        }
      });

      return UnganiAnalytics.mapToRows(map);
    }

      });

      return UnganiAnalytics.mapToRows(map);
    }

    async function saveTaskRecord(event) {
      event.preventDefault();

      const title = UnganiClientShared.value("taskTitle");

      if (!title) {
        UnganiClientShared.showToast("Enter a task title.");
        return;
      }

      const submitBtn = event.submitter || event.target.querySelector('button[type="submit"]');

      await UnganiClientShared.withButtonLoading(submitBtn, async () => {
        const assignedToValue = UnganiClientShared.value("taskAssignedTo") || "";
        const assignee = resolveAssigneeFromPickerValue(assignedToValue);

        const payload = {
          tenant_id: currentContext.tenantId,
          task_title: title,
          task_type: UnganiClientShared.value("taskType") || "General Task",
          priority: UnganiClientShared.value("taskPriority") || "normal",
          status: UnganiClientShared.value("taskStatus") || "pending",
          due_date: UnganiClientShared.value("taskDueDate") || null,
          assigned_to: assignee.displayName,
          assigned_to_team_member_id: assignee.teamMemberId,
          assigned_to_is_owner: assignee.isOwner,
          related_person: UnganiClientShared.value("taskRelatedPerson") || null,
          related_item: UnganiClientShared.value("taskRelatedItem") || null,
          notes: UnganiClientShared.value("taskNotes") || null
        };

        if (sectionOptions.length > 1) {
          payload.section_label = UnganiClientShared.value("taskSection") || null;
        }

        let response;
        const savedTaskId = editingTaskId;

        try {
          if (editingTaskId) {
            response = await currentContext.supabaseClient
              .from("tasks")
              .update(payload)
              .eq("id", editingTaskId)
              .eq("tenant_id", currentContext.tenantId);
          } else {
            response = await currentContext.supabaseClient
              .from("tasks")
              .insert([payload])
              .select("id")
              .single();
          }
        } catch (error) {
          UnganiClientShared.showToast("Could not save task: " + (error.message || "Network error. Please check your connection."));
          return;
        }

        if (response.error) {
          UnganiClientShared.showToast("Could not save task: " + response.error.message);
          return;
        }

        // Best-effort, non-blocking - the task itself already saved
        // successfully by this point. Only notify when the assignee
        // actually changed (a brand-new task counts as "changed" from
        // nobody), not on every unrelated edit to an already-assigned task.
        const assigneeChanged =
          assignee.isOwner !== editingTaskOriginalAssignee.isOwner ||
          assignee.teamMemberId !== editingTaskOriginalAssignee.teamMemberId;

        const savedForActivity = savedTaskId || (response.data && response.data.id);

        if (assigneeChanged && (assignee.isOwner || assignee.teamMemberId)) {
          notifyTaskAssignment(savedForActivity, assignee);
        }

        // Ungani Connect Phase 2: real Timeline entries on the events a
        // teammate actually cares about - created, status changed,
        // reassigned - not on every unrelated field edit (notes, due
        // date, etc.), same "only log what changed" judgment as the
        // existing assignment-notification check above.
        if (!editingTaskId) {
          UnganiConnectPanel.logActivity(currentContext, "tasks", savedForActivity, "created", "Task created.");
        } else if (payload.status !== editingTaskOriginalStatus) {
          const activityResult = await UnganiConnectPanel.logActivity(currentContext, "tasks", savedForActivity, "status_changed", "Status changed from " + toTitle(editingTaskOriginalStatus || "pending") + " to " + toTitle(payload.status) + ".");

          // Ungani Connect Phase 4: Smart Notification - notifies the
          // task's assignee when someone else changes its status.
          UnganiConnectPanel.notifyStatusChange(currentContext, "tasks", savedForActivity, activityResult && activityResult.activity_id, editingTaskOriginalStatus, payload.status);
        }

        if (assigneeChanged && (assignee.isOwner || assignee.teamMemberId)) {
          UnganiConnectPanel.logActivity(currentContext, "tasks", savedForActivity, "assigned", "Assigned to " + (assignee.displayName || "a team member") + ".");
        }

        UnganiClientShared.showToast(editingTaskId ? "Task updated ✓" : "Task added ✓");
        editingTaskId = null;
        UnganiClientShared.closeModal();
        await loadTaskRows();
      });
    }

    // Ungani Connect: Discussion + Timeline + Attachments panel. Phase 2
    // built this bespoke for Tasks; Phase 3 extracted it into the shared
    // ungani-connect-panel.js module (reused by Money/Documents/People
    // too) - this is now a thin wrapper around that module. Still an
    // ADDITIONAL affordance alongside the existing edit modal, not a
    // replacement (my-tasks.html's modal-based edit flow was explicitly
    // kept out of the earlier side-panel conversion work).

      const row = taskRows.find(function (item) { return String(item.id) === String(id); });

      if (!row) {

      const status = UnganiClientShared.getValue(row, ["status"], "pending");
      const due = UnganiClientShared.getValue(row, ["due_date"], "");

      UnganiConnectPanel.open(currentContext, {
        recordTable: "tasks",
        recordId: id,
        title: getTaskTitle(row),
        subtitleHtml: `<p class="ungani-small">${UnganiClientShared.safe(getTaskType(row))} · ${statusBadge(status, due)}</p>`,
        attachments: { linkColumn: "linked_task_id", deepLinkParam: "linkedTaskId" }
      });
    }

    function resolveAssigneeFromPickerValue(value) {
      if (value === "owner") {
        return { isOwner: true, teamMemberId: null, displayName: "Owner" };
      }

      if (value && value.indexOf("tm_") === 0) {
        const teamMemberId = value.slice(3);
        const member = assignableTeamMembers.find(function (item) { return String(item.id) === teamMemberId; });
        return { isOwner: false, teamMemberId: teamMemberId, displayName: member ? member.full_name : null };
      }

      return { isOwner: false, teamMemberId: null, displayName: null };
    }

    async function notifyTaskAssignment(taskId, assignee) {
      if (!taskId) return;

      try {
        const response = await currentContext.supabaseClient.rpc("notify_ungani_task_assignment", {
          p_task_id: taskId,
          p_assignee_team_member_id: assignee.teamMemberId,
          p_assignee_is_owner: assignee.isOwner
        });

        if (response.error || !response.data || response.data.ok !== true) {
          console.warn("Could not send assignment notification:", (response.error && response.error.message) || (response.data && response.data.message));
        } else {
          UnganiClientShared.triggerEmailSendNow();
          UnganiClientShared.triggerEventPush("task_assignment", taskId);
        }
      } catch (error) {
        console.warn("Could not send assignment notification:", error.message);
      }
    }

    async function markTaskCompleted(id, buttonEl) {
      const originalRow = taskRows.find(function (item) { return String(item.id) === String(id); });
      const originalStatus = originalRow ? UnganiClientShared.getValue(originalRow, ["status"], "pending") : "pending";

      await UnganiClientShared.withButtonLoading(buttonEl, async () => {
        let response;

        try {
          response = await currentContext.supabaseClient
            .from("tasks")
            .update({ status: "completed" })
            .eq("id", id)
            .eq("tenant_id", currentContext.tenantId);
        } catch (error) {
          UnganiClientShared.showToast("Could not update task: " + (error.message || "Network error. Please check your connection."));
          return;
        }

        if (response.error) {
          UnganiClientShared.showToast("Could not update task: " + response.error.message);
          return;
        }

        const activityResult = await UnganiConnectPanel.logActivity(currentContext, "tasks", id, "status_changed", "Marked as Completed.");
        UnganiConnectPanel.notifyStatusChange(currentContext, "tasks", id, activityResult && activityResult.activity_id, originalStatus, "completed");

        UnganiClientShared.showToast("Task marked completed ✓");
        editingTaskId = null;
        UnganiClientShared.closeModal();
        await loadTaskRows();
      });
    }

    async function deleteTaskRecord(id, buttonEl) {
      if (
        window.UnganiClientShared &&
        typeof UnganiClientShared.ensureCanWrite === "function" &&
        !UnganiClientShared.ensureCanWrite("delete task")
      ) {
        return;
      }

      const confirmed = confirm("Move this task to Recently Deleted? You can restore it within 30 days.");

      if (!confirmed) return;

      await UnganiClientShared.withButtonLoading(buttonEl, async () => {
        let response;

        try {
          response = await currentContext.supabaseClient.rpc("soft_delete_ungani_record", {
            p_table_name: "tasks",
            p_record_id: id,
            p_delete_reason: "Deleted from Tasks page"
          });
        } catch (error) {
          UnganiClientShared.showToast("Could not delete task: " + (error.message || "Network error. Please check your connection."));
          return;
        }

        if (response.error) {
          UnganiClientShared.showToast("Could not delete task: " + response.error.message);
          return;
        }

        if (response.data && response.data.ok === false) {
          UnganiClientShared.showToast(response.data.message || "Could not delete task.");
          return;
        }

        UnganiClientShared.showToast("Task moved to Recently Deleted ✓");
        UnganiClientShared.logAuditEvent("record_deleted", { entityType: "tasks", entityId: String(id), description: "Deleted from Tasks page" });
        editingTaskId = null;
        UnganiClientShared.closeModal();
        await loadTaskRows();
      });
    }

    function getTaskTitle(row) {
      return UnganiClientShared.getValue(row, ["task_title", "title", "name"], "Task");
    }

    function toTitle(value) {
      return String(value || "").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    }

    function statusBadge(status, dueDate) {
      const lower = String(status || "").toLowerCase();
      const due = String(dueDate || "").slice(0, 10);
      const today = new Date().toISOString().slice(0, 10);

      if (due && due < today && !lower.includes("completed") && !lower.includes("cancelled")) {
        return `<span class="ungani-badge red">Overdue</span>`;
      }

      if (lower.includes("completed")) {
        return `<span class="ungani-badge green">Completed</span>`;
      }

      if (lower.includes("progress")) {
        return `<span class="ungani-badge blue">In Progress</span>`;
      }

      if (lower.includes("cancelled")) {
        return `<span class="ungani-badge red">Cancelled</span>`;
      }

      return `<span class="ungani-badge gold">Pending</span>`;
    }

    function statusAccent(status, dueDate) {
      const lower = String(status || "").toLowerCase();
      const due = String(dueDate || "").slice(0, 10);
      const today = new Date().toISOString().slice(0, 10);

      if (due && due < today && !lower.includes("completed") && !lower.includes("cancelled")) return "#DC2626";
      if (lower.includes("completed")) return "#16A34A";
      if (lower.includes("progress")) return "#2563EB";
      if (lower.includes("cancelled")) return "#DC2626";

      return "#D4A63A";
    }

    function priorityBadge(priority) {
      const lower = String(priority || "normal").toLowerCase();

      if (lower.includes("urgent") || lower.includes("high")) {
        return `<span class="ungani-badge red">${UnganiClientShared.safe(UnganiAnalytics.toTitle(priority))}</span>`;
      }

      if (lower.includes("low")) {
        return `<span class="ungani-badge blue">Low</span>`;
      }

      return `<span class="ungani-badge gold">Normal</span>`;
    }

    function hasValues(rows) {
      return (rows || []).some(function (row) {
        return Number(row.value || 0) > 0;
      });
    }

    function renderSectionSwitcher() {
      if (sectionOptions.length <= 1) return "";

      const pills = [{ label: "All Sections", value: "" }].concat(
        sectionOptions.map(function (label) { return { label: label, value: label }; })
      );

      return `
        <div class="ungani-button-row" style="margin-top:10px;">
          ${pills.map(function (pill) {
            const active = currentSectionFilter === pill.value;
            return `<button class="ungani-btn ${active ? "gold" : "dark"}" type="button" onclick="switchSection('${UnganiClientShared.attr(pill.value)}')">${UnganiClientShared.safe(pill.label)}</button>`;
          }).join("")}
        </div>
      `;
    }

    function switchSection(value) {
      const url = new URL(window.location.href);

      if (value) {
        url.searchParams.set("section", value);
      } else {
        url.searchParams.delete("section");
      }

      window.location.href = url.toString();
    }
  </script>
</body>
</html>

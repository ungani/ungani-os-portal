<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>UNGANI OS - Shared Files</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="pwa-register.js"></script>
  <script src="client-shared.js" onerror="window.__unganiClientSharedFailed = true;"></script>
  <script src="team-chat-shared.js"></script>
  <script src="ungani-nav-config.js"></script>
  <script>
    (function () {
      function showUnganiLoadError() {
        if (typeof UnganiClientShared !== "undefined") return;

        var banner = document.createElement("div");
        banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#B91C1C;color:#fff;padding:12px 16px;font:14px/1.4 -apple-system,sans-serif;text-align:center;";
        banner.innerHTML = "Some page resources failed to load. Please check your connection. " +
          "<button style=\"margin-left:10px;padding:4px 12px;border:none;border-radius:6px;background:#fff;color:#B91C1C;font-weight:700;cursor:pointer;\" onclick=\"window.location.reload()\">Reload</button>";

        if (document.body) {
          document.body.prepend(banner);
        } else {
          document.addEventListener("DOMContentLoaded", function () {
            document.body.prepend(banner);
          });
        }
      }

      if (window.__unganiClientSharedFailed) {
        showUnganiLoadError();
      } else {
        setTimeout(function () {
          if (typeof UnganiClientShared === "undefined") showUnganiLoadError();
        }, 4000);
      }
    })();
  </script>
  <script src="nia-assistant.js"></script>
</head>

<body>
  <script>
    // Ungani Connect used to duplicate the Team Chat popup's own General
    // Team Chat / Department Channels / Direct Messages views as a full
    // page - same underlying team_chat_messages data, just rendered
    // twice. That was confusing (two different-looking UIs for the exact
    // same conversations), so Connect is now scoped to the thing the
    // popup doesn't have: Shared Files (Phase 6) and, later, unified
    // Search (Phase 7). Chat itself is one tap away via the existing
    // popup (UnganiTeamChat.toggle(), already loaded via
    // team-chat-shared.js above) rather than re-rendered here.
    let currentContext = null;
    let sharedFiles = [];

    window.addEventListener("load", function () {
      UnganiClientShared.initPage({
        pageKey: "connect",
        pageTitle: "Shared Files",
        pageSubtitle: "Every document your team is working with, all in one place.",
        onReady: startConnectPage
      });
    });

    async function startConnectPage(context) {
      currentContext = context;
      await loadSharedFiles(true);
      renderConnectPage();
    }

    // Phase 6: Shared Files - surfaces the existing documents table (and,
    // via file_url, whatever's already linked to Google Drive) inside
    // Ungani Connect. No new storage - a read-only, tenant-wide list over
    // the same table my-documents.html manages, same RLS.
    async function loadSharedFiles(silent) {
      let response;

      try {
        response = await currentContext.supabaseClient
          .from("documents")
          .select("id, document_title, document_type, document_date, file_name, file_url, linked_task_id, linked_transaction_id, linked_person_id, linked_team_member_id, created_at")
          .eq("tenant_id", currentContext.tenantId)
          .order("created_at", { ascending: false })
          .limit(100);
      } catch (error) {
        console.warn("Could not load shared files:", error.message);
        return;
      }

      if (response.error) {
        console.warn("Could not load shared files:", response.error.message);
        return;
      }

      sharedFiles = response.data || [];
      if (!silent) renderConnectPage();
    }

    function isDriveFile(fileUrl) {
      return !!fileUrl && String(fileUrl).indexOf("drive.google.com") !== -1;
    }

    var CONNECT_FILE_LINKED_RECORD = [
      { column: "linked_task_id", page: "my-tasks.html", label: "Task", highlight: true },
      { column: "linked_transaction_id", page: "my-money.html", label: "Payment", highlight: true },
      { column: "linked_person_id", page: "my-people.html", label: "Person", highlight: true },
      { column: "linked_team_member_id", page: "my-team-access.html", label: "Staff record", highlight: false }
    ];

    function linkedRecordChip(row) {
      const match = CONNECT_FILE_LINKED_RECORD.find(function (entry) { return row[entry.column]; });
      if (!match) return "";

      const href = match.highlight ? match.page + "?highlight=" + encodeURIComponent(row[match.column]) : match.page;
      return ` <a class="ungani-badge" style="text-decoration:none;" href="${UnganiClientShared.attr(href)}">Linked to ${UnganiClientShared.safe(match.label)} →</a>`;
    }

    function renderFilesList() {
      if (!sharedFiles.length) {
        return `
          <div class="ungani-empty">
            <h3>No shared documents yet</h3>
            <p>Documents added on the Documents page will show up here automatically.</p>
          </div>
        `;
      }

      return sharedFiles.map(function (row) {
        const drive = isDriveFile(row.file_url);
        // Only show a dedicated "Open" action when there's a real file_url
        // to open externally - with no file at all, the "View in
        // Documents" link below is already the only meaningful action, so
        // showing a second, identical link for that case would just be a
        // redundant duplicate button.
        const openButtonHtml = row.file_url
          ? `<a class="ungani-btn small dark" target="_blank" rel="noopener" href="${UnganiClientShared.attr(row.file_url)}">${drive ? "Open in Drive ↗" : "Open file ↗"}</a>`
          : "";

        return `
          <div class="ungani-card" style="box-shadow:none;border-left:5px solid ${drive ? "#0F9D58" : "#061C3D"};margin:0 0 10px;">
            <div class="ungani-section-title">
              <div>
                <h3>${UnganiClientShared.safe(row.document_title || row.file_name || "Untitled document")}</h3>
                <p class="ungani-small">
                  ${UnganiClientShared.safe(row.document_type || "Document")} · ${UnganiClientShared.safe(UnganiClientShared.formatDate(row.document_date || row.created_at))}
                  ${drive ? ' · <span class="ungani-badge green">📁 Google Drive</span>' : ""}
                </p>
              </div>
            </div>
            <div class="ungani-button-row" style="margin-top:8px;">
              ${openButtonHtml}
              <a class="ungani-btn small light" href="my-documents.html?highlight=${UnganiClientShared.attr(row.id)}">View in Documents →</a>
              ${linkedRecordChip(row)}
            </div>
          </div>
        `;
      }).join("");
    }

    function renderConnectPage() {
      const tenantName = UnganiClientShared.getTenantName(currentContext.tenant);

      UnganiClientShared.setContent(`
        <section class="ungani-card ungani-hero">
          <h2>Shared Files</h2>
          <p>
            Every document your team has added inside ${UnganiClientShared.safe(tenantName)}, all in one place. Chat lives in the
            💬 Team Chat popup (top bar, available on every page).
          </p>
          <div class="ungani-button-row" style="margin-top:12px;">
            <button class="ungani-btn green" type="button" onclick="UnganiTeamChat.toggle()">💬 Open Team Chat</button>
          </div>
        </section>

        <section class="ungani-card">
          <div class="ungani-section-title">
            <div>
              <h3>Shared Files</h3>
              <p class="ungani-small">Every document your team has added, including anything linked to Google Drive. No files are stored here separately - this is the same Documents list, surfaced for your team.</p>
            </div>
            <div class="ungani-button-row">
              <a class="ungani-btn gold" href="my-documents.html?action=add">+ Add Document</a>
              <button class="ungani-btn green" onclick="loadSharedFiles()">Refresh</button>
            </div>
          </div>

          <div id="connectFiles">
            ${renderFilesList()}
          </div>

          <p class="ungani-small" style="margin-top:10px;">
            <a href="my-documents.html">Open the full Documents page →</a>
          </p>
        </section>

        <p class="ungani-small">
          Shared Files · ungani.com · info@ungani.com
        </p>
      `);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>UNGANI OS Admin Error Log</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="pwa-register.js"></script>
  <script src="admin-shared.js"></script>
  <script src="ungani-admin-nav-config.js"></script>

  <style>
    .page-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .metric-card {
      background: var(--ungani-card);
      border: 1px solid var(--ungani-border);
      border-left: 6px solid var(--ungani-gold);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 24px var(--ungani-shadow);
    }

    .metric-card h3 {
      margin: 0 0 8px;
      color: var(--ungani-muted);
      font-size: 14px;
    }

    .metric-card p {
      margin: 0;
      font-size: 28px;
      font-weight: bold;
      color: var(--ungani-text);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 8px 0 6px;
      font-size: 14px;
      color: var(--ungani-text);
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--ungani-border);
      border-radius: 12px;
      background: var(--ungani-card);
      color: var(--ungani-text);
      font-size: 15px;
      font-family: Arial, sans-serif;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: bold;
      cursor: pointer;
      background: var(--ungani-gold);
      color: var(--ungani-navy);
      text-decoration: none;
      display: inline-block;
    }

    .btn.dark {
      background: var(--ungani-card);
      color: var(--ungani-text);
      border: 1px solid var(--ungani-border);
    }

    .btn.green { background: var(--ungani-green); color: #FFFFFF; }
    .btn.small { padding: 6px 10px; font-size: 12px; }

    .section-title-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .section-title-row h2 {
      margin: 0;
    }

    .badge {
      display: inline-block;
      background: var(--ungani-navy);
      color: #FFFFFF;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }

    .badge.green { background: var(--ungani-green); }
    .badge.red { background: var(--ungani-red); }
    .badge.orange { background: var(--ungani-orange); }
    .badge.blue { background: var(--ungani-blue); }
    .badge.gold { background: var(--ungani-gold); color: var(--ungani-navy); }
    .badge.gray { background: #64748B; }

    .empty {
      text-align: center;
      padding: 28px;
      background: var(--ungani-card);
      border: 1px dashed var(--ungani-border);
      border-radius: 18px;
    }

    .empty h3 {
      margin: 0 0 8px;
      color: var(--ungani-text);
    }

    .empty p {
      margin: 0;
      color: var(--ungani-muted);
    }

    .small-text {
      color: var(--ungani-muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .ungani-table-wrap {
      overflow-x: auto;
    }

    .ungani-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 900px;
    }

    .ungani-table thead th {
      text-align: left;
      padding: 10px 12px;
      color: var(--ungani-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--ungani-border);
      white-space: nowrap;
    }

    .ungani-table td {
      padding: 12px;
      border-bottom: 1px solid var(--ungani-border);
      vertical-align: top;
    }

    .ungani-table .row-time {
      white-space: nowrap;
      color: var(--ungani-muted);
      font-size: 13px;
    }

    .ungani-table .row-sub {
      display: block;
      font-weight: normal;
      color: var(--ungani-muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .mono {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12px;
    }

    tr.row-resolved {
      opacity: 0.55;
    }
  </style>
</head>

<body>
  <div id="adminRoot"></div>

  <script>
    let supabaseClient = null;
    let currentAdmin = null;

    const PAGE_SIZE = 50;
    let currentOffset = 0;
    let currentRows = [];
    let hasMore = false;

    const pageMainHtml = `
      <section class="ungani-card ungani-hero-card">
        <div style="position: relative; z-index: 1;">
          <h2>Error Log</h2>
          <p>
            Passive self-monitoring: failures captured from client and admin background checks (tenant lookups, sidebar badges, read-only access checks, notification counts). Admin-only.
          </p>
          <div style="margin-top: 16px;">
            <a class="btn" href="admin-home.html">Admin Home</a>
            <a class="btn dark" href="admin-audit-logs.html">Audit Logs</a>
          </div>
        </div>
      </section>

      <section class="page-grid" id="summaryTiles">
        <div class="metric-card"><h3>Events shown</h3><p id="metricShown">0</p></div>
        <div class="metric-card"><h3>Unresolved</h3><p id="metricUnresolved">0</p></div>
        <div class="metric-card"><h3>Client-side</h3><p id="metricClient">0</p></div>
        <div class="metric-card"><h3>Admin-side</h3><p id="metricAdmin">0</p></div>
      </section>

      <section class="ungani-card">
        <div class="section-title-row">
          <h2>Filters</h2>
          <button class="btn green" onclick="applyFilters()">Refresh</button>
        </div>

        <div class="form-grid">
          <div>
            <label for="surfaceFilter">Surface</label>
            <select id="surfaceFilter">
              <option value="">All Surfaces</option>
              <option value="client">Client</option>
              <option value="admin">Admin</option>
            </select>
          </div>

          <div>
            <label for="resolvedFilter">Status</label>
            <select id="resolvedFilter">
              <option value="">All</option>
              <option value="unresolved" selected>Unresolved only</option>
              <option value="resolved">Resolved only</option>
            </select>
          </div>

          <div>
            <label for="errorTypeFilter">Error type contains</label>
            <input id="errorTypeFilter" placeholder="e.g. tenant_lookup_failed" />
          </div>

          <div>
            <label for="fromDate">From date</label>
            <input id="fromDate" type="date" />
          </div>

          <div>
            <label for="toDate">To date</label>
            <input id="toDate" type="date" />
          </div>
        </div>

        <div class="button-row">
          <button class="btn green" onclick="applyFilters()">Apply Filters</button>
          <button class="btn dark" onclick="resetFilters()">Reset Filters</button>
        </div>
      </section>

      <section class="ungani-card">
        <div class="section-title-row">
          <h2>Errors</h2>
          <p class="small-text" id="logsCountText">Loading...</p>
        </div>

        <div class="ungani-table-wrap">
          <table class="ungani-table">
            <thead>
              <tr>
                <th>Time</th>
                <th>Surface</th>
                <th>Page</th>
                <th>Error Type</th>
                <th>Message</th>
                <th>Actor</th>
                <th>Client</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="logsListBox">
              <tr><td colspan="8"><div class="empty"><h3>Loading error log...</h3><p>Please wait.</p></div></td></tr>
            </tbody>
          </table>
        </div>

        <div class="button-row">
          <button class="btn dark" id="loadMoreBtn" style="display:none;" onclick="loadMore()">Load More</button>
        </div>
      </section>
    `;

    window.addEventListener("load", function () {
      UnganiAdminShared.renderShell("adminRoot", {
        activeKey: "errorLog",
        pageTitle: "Error Log",
        pageSubtitle: "Passive self-monitoring: failures from client and admin background checks.",
        footerTitle: "Error Log",
        footerVersion: "Error Log Version: v1",
        mainHtml: pageMainHtml
      });

      UnganiAdminShared.requireAdmin({
        onNoSession: function () {
          document.getElementById("unganiLoadingShell").classList.add("hidden");
          document.getElementById("unganiLoginShell").classList.remove("hidden");
        },
        onBlocked: function (reason) {
          document.getElementById("unganiLoadingShell").classList.add("hidden");
          document.getElementById("unganiBlockedShell").classList.remove("hidden");
          document.getElementById("unganiBlockedReason").innerText = reason;
        },
        onReady: async function (admin, client) {
          currentAdmin = admin;
          supabaseClient = client;

          UnganiAdminShared.renderSidebar("adminSidebar", {
            activeKey: "errorLog",
            adminName: admin.full_name || "Admin Workspace",
            footerTitle: "Error Log",
            footerVersion: "Error Log Version: v1"
          });

          document.getElementById("unganiLoadingShell").classList.add("hidden");
          document.getElementById("unganiAppShell").classList.remove("hidden");

          await applyFilters();
        }
      });
    });

    function safe(value) {
      return UnganiAdminShared.safe(value);
    }

    function formatDateTime(value) {
      if (!value) return "N/A";

      const dateObj = new Date(value);

      if (isNaN(dateObj.getTime())) return "N/A";

      return dateObj.toLocaleString("en-KE", {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function surfaceBadge(surface) {
      const clean = String(surface || "").toLowerCase();
      if (clean === "admin") return `<span class="badge gold">Admin</span>`;
      if (clean === "client") return `<span class="badge blue">Client</span>`;
      return `<span class="badge gray">${safe(clean || "Unknown")}</span>`;
    }

    function buildQuery(offset) {
      let query = supabaseClient
        .from("app_error_log")
        .select("*")
        .order("occurred_at", { ascending: false })
        .range(offset, offset + PAGE_SIZE - 1);

      const surface = document.getElementById("surfaceFilter").value;
      const resolved = document.getElementById("resolvedFilter").value;
      const errorType = document.getElementById("errorTypeFilter").value.trim();
      const fromDate = document.getElementById("fromDate").value;
      const toDate = document.getElementById("toDate").value;

      if (surface) query = query.eq("surface", surface);
      if (resolved === "unresolved") query = query.eq("resolved", false);
      if (resolved === "resolved") query = query.eq("resolved", true);
      if (errorType) query = query.ilike("error_type", "%" + errorType + "%");
      if (fromDate) query = query.gte("occurred_at", fromDate + "T00:00:00");
      if (toDate) query = query.lte("occurred_at", toDate + "T23:59:59");

      return query;
    }

    async function applyFilters() {
      currentOffset = 0;
      currentRows = [];

      document.getElementById("logsListBox").innerHTML = `<tr><td colspan="8"><div class="empty"><h3>Loading error log...</h3><p>Please wait.</p></div></td></tr>`;

      const { data, error } = await buildQuery(0);

      if (error) {
        document.getElementById("logsListBox").innerHTML = `<tr><td colspan="8"><div class="empty"><h3>Could not load error log</h3><p>${safe(error.message)}</p></div></td></tr>`;
        document.getElementById("logsCountText").innerText = "Error loading log.";
        return;
      }

      currentRows = data || [];
      currentOffset = currentRows.length;
      hasMore = currentRows.length === PAGE_SIZE;

      renderLogs();
    }

    async function loadMore() {
      const { data, error } = await buildQuery(currentOffset);

      if (error) {
        UnganiAdminShared.showToast("Could not load more: " + error.message);
        return;
      }

      const rows = data || [];
      currentRows = currentRows.concat(rows);
      currentOffset += rows.length;
      hasMore = rows.length === PAGE_SIZE;

      renderLogs();
    }

    function resetFilters() {
      document.getElementById("surfaceFilter").value = "";
      document.getElementById("resolvedFilter").value = "";
      document.getElementById("errorTypeFilter").value = "";
      document.getElementById("fromDate").value = "";
      document.getElementById("toDate").value = "";
      applyFilters();
    }

    async function markResolved(errorId, button) {
      button.disabled = true;
      button.textContent = "Saving...";

      const { error } = await supabaseClient.rpc("admin_mark_ungani_error_resolved", { p_error_id: errorId });

      if (error) {
        UnganiAdminShared.showToast("Could not mark resolved: " + error.message);
        button.disabled = false;
        button.textContent = "Mark Resolved";
        return;
      }

      const row = currentRows.find(r => r.id === errorId);
      if (row) {
        row.resolved = true;
        row.resolved_at = new Date().toISOString();
      }

      renderLogs();
    }

    function renderLogs() {
      const box = document.getElementById("logsListBox");

      if (!currentRows.length) {
        box.innerHTML = `<tr><td colspan="8"><div class="empty"><h3>No matching errors</h3><p>Adjust the filters above, or this simply means nothing has failed.</p></div></td></tr>`;
      } else {
        box.innerHTML = currentRows.map(function (row) {
          return `
            <tr class="${row.resolved ? "row-resolved" : ""}">
              <td class="row-time">${safe(formatDateTime(row.occurred_at))}</td>
              <td>${surfaceBadge(row.surface)}</td>
              <td class="mono">${safe(row.page || "-")}</td>
              <td>${safe(row.error_type)}</td>
              <td>${safe(row.message)}</td>
              <td>
                ${safe(row.actor_email || "Unknown")}
                <span class="row-sub mono">${safe((row.actor_user_id || "").slice(0, 8))}</span>
              </td>
              <td class="mono">${safe(row.tenant_id ? String(row.tenant_id).slice(0, 8) : "-")}</td>
              <td>
                ${row.resolved
                  ? `<span class="badge green">Resolved</span>`
                  : `<button class="btn dark small" onclick="markResolved('${row.id}', this)">Mark Resolved</button>`}
              </td>
            </tr>
          `;
        }).join("");
      }

      document.getElementById("metricShown").innerText = String(currentRows.length);
      document.getElementById("metricUnresolved").innerText = String(currentRows.filter(r => !r.resolved).length);
      document.getElementById("metricClient").innerText = String(currentRows.filter(r => r.surface === "client").length);
      document.getElementById("metricAdmin").innerText = String(currentRows.filter(r => r.surface === "admin").length);

      document.getElementById("logsCountText").innerText = currentRows.length + " event" + (currentRows.length === 1 ? "" : "s") + " shown" + (hasMore ? " (more available)" : "");
      document.getElementById("loadMoreBtn").style.display = hasMore ? "inline-block" : "none";
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>UNGANI OS - Admin Approvals</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/ungani-icon-180.png" />
  <link rel="icon" href="/ungani-icon-32.png" type="image/png" />
  <link rel="shortcut icon" href="/favicon.ico" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="pwa-register.js"></script>
  <script src="admin-shared.js"></script>
  <script src="ungani-admin-nav-config.js"></script>

  <style>
    :root {
      --navy: #061C3D;
      --gold: #D4A63A;
      --offwhite: #F5F5F3;
      --white: #FFFFFF;
      --gray: #E5E7EB;
      --text: #061C3D;
      --soft: #64748B;
      --green: #15803D;
      --red: #B91C1C;
      --orange: #C77700;
      --blue: #2563EB;
      --card: #FFFFFF;
      --bg: #F5F5F3;
      --border: rgba(6, 28, 61, 0.12);
      --shadow: rgba(6, 28, 61, 0.10);
    }

    /* Was keyed to body.dark - dead CSS, since nothing on this page ever
       added that class (theme switching here goes through admin-shared.js's
       Theme button, which sets data-theme/data-ungani-theme attributes, not
       a body class). Net effect: this page's OWN --card/--text variables
       were always stuck at their light-mode values, while admin-shared.js's
       own body { color: var(--ungani-text) } rule (same specificity, loads
       later, so it wins) DID correctly go near-white in dark mode - near-
       white text inherited onto a card background that never left white.
       Retargeted to the attribute admin-shared.js actually sets, so this
       page's own --card now correctly goes dark too, and the (already-
       correct) inherited text color has a readable background to sit on. */
    html[data-theme="dark"] {
      --bg: #061426;
      --card: #0B2346;
      --text: #F5F5F3;
      --soft: #B8C3D6;
      --border: rgba(255,255,255,0.12);
      --shadow: rgba(0,0,0,0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .hidden {
      display: none !important;
    }

    .screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
    }

    .screen-card {
      width: 100%;
      max-width: 500px;
      background: var(--card);
      border-radius: 24px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 16px 38px var(--shadow);
    }

    .screen-card img {
      width: 78px;
      margin-bottom: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--navy);
      color: var(--white);
      padding: 22px;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
    }

    .sidebar-overlay {
      display: none;
    }

    .mobile-menu-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: none;
      background: var(--navy);
      color: var(--white);
      font-size: 19px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      background: var(--white);
      padding: 5px;
      border-radius: 14px;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .brand p {
      margin: 3px 0 0;
      color: #CBD5E1;
      font-size: 12px;
    }

    .nav-title {
      color: #CBD5E1;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 20px 0 8px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      min-height: 44px;
      color: var(--white);
      text-decoration: none;
      padding: 11px 12px;
      border-radius: 12px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .nav-link:hover,
    .nav-link.active {
      background: rgba(212,166,58,0.18);
      color: var(--gold);
    }

    .main {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .topbar h2 {
      margin: 0;
      font-size: 26px;
    }

    .topbar p {
      margin: 5px 0 0;
      color: var(--soft);
      line-height: 1.45;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 12px 28px var(--shadow);
      margin-bottom: 18px;
    }

    .hero {
      background: linear-gradient(135deg, var(--navy), #0B2A55);
      color: var(--white);
      border: none;
      position: relative;
      overflow: hidden;
    }

    .hero:after {
      content: "";
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(212,166,58,0.22);
      position: absolute;
      right: -80px;
      top: -90px;
    }

    .hero h2,
    .hero p,
    .hero .button-row {
      position: relative;
      z-index: 1;
    }

    .hero h2 {
      margin: 0 0 8px;
      color: var(--white);
    }

    .hero p {
      margin: 0;
      color: #E5E7EB;
      line-height: 1.5;
      max-width: 900px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .metric {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 6px solid var(--gold);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 24px var(--shadow);
    }

    .metric.green { border-left-color: var(--green); }
    .metric.red { border-left-color: var(--red); }
    .metric.orange { border-left-color: var(--orange); }
    .metric.blue { border-left-color: var(--blue); }

    .metric h3 {
      margin: 0 0 8px;
      color: var(--soft);
      font-size: 14px;
    }

    .metric p {
      margin: 0;
      font-size: 28px;
      font-weight: bold;
    }

    .metric .note {
      color: var(--soft);
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.4;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .section-title h3,
    .section-title h2 {
      margin: 0;
    }

    .registration-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-left: 6px solid var(--gold);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .registration-card.pending { border-left-color: var(--orange); }
    .registration-card.approved { border-left-color: var(--green); }
    .registration-card.rejected { border-left-color: var(--red); }
    .registration-card.warning { border-left-color: var(--red); }

    .record-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .detail {
      margin: 5px 0;
      color: var(--soft);
      line-height: 1.45;
      word-break: break-word;
    }

    .badge {
      display: inline-block;
      background: var(--navy);
      color: var(--white);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      margin: 4px 4px 4px 0;
      text-transform: capitalize;
    }

    .badge.green { background: var(--green); }
    .badge.red { background: var(--red); }
    .badge.orange { background: var(--orange); }
    .badge.blue { background: var(--blue); }
    .badge.gold { background: var(--gold); color: var(--navy); }

    .empty {
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 18px;
      padding: 28px;
      background: var(--bg);
    }

    .empty h3 {
      margin: 0 0 8px;
    }

    .empty p,
    .small {
      color: var(--soft);
      font-size: 13px;
      line-height: 1.45;
    }

    textarea {
      width: 100%;
      min-height: 190px;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      line-height: 1.5;
      resize: vertical;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      border-radius: 12px;
      font-size: 15px;
      font-family: Arial, sans-serif;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 8px 0 6px;
      font-size: 14px;
      color: var(--text);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .btn {
      border: none;
      background: var(--gold);
      color: var(--navy);
      padding: 10px 14px;
      min-height: 44px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn.dark {
      background: var(--navy);
      color: var(--white);
    }

    html[data-theme="dark"] .btn.dark {
      background: var(--offwhite);
      color: var(--navy);
    }

    .btn.green { background: var(--green); color: var(--white); }
    .btn.red { background: var(--red); color: var(--white); }
    .btn.orange { background: var(--orange); color: var(--white); }
    .btn.blue { background: var(--blue); color: var(--white); }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: var(--navy);
      color: var(--white);
      padding: 12px 14px;
      border-radius: 14px;
      display: none;
      z-index: 999;
      box-shadow: 0 14px 32px rgba(0,0,0,0.22);
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        left: -320px;
        top: 0;
        bottom: 0;
        width: min(300px, 86vw);
        height: 100vh;
        z-index: 100;
        transition: left 0.25s ease;
      }

      .sidebar.open {
        left: 0;
      }

      body.sidebar-open .sidebar-overlay {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.42);
        z-index: 95;
      }

      .mobile-menu-btn {
        display: inline-flex;
      }

      .two-col {
        grid-template-columns: 1fr;
      }
    }

    /* Branded splash - paints immediately (inline, before any of the
       render-blocking <script> tags above finish loading), so there's
       never a blank/white flash on first load. Removed by pwa-register.js
       once the page is actually ready to show real content. */
    #unganiSplash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #061C3D;
      transition: opacity 0.35s ease-out;
    }

    #unganiSplash img {
      width: 96px;
      height: 96px;
      opacity: 0;
      animation: unganiSplashFadeIn 0.5s ease-out 0.15s forwards;
    }

    #unganiSplash.ungani-splash-hide {
      opacity: 0;
      pointer-events: none;
    }

    @keyframes unganiSplashFadeIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      #unganiSplash img { animation: none; opacity: 1; }
      #unganiSplash { transition: none; }
    }

    .chat-bell-btn {
      position: relative;
    }

    .chat-bell-count {
      display: none;
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--red);
      color: #fff;
      border-radius: 999px;
      font-size: 11px;
      min-width: 18px;
      height: 18px;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      font-weight: bold;
    }

    .chat-bell-count.show {
      display: flex;
    }

    .notification-panel {
      position: fixed;
      right: 22px;
      top: 84px;
      width: min(420px, calc(100vw - 28px));
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 26px;
      box-shadow: 0 30px 90px rgba(0,0,0,0.35);
      z-index: 1200;
      display: none;
      padding: 18px;
    }

    .notification-panel.open {
      display: block;
    }

    .notification-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .notification-head h3 {
      margin: 0;
      color: var(--text);
      font-size: 20px;
    }

    .notification-head p {
      margin: 4px 0 0;
      color: var(--soft);
      font-size: 12px;
    }

    .summary-list {
      display: grid;
      gap: 10px;
    }

    .summary-row {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 13px 13px 13px 16px;
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 18px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .summary-row::before {
      content: "";
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 4px;
      border-radius: 0 999px 999px 0;
      background: var(--accent, var(--soft));
    }

    .summary-row:hover {
      border-color: rgba(212,166,58,0.45);
      box-shadow: 0 16px 38px rgba(0,0,0,0.14);
    }

    .summary-row strong {
      display: block;
      font-size: 15px;
      color: var(--text);
    }

    .summary-row p {
      margin: 4px 0 0;
      color: var(--soft);
      font-size: 12px;
      line-height: 1.4;
    }

    .chat-thread-header {
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .chat-thread-header strong {
      color: var(--text);
      font-size: 15px;
    }

    .chat-thread-meta {
      margin: 4px 0 0;
      color: var(--soft);
      font-size: 12px;
    }

    .chat-thread-messages {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 320px;
      overflow-y: auto;
      padding: 4px 2px;
      margin-bottom: 12px;
    }

    .chat-thread-msg {
      max-width: 85%;
      padding: 9px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      line-height: 1.4;
      word-break: break-word;
    }

    .chat-thread-msg.admin {
      align-self: flex-end;
      background: var(--navy);
      color: #FFFFFF;
      border-color: var(--navy);
    }

    html[data-theme="dark"] .chat-thread-msg.admin {
      background: var(--gold);
      color: var(--navy);
      border-color: var(--gold);
    }

    .chat-thread-msg.client {
      align-self: flex-start;
      background: var(--card);
      color: var(--text);
    }

    .chat-thread-msg-meta {
      font-size: 10px;
      opacity: 0.75;
      margin-bottom: 3px;
    }

    .chat-thread-msg-body {
      white-space: pre-wrap;
      font-size: 13px;
    }

    .chat-thread-compose textarea {
      width: 100%;
      resize: vertical;
      min-height: 70px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      font-size: 14px;
      font-family: Arial, sans-serif;
    }

    @media (max-width: 980px) {
      .notification-panel {
        top: 74px;
        left: 12px;
        right: 12px;
        width: auto;
        max-height: calc(100vh - 96px);
      }
    }
  </style>
</head>

<body>
  <div id="unganiSplash" role="presentation">
    <img src="/ungani-icon-192.png" alt="" width="96" height="96" />
  </div>
  <div id="adminRoot"></div>

  <div id="chatPreviewOverlay" style="display:none;position:fixed;inset:0;background:rgba(6,28,61,0.35);z-index:1100;" onclick="closeChatPreview()"></div>

  <div id="chatPreviewPanel" class="notification-panel">
    <div id="chatPreviewListView">
      <div class="notification-head">
        <div>
          <h3>Client Chat</h3>
          <p>Recent conversations across all clients.</p>
        </div>
        <button class="btn dark" type="button" onclick="closeChatPreview()">Close</button>
      </div>

      <div class="button-row" style="margin-top:0;margin-bottom:12px;">
        <a class="btn" href="admin-chat.html">Open Full Chat</a>
      </div>

      <div id="chatPreviewList" class="summary-list">
        <div class="empty"><h3>Loading conversations...</h3><p>Please wait.</p></div>
      </div>
    </div>

    <div id="chatThreadView" style="display:none;">
      <div class="notification-head">
        <button class="btn dark" type="button" onclick="showChatPreviewList()">&larr; Back</button>
        <button class="btn dark" type="button" onclick="closeChatPreview()">Close</button>
      </div>

      <div id="chatThreadHeader" class="chat-thread-header"></div>

      <div id="chatThreadMessages" class="chat-thread-messages"></div>

      <div class="chat-thread-compose">
        <textarea id="chatThreadReplyText" placeholder="Write your reply..." rows="3"></textarea>
        <div class="button-row" style="justify-content:space-between;">
          <a class="btn" id="chatThreadFullLink" href="admin-chat.html">Open Full Page</a>
          <button class="btn green" type="button" onclick="sendChatThreadReply()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let supabaseClient = null;
    let currentAdmin = null;
    let chatPreviewMessagesRaw = [];
    let chatPreviewTenantsById = {};
    let chatThreadSelectedTenantId = null;
    let chatRealtimeChannel = null;
    let registrations = [];
    let tenants = [];
    let users = [];
    let registrationsSubscription = null;
    let isBusy = false;

    var pageMainHtml = `
      <section class="card hero">
        <h2>Safe Client Approval Flow</h2>
        <p>
          New clients must register with an email and password first. After approval, they can log in using the same email and password they created during registration.
        </p>
      </section>

      <section class="grid" id="metricsGrid">
        <div class="metric">
          <h3>Loading</h3>
          <p>...</p>
          <div class="note">Please wait</div>
        </div>
      </section>

      <section id="approvalMessageCard" class="card hidden">
        <div class="section-title">
          <div>
            <h3>Approval Message</h3>
            <p class="small">Copy this message and send it to the client on email or WhatsApp.</p>
          </div>
          <button class="btn green" onclick="copyApprovalMessage()">Copy Message</button>
        </div>

        <label for="approvalMessageText">Message</label>
        <textarea id="approvalMessageText" readonly></textarea>

        <div class="button-row">
          <a class="btn dark" href="client.html" target="_blank">Open Client Login</a>
          <button class="btn" onclick="hideApprovalMessage()">Hide Message</button>
        </div>
      </section>

      <section class="card">
        <div class="section-title">
          <h3>Filters</h3>
          <button class="btn dark" onclick="resetFilters()">Reset Filters</button>
        </div>

        <div class="form-grid">
          <div>
            <label for="filterStatus">Status</label>
            <select id="filterStatus" onchange="renderPage()">
              <option value="pending">Pending</option>
              <option value="">All</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>

          <div>
            <label for="filterLogin">Login User</label>
            <select id="filterLogin" onchange="renderPage()">
              <option value="">All</option>
              <option value="with_login">With Login User</option>
              <option value="without_login">Without Login User</option>
            </select>
          </div>

          <div>
            <label for="searchBox">Search</label>
            <input id="searchBox" placeholder="Search business, email, contact, phone..." oninput="renderPage()" />
          </div>
        </div>
      </section>

      <section class="two-col">
        <div class="card">
          <div class="section-title">
            <h3>Registrations</h3>
            <p class="small" id="registrationsCount">Loading...</p>
          </div>

          <div id="registrationsBox">
            <div class="empty">
              <h3>Loading registrations...</h3>
              <p>Please wait.</p>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="section-title">
            <h3>Approved Clients</h3>
            <p class="small" id="clientsCount">Loading...</p>
          </div>

          <div id="clientsBox">
            <div class="empty">
              <h3>Loading approved clients...</h3>
              <p>Please wait.</p>
            </div>
          </div>
        </div>
      </section>
    `;

    window.addEventListener("load", function () {
      UnganiAdminShared.renderShell("adminRoot", {
        activeKey: "admin-main",
        pageTitle: "Client Registration Approvals",
        pageSubtitle: "Approve new client registrations, link their login account, and copy the approval message.",
        footerTitle: "Admin Approvals",
        footerVersion: "Admin Approvals Version: Step 304D Safe Approval",
        mainHtml: pageMainHtml
      });

      var topbarActions = document.querySelector(".ungani-topbar-actions");
      if (topbarActions) {
        topbarActions.insertAdjacentHTML("afterbegin", '<button class="btn dark chat-bell-btn" type="button" onclick="toggleChatPreview()" aria-label="Client chat"><i data-lucide="message-circle"></i> Chat<span id="chatBellCount" class="chat-bell-count">0</span></button>');
        UnganiAdminShared.renderLucideIcons();
      }

      UnganiAdminShared.requireAdmin({
        onNoSession: function () {
          document.getElementById("unganiLoadingShell").classList.add("hidden");
          document.getElementById("unganiLoginShell").classList.remove("hidden");
        },
        onBlocked: function (reason) {
          document.getElementById("unganiLoadingShell").classList.add("hidden");
          document.getElementById("unganiBlockedShell").classList.remove("hidden");
          document.getElementById("unganiBlockedReason").innerText = reason;
        },
        onReady: async function (admin, client) {
          currentAdmin = admin;
          supabaseClient = client;

          UnganiAdminShared.renderSidebar("adminSidebar", {
            activeKey: "admin-main",
            adminName: admin.full_name || "Admin Workspace",
            footerTitle: "Admin Approvals",
            footerVersion: "Admin Approvals Version: Step 304D Safe Approval"
          });

          document.getElementById("unganiLoadingShell").classList.add("hidden");
          document.getElementById("unganiAppShell").classList.remove("hidden");

          await loadPageData();
          startRegistrationsRealtime();
          loadChatPreview();
          startChatRealtime();
        }
      });
    });

    function toggleChatPreview() {
      var panel = document.getElementById("chatPreviewPanel");
      var overlay = document.getElementById("chatPreviewOverlay");
      if (!panel) return;
      var isOpen = panel.classList.contains("open");
      if (isOpen) {
        closeChatPreview();
        return;
      }
      panel.classList.add("open");
      if (overlay) overlay.style.display = "block";
      loadChatPreview();
    }

    function closeChatPreview() {
      var panel = document.getElementById("chatPreviewPanel");
      var overlay = document.getElementById("chatPreviewOverlay");
      if (panel) panel.classList.remove("open");
      if (overlay) overlay.style.display = "none";
      showChatPreviewList();
    }

    function showChatPreviewList() {
      chatThreadSelectedTenantId = null;
      var threadView = document.getElementById("chatThreadView");
      var listView = document.getElementById("chatPreviewListView");
      if (threadView) threadView.style.display = "none";
      if (listView) listView.style.display = "block";
    }

    async function loadChatPreview() {
      if (!supabaseClient) return;

      try {
        var results = await Promise.all([
          supabaseClient.from("tenants").select("id, business_name, company_name, name"),
          supabaseClient.from("admin_client_messages").select("*").order("created_at", { ascending: false }).limit(500)
        ]);

        var tenantsRes = results[0], messagesRes = results[1];
        if (tenantsRes.error || messagesRes.error) throw (tenantsRes.error || messagesRes.error);

        var tenantsById = {};
        (tenantsRes.data || []).forEach(function (t) { tenantsById[t.id] = t; });
        chatPreviewTenantsById = tenantsById;

        var messages = (messagesRes.data || []).filter(function (m) { return m.is_internal !== true; });
        chatPreviewMessagesRaw = messages;

        var byTenant = {};
        messages.forEach(function (m) {
          if (!m.tenant_id) return;
          if (!byTenant[m.tenant_id]) byTenant[m.tenant_id] = [];
          byTenant[m.tenant_id].push(m);
        });

        var conversations = Object.keys(byTenant).map(function (tenantId) {
          var rows = byTenant[tenantId].slice().sort(function (a, b) { return new Date(b.created_at || 0) - new Date(a.created_at || 0); });
          var latest = rows[0];
          var unread = rows.filter(function (m) { return String(m.sender_role || "").toLowerCase() === "client" && !m.read_by_admin_at; }).length;
          var tenant = tenantsById[tenantId];
          var tenantName = tenant ? (tenant.business_name || tenant.company_name || tenant.name || "Client") : "Client";

          return { tenantId: tenantId, tenantName: tenantName, latest: latest, unread: unread };
        }).sort(function (a, b) { return new Date(b.latest.created_at || 0) - new Date(a.latest.created_at || 0); });

        var totalUnread = conversations.reduce(function (sum, c) { return sum + c.unread; }, 0);
        var countEl = document.getElementById("chatBellCount");
        if (countEl) {
          countEl.textContent = totalUnread;
          countEl.classList.toggle("show", totalUnread > 0);
        }

        renderChatPreview(conversations.slice(0, 6));

        if (chatThreadSelectedTenantId) {
          renderChatThread(chatThreadSelectedTenantId);
        }
      } catch (error) {
        console.warn("loadChatPreview failed:", error.message);
        var list = document.getElementById("chatPreviewList");
        if (list) list.innerHTML = '<div class="empty"><h3>Could not load conversations</h3><p>Please try again.</p></div>';
      }
    }

    function renderChatPreview(conversations) {
      var list = document.getElementById("chatPreviewList");
      if (!list) return;

      if (!conversations.length) {
        list.innerHTML = '<div class="empty"><h3>No client conversations yet</h3><p>Messages between admin and clients will show up here.</p></div>';
        return;
      }

      list.innerHTML = conversations.map(function (c) {
        var body = String(c.latest.message_body || "").trim();
        var preview = body.length > 70 ? body.slice(0, 70) + "…" : body;
        var timeStr = c.latest.created_at ? new Date(c.latest.created_at).toLocaleDateString() : "";
        var accent = c.unread > 0 ? "var(--red)" : "var(--soft)";

        return '<div class="summary-row" role="button" tabindex="0" onclick="openChatThread(\'' + attr(String(c.tenantId)) + '\')" onkeypress="if(event.key===\'Enter\')openChatThread(\'' + attr(String(c.tenantId)) + '\')" style="--accent:' + accent + ';">' +
                 '<div>' +
                   '<strong>' + safe(c.tenantName) + '</strong>' +
                   '<p>' + safe(preview || "No messages yet") + " &bull; " + safe(timeStr) + '</p>' +
                 '</div>' +
                 (c.unread > 0 ? '<span class="badge red">' + safe(c.unread) + '</span>' : '<span class="badge green">Read</span>') +
               '</div>';
      }).join("");
    }

    function tenantMessagesForChat(tenantId) {
      return chatPreviewMessagesRaw
        .filter(function (m) { return String(m.tenant_id) === String(tenantId); })
        .sort(function (a, b) { return new Date(a.created_at || 0) - new Date(b.created_at || 0); });
    }

    function openChatThread(tenantId) {
      chatThreadSelectedTenantId = tenantId;
      var threadView = document.getElementById("chatThreadView");
      var listView = document.getElementById("chatPreviewListView");
      if (listView) listView.style.display = "none";
      if (threadView) threadView.style.display = "block";

      renderChatThread(tenantId);
      markChatThreadRead(tenantId);

      var fullLink = document.getElementById("chatThreadFullLink");
      if (fullLink) fullLink.href = "admin-chat.html?tenant=" + encodeURIComponent(tenantId);
    }

    function renderChatThread(tenantId) {
      var headerEl = document.getElementById("chatThreadHeader");
      var boxEl = document.getElementById("chatThreadMessages");
      if (!headerEl || !boxEl) return;

      var tenant = chatPreviewTenantsById[tenantId];
      var tenantName = tenant ? (tenant.business_name || tenant.company_name || tenant.name || "Client") : "Client";
      var rows = tenantMessagesForChat(tenantId);
      var unread = rows.filter(function (m) { return String(m.sender_role || "").toLowerCase() === "client" && !m.read_by_admin_at; }).length;

      headerEl.innerHTML =
        "<strong>" + safe(tenantName) + "</strong>" +
        '<p class="chat-thread-meta">' + rows.length + " message(s)" +
          (unread > 0 ? " &bull; <span style=\"color:var(--red);\">" + unread + " unread</span>" : "") +
        "</p>";

      if (!rows.length) {
        boxEl.innerHTML = '<div class="empty"><p>No messages yet. Send the first message below.</p></div>';
        return;
      }

      boxEl.innerHTML = rows.map(function (row) {
        var role = String(row.sender_role || "").toLowerCase() === "admin" ? "admin" : "client";
        var senderName = row.sender_name || (role === "admin" ? "UNGANI Admin" : tenantName);
        var timeStr = row.created_at ? new Date(row.created_at).toLocaleString() : "";

        return '<div class="chat-thread-msg ' + role + '">' +
                 '<div class="chat-thread-msg-meta">' + safe(senderName) + " &bull; " + safe(timeStr) + '</div>' +
                 '<div class="chat-thread-msg-body">' + safe(row.message_body || "") + '</div>' +
               '</div>';
      }).join("");

      boxEl.scrollTop = boxEl.scrollHeight;
    }

    async function markChatThreadRead(tenantId) {
      if (!supabaseClient) return;

      var unread = tenantMessagesForChat(tenantId).filter(function (m) {
        return String(m.sender_role || "").toLowerCase() === "client" && !m.read_by_admin_at;
      });
      if (!unread.length) return;

      var ids = unread.map(function (m) { return m.id; });
      var now = new Date().toISOString();

      try {
        await supabaseClient.from("admin_client_messages").update({ read_by_admin_at: now }).in("id", ids);
        await loadChatPreview();
      } catch (err) {
        console.warn("markChatThreadRead failed:", err);
      }
    }

    async function sendChatThreadReply() {
      var textEl = document.getElementById("chatThreadReplyText");
      if (!textEl || !chatThreadSelectedTenantId || !supabaseClient) return;

      var text = textEl.value.trim();
      if (!text) return;

      var now = new Date().toISOString();
      var messageId = crypto.randomUUID();
      var payload = {
        id: messageId,
        tenant_id: chatThreadSelectedTenantId,
        sender_id: UnganiAdminShared.getCurrentAdminId(),
        sender_name: (currentAdmin && currentAdmin.full_name) || "UNGANI Admin",
        sender_role: "admin",
        message_body: text,
        is_internal: false,
        read_by_admin_at: now,
        created_at: now
      };

      var res = await supabaseClient.from("admin_client_messages").insert(payload);
      if (res.error) {
        alert(res.error.message);
        return;
      }

      triggerAdminClientMessagePushNow(messageId);

      textEl.value = "";
      await loadChatPreview();
    }

    function startChatRealtime() {
      if (chatRealtimeChannel || !supabaseClient) return;

      chatRealtimeChannel = supabaseClient
        .channel("admin-main-chat-panel")
        .on(
          "postgres_changes",
          { event: "*", schema: "public", table: "admin_client_messages" },
          function () {
            loadChatPreview();
          }
        )
        .subscribe();
    }

    // This page previously only ever loaded registrations once on open (plus
    // after the admin's own approve/reject actions) - a new registration
    // submitted by someone else while the page was already open just never
    // appeared until a manual reload, which read as "pending approvals take
    // a noticeable delay to show up." Mirrors admin-chat.html's
    // startRealtime() pattern: any change to the registrations table
    // triggers a real refetch, so a new pending row (or another admin's
    // approval/rejection) appears without the current admin doing anything.
    function startRegistrationsRealtime() {
      if (registrationsSubscription) return;

      registrationsSubscription = supabaseClient
        .channel("admin-registrations-live")
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "registrations"
          },
          function () {
            loadPageData();
          }
        )
        .subscribe();
    }

    function showToast(message) {
      UnganiAdminShared.showToast(message);
    }

    async function loadPageData() {
      showToast("Loading registrations...");

      const [registrationResponse, tenantResponse, userResponse] = await Promise.all([
        supabaseClient
          .from("registrations")
          .select("*")
          .order("created_at", { ascending: false }),
        supabaseClient
          .from("tenants")
          .select("*")
          .order("created_at", { ascending: false }),
        supabaseClient
          .from("users")
          .select("*")
          .order("created_at", { ascending: false })
      ]);

      if (registrationResponse.error) {
        document.getElementById("registrationsBox").innerHTML = errorBox("Could not load registrations", registrationResponse.error.message);
      } else {
        registrations = registrationResponse.data || [];
      }

      if (tenantResponse.error) {
        document.getElementById("clientsBox").innerHTML = errorBox("Could not load approved clients", tenantResponse.error.message);
      } else {
        tenants = tenantResponse.data || [];
      }

      users = userResponse.data || [];

      renderPage();
      showToast("Admin approvals updated ✓");
    }

    function renderPage() {
      renderMetrics();
      renderRegistrations();
      renderClients();
    }

    function renderMetrics() {
      const pending = registrations.filter(function (row) {
        return getStatus(row) === "pending";
      }).length;

      const approved = registrations.filter(function (row) {
        return getStatus(row) === "approved";
      }).length;

      const rejected = registrations.filter(function (row) {
        return getStatus(row) === "rejected";
      }).length;

      const withLogin = registrations.filter(function (row) {
        return !!getValue(row, ["auth_user_id"], "");
      }).length;

      const withoutLogin = registrations.filter(function (row) {
        return !getValue(row, ["auth_user_id"], "");
      }).length;

      const metrics = [
        ["Pending", pending, "Awaiting admin approval", pending > 0 ? "orange" : "green"],
        ["Approved", approved, "Approved registration records", "green"],
        ["Rejected", rejected, "Rejected or invalid requests", rejected > 0 ? "red" : "blue"],
        ["With Login", withLogin, "Registered using email + password", "green"],
        ["Without Login", withoutLogin, "Old records that need re-registration", withoutLogin > 0 ? "red" : "green"],
        ["Approved Clients", tenants.length, "Tenant/client accounts created", "blue"]
      ];

      document.getElementById("metricsGrid").innerHTML = metrics.map(function (item) {
        return `
          <div class="metric ${attr(item[3])}">
            <h3>${safe(item[0])}</h3>
            <p>${safe(item[1])}</p>
            <div class="note">${safe(item[2])}</div>
          </div>
        `;
      }).join("");
    }

    function filteredRegistrations() {
      const status = value("filterStatus");
      const login = value("filterLogin");
      const query = value("searchBox").toLowerCase();

      let rows = [...registrations];

      if (status) {
        rows = rows.filter(function (row) {
          return getStatus(row) === status;
        });
      }

      if (login === "with_login") {
        rows = rows.filter(function (row) {
          return !!getValue(row, ["auth_user_id"], "");
        });
      }

      if (login === "without_login") {
        rows = rows.filter(function (row) {
          return !getValue(row, ["auth_user_id"], "");
        });
      }

      if (query) {
        rows = rows.filter(function (row) {
          const haystack = [
            getBusinessName(row),
            getValue(row, ["business_type", "business_type_key"], ""),
            getValue(row, ["contact_person", "full_name"], ""),
            getValue(row, ["email"], ""),
            getValue(row, ["phone"], ""),
            getValue(row, ["location"], ""),
            getStatus(row)
          ].join(" ").toLowerCase();

          return haystack.includes(query);
        });
      }

      return rows;
    }

    function renderRegistrations() {
      const rows = filteredRegistrations();

      document.getElementById("registrationsCount").innerText = rows.length + " registration(s) shown";

      if (rows.length === 0) {
        document.getElementById("registrationsBox").innerHTML = `
          <div class="empty">
            <h3>No registrations found</h3>
            <p>No records match the current filters.</p>
          </div>
        `;
        return;
      }

      document.getElementById("registrationsBox").innerHTML = rows.map(function (row) {
        return registrationCard(row);
      }).join("");
    }

    function registrationCard(row) {
      const status = getStatus(row);
      const hasLogin = !!getValue(row, ["auth_user_id"], "");
      const cardClass = !hasLogin && status === "pending" ? "warning" : status;

      return `
        <div class="registration-card ${attr(cardClass)}">
          <div class="record-title">${safe(getBusinessName(row))}</div>

          <p class="detail"><strong>Business Type:</strong> ${safe(getValue(row, ["business_type", "business_type_key"], "N/A"))}</p>
          <p class="detail"><strong>Contact:</strong> ${safe(getValue(row, ["contact_person", "full_name"], "N/A"))}</p>
          <p class="detail"><strong>Email:</strong> ${safe(getValue(row, ["email"], "N/A"))}</p>
          <p class="detail"><strong>Phone:</strong> ${safe(getValue(row, ["phone"], "N/A"))}</p>
          <p class="detail"><strong>Location:</strong> ${safe(getValue(row, ["location"], "N/A"))}</p>
          <p class="detail"><strong>Submitted:</strong> ${safe(formatDate(getValue(row, ["created_at"], "")))}</p>
          ${getValue(row, ["notes"], "") ? `<p class="detail"><strong>What they want to manage first:</strong> ${safe(getValue(row, ["notes"], ""))}</p>` : ""}

          ${badges(row)}

          ${
            !hasLogin
              ? `
                <div class="registration-card warning" style="margin-top:12px;">
                  <div class="record-title">Needs New Registration</div>
                  <p class="detail">
                    This request was created before the password registration fix. It has no login user/password.
                    Ask this client to register again using the updated registration page.
                  </p>
                </div>
              `
              : ""
          }

          <div class="button-row">
            ${
              status === "pending" && hasLogin
                ? `<button class="btn green" onclick="approveRegistration('${attr(row.id)}')">Approve & Create Client Login</button>`
                : ""
            }

            ${
              status === "pending"
                ? `<button class="btn red" onclick="rejectRegistration('${attr(row.id)}')">Reject</button>`
                : ""
            }

            ${
              status === "approved"
                ? `<button class="btn blue" onclick="showManualApprovalMessage('${attr(row.id)}')">Show Approval Message</button>`
                : ""
            }

            <a class="btn dark" href="admin-profiles.html">Client Profiles</a>
          </div>
        </div>
      `;
    }

    function badges(row) {
      const status = getStatus(row);
      const hasLogin = !!getValue(row, ["auth_user_id"], "");
      let html = "";

      if (status === "pending") html += `<span class="badge orange">Pending</span>`;
      if (status === "approved") html += `<span class="badge green">Approved</span>`;
      if (status === "rejected") html += `<span class="badge red">Rejected</span>`;

      if (hasLogin) {
        html += `<span class="badge green">Has Login User</span>`;
      } else {
        html += `<span class="badge red">No Password/Login</span>`;
      }

      const tenantId = getValue(row, ["tenant_id"], "");
      if (tenantId) {
        html += `<span class="badge blue">Tenant Linked</span>`;
      }

      return html;
    }

    async function approveRegistration(registrationId) {
      if (isBusy) return;

      if (!confirm("Approve this registration and create/link the client account?")) {
        return;
      }

      isBusy = true;
      showToast("Approving registration...");

      const response = await supabaseClient.rpc("approve_ungani_registration", {
        p_registration_id: registrationId
      });

      isBusy = false;

      if (response.error) {
        alert(response.error.message);
        return;
      }

      const result = response.data || {};

      if (result.ok !== true) {
        alert(result.message || "Approval failed.");
        return;
      }

      logAuditEvent("registration_approved", {
        entityType: "tenants",
        entityId: String(registrationId),
        tenantId: result.tenant_id || null,
        description: "Approved registration and created/linked client account"
      });

      showApprovalMessage(result.approval_message || buildApprovalMessage(result));
      showToast("Registration approved ✓");

      // Best-effort, non-blocking - the approval itself already succeeded
      // and the "Copy" text is already shown by the time this runs. The
      // RPC already queued the email; this just triggers an immediate
      // send instead of waiting for the next cron run. A failure here
      // only means the email goes out on the next cron instead of
      // instantly - it must never affect the approval flow itself.
      triggerApprovalEmailSendNow();

      await loadPageData();
    }

    async function triggerApprovalEmailSendNow() {
      try {
        const sessionRes = await supabaseClient.auth.getSession();
        const token = sessionRes?.data?.session?.access_token;

        if (!token) return;

        await fetch("/api/send-email-queue", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ limit: 15 })
        });
      } catch (error) {
        console.warn("Could not trigger immediate approval email send:", error.message);
      }
    }

    async function triggerAdminClientMessagePushNow(messageId) {
      if (!messageId) return;

      try {
        const sessionRes = await supabaseClient.auth.getSession();
        const token = sessionRes?.data?.session?.access_token;

        if (!token) return;

        await fetch("/api/send-event-push", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ eventType: "admin_client_message", relatedId: messageId }),
          keepalive: true
        });
      } catch (error) {
        console.warn("Could not trigger admin-to-client message push:", error.message);
      }
    }

    async function rejectRegistration(registrationId) {
      if (isBusy) return;

      const reason = prompt("Reason for rejection:", "Please register again using the updated registration form with password.");

      if (reason === null) return;

      isBusy = true;
      showToast("Rejecting registration...");

      const response = await supabaseClient.rpc("reject_ungani_registration", {
        p_registration_id: registrationId,
        p_reason: reason || "Rejected by UNGANI admin"
      });

      isBusy = false;

      if (response.error) {
        alert(response.error.message);
        return;
      }

      const result = response.data || {};

      if (result.ok !== true) {
        alert(result.message || "Reject failed.");
        return;
      }

      logAuditEvent("registration_rejected", {
        entityType: "tenants",
        entityId: String(registrationId),
        description: "Rejected registration: " + (reason || "Rejected by UNGANI admin")
      });

      showToast("Registration rejected ✓");
      await loadPageData();
    }

    function showManualApprovalMessage(registrationId) {
      const row = registrations.find(function (item) {
        return String(item.id) === String(registrationId);
      });

      if (!row) {
        alert("Registration not found.");
        return;
      }

      showApprovalMessage(buildApprovalMessage({
        business_name: getBusinessName(row),
        email: getValue(row, ["email"], ""),
        contact_person: getValue(row, ["contact_person", "full_name"], "there")
      }));
    }

    function buildApprovalMessage(data) {
      const contact = data.contact_person || "there";
      const businessName = data.business_name || "your business";

      return [
        "Hi " + contact + ",",
        "",
        "Your UNGANI OS demo account for " + businessName + " has been approved.",
        "",
        "You can now log in here:",
        "https://ungani-os-portal.vercel.app/client.html",
        "",
        "Please use the same email and password you created during registration.",
        "",
        "Regards,",
        "UNGANI",
        "info@ungani.com"
      ].join("\n");
    }

    function showApprovalMessage(message) {
      document.getElementById("approvalMessageText").value = message;
      document.getElementById("approvalMessageCard").classList.remove("hidden");
      document.getElementById("approvalMessageCard").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function hideApprovalMessage() {
      document.getElementById("approvalMessageCard").classList.add("hidden");
      document.getElementById("approvalMessageText").value = "";
    }

    async function copyApprovalMessage() {
      const message = document.getElementById("approvalMessageText").value;

      if (!message) {
        alert("No approval message to copy.");
        return;
      }

      try {
        await navigator.clipboard.writeText(message);
        showToast("Approval message copied ✓");
      } catch (error) {
        alert("Copy failed. Please select the text and copy manually.");
      }
    }

    function renderClients() {
      const approvedClients = tenants.filter(function (row) {
        const status = String(getValue(row, ["status", "account_status"], "")).toLowerCase();
        return status !== "cancelled";
      });

      document.getElementById("clientsCount").innerText = approvedClients.length + " client(s) shown";

      if (approvedClients.length === 0) {
        document.getElementById("clientsBox").innerHTML = `
          <div class="empty">
            <h3>No approved clients yet</h3>
            <p>Approved clients will appear here after registration approval.</p>
          </div>
        `;
        return;
      }

      document.getElementById("clientsBox").innerHTML = approvedClients.slice(0, 20).map(function (row) {
        return clientCard(row);
      }).join("");
    }

    function clientCard(row) {
      const linkedUsers = users.filter(function (user) {
        return String(getValue(user, ["tenant_id"], "")) === String(row.id);
      });

      return `
        <div class="registration-card approved">
          <div class="record-title">${safe(getBusinessName(row))}</div>

          <p class="detail"><strong>Business Type:</strong> ${safe(getValue(row, ["business_type", "business_type_key"], "N/A"))}</p>
          <p class="detail"><strong>Email:</strong> ${safe(getValue(row, ["business_email"], "N/A"))}</p>
          <p class="detail"><strong>Phone:</strong> ${safe(getValue(row, ["business_phone"], "N/A"))}</p>
          <p class="detail"><strong>Location:</strong> ${safe(getValue(row, ["business_location"], "N/A"))}</p>
          <p class="detail"><strong>Status:</strong> ${safe(getValue(row, ["status", "account_status"], "trial"))}</p>
          <p class="detail"><strong>Linked Login Users:</strong> ${safe(linkedUsers.length)}</p>

          <span class="badge green">Client Created</span>
          <span class="badge blue">${safe(getValue(row, ["account_status", "status"], "trial"))}</span>

          <div class="button-row">
            <a class="btn" href="admin-profiles.html">Open Profiles</a>
            <a class="btn dark" href="users.html">Open Users</a>
          </div>
        </div>
      `;
    }

    function resetFilters() {
      document.getElementById("filterStatus").value = "pending";
      document.getElementById("filterLogin").value = "";
      document.getElementById("searchBox").value = "";
      renderPage();
      showToast("Filters reset ✓");
    }

    function errorBox(title, message) {
      return `
        <div class="empty">
          <h3>${safe(title)}</h3>
          <p>${safe(message)}</p>
        </div>
      `;
    }

    function getStatus(row) {
      return String(getValue(row, ["status"], "pending")).toLowerCase();
    }

    function getBusinessName(row) {
      return getValue(row, ["business_name", "company_name", "name", "tenant_name"], "Client Business");
    }

    function getValue(row, names, fallback) {
      for (let i = 0; i < names.length; i++) {
        const key = names[i];

        if (row && row[key] !== undefined && row[key] !== null && row[key] !== "") {
          return row[key];
        }
      }

      return fallback;
    }

    function value(id) {
      const element = document.getElementById(id);
      return element ? String(element.value || "").trim() : "";
    }

    function formatDate(value) {
      if (!value) return "N/A";

      const date = new Date(value);
      if (isNaN(date.getTime())) return value;

      return date.toLocaleString("en-KE", {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function safe(value) {
      return String(value === null || value === undefined ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function attr(value) {
      return safe(value)
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function logAuditEvent(action, details) {
      return UnganiAdminShared.logAuditEvent(action, details);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>UNGANI OS - Integrations</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="pwa-register.js"></script>
  <script src="ungani-theme.js"></script>
  <script src="client-shared.js" onerror="window.__unganiClientSharedFailed = true;"></script>
  <script src="team-chat-shared.js"></script>
  <script src="ungani-nav-config.js"></script>
  <script>
    (function () {
      function showUnganiLoadError() {
        if (typeof UnganiClientShared !== "undefined") return;

        var banner = document.createElement("div");
        banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#B91C1C;color:#fff;padding:12px 16px;font:14px/1.4 -apple-system,sans-serif;text-align:center;";
        banner.innerHTML = "Some page resources failed to load. Please check your connection. " +
          "<button style=\"margin-left:10px;padding:4px 12px;border:none;border-radius:6px;background:#fff;color:#B91C1C;font-weight:700;cursor:pointer;\" onclick=\"window.location.reload()\">Reload</button>";

        if (document.body) {
          document.body.prepend(banner);
        } else {
          document.addEventListener("DOMContentLoaded", function () {
            document.body.prepend(banner);
          });
        }
      }

      if (window.__unganiClientSharedFailed) {
        showUnganiLoadError();
      } else {
        setTimeout(function () {
          if (typeof UnganiClientShared === "undefined") showUnganiLoadError();
        }, 4000);
      }
    })();
  </script>
  <script src="ungani-business-config.js"></script>
  <script src="ungani-presets.js"></script>
  <script src="nia-assistant.js"></script>

  <style>
    .ungani-integration-grid {
      margin-top: 4px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    @media (max-width: 780px) {
      .ungani-integration-grid {
        grid-template-columns: 1fr;
      }
    }

    .ungani-integration-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ungani-integration-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .ungani-integration-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      background: rgba(212,166,58,0.14);
      border: 1px solid rgba(212,166,58,0.28);
      flex-shrink: 0;
    }

    .ungani-integration-icon svg {
      width: 22px;
      height: 22px;
      stroke-width: 2px;
      color: var(--ungani-gold);
    }

    .ungani-integration-detail {
      margin: 0;
      font-size: 13px;
      color: var(--ungani-muted);
      line-height: 1.5;
    }

    .ungani-integration-meta {
      font-size: 12.5px;
      color: var(--ungani-muted);
    }

    .ungani-integration-category {
      margin: 0 0 2px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ungani-gold);
    }

    .ungani-integration-card-soon {
      opacity: 0.72;
    }
  </style>
</head>

<body>
  <script>
    let currentContext = null;
    let cardStatusCache = {};
    let businessTypeLabel = "";
    let resolvedBusinessKey = "";

    // A registry, not per-integration page logic - adding a real M-Pesa/
    // eTIMS/Accounting integration later means adding one entry here and
    // pointing it at that integration's own status source, not
    // restructuring this page. Each integration keeps its own source of
    // truth (Google Drive's own locked-down RPC) - this registry only
    // unifies how their status is DISPLAYED, never how their credentials
    // are stored. See the Integrations technical plan for the full
    // security rationale.
    //
    // GPS Tracking and CCTV Monitoring were removed 2026-09-11 - they were
    // self-reported reference cards only (no real device/API connection,
    // by the wizard's own on-screen disclaimer), and were creating real
    // confusion for business owners who expected live tracking/camera
    // data. Revisit as a real integration only once a specific client's
    // actual GPS/CCTV provider is known to build against. POS Systems was
    // also removed the same day - it was a stale "integrate a third-party
    // POS" concept from before UNGANI built its own native Quick Sale
    // (my-quick-sale.html, gated by tenants.pos_enabled in Settings), and
    // having two different "POS" entries in two different places was
    // actively misleading.
    const INTEGRATIONS_REGISTRY = [
      {
        key: "google_drive",
        label: "Google Drive",
        icon: '<i data-lucide="folder"></i>',
        category: "Storage",
        live: true,
        description: "Link your Google Drive so you can pick real files straight into Documents - no more pasting links by hand.",
        manageHref: "my-settings.html#googleDriveIntegrationPanel"
      },
      {
        key: "mpesa",
        label: "M-Pesa",
        icon: '<i data-lucide="smartphone"></i>',
        category: "Payments",
        comingSoon: true,
        description: "Automatically record business payments as they come in."
      },
      {
        key: "etims",
        label: "KRA eTIMS",
        icon: '<i data-lucide="file-text"></i>',
        category: "Compliance",
        comingSoon: true,
        description: "Report invoices to KRA directly from UNGANI."
      },
      {
        key: "accounting",
        label: "Accounting",
        icon: '<i data-lucide="book-open"></i>',
        category: "Finance",
        comingSoon: true,
        description: "Send your UNGANI transactions to your accounting software."
      }
    ];

    function isEligible(def) {
      if (!def.eligibleTypes) return true;
      return def.eligibleTypes.indexOf(resolvedBusinessKey) !== -1;
    }

    window.addEventListener("load", function () {
      UnganiClientShared.initPage({
        pageKey: "integrations",
        pageTitle: "Integrations",
        pageSubtitle: "See what's connected to your business, and connect the tools you already use.",
        onReady: startIntegrationsPage
      });
    });

    async function startIntegrationsPage(context) {
      currentContext = context;

      const resolvedType = window.UnganiBusinessConfig && typeof UnganiBusinessConfig.resolve === "function"
        ? UnganiBusinessConfig.resolve(context.tenant)
        : null;

      businessTypeLabel = resolvedType ? resolvedType.name : "";
      resolvedBusinessKey = resolvedType ? resolvedType.key : "";

      await loadIntegrations();
    }

    async function loadIntegrations() {
      currentContext.contentEl.innerHTML = UnganiClientShared.loadingCard("Loading your integrations...");

      // Google Drive owns its own locked-down status RPC (see
      // sql/google-drive-integration.sql). A failure here just means the
      // card shows "Not Connected"; it never blocks the rest of the page.
      let driveStatus = { connected: false };

      try {
        const driveResponse = await currentContext.supabaseClient.rpc("get_my_ungani_google_drive_status");
        if (!driveResponse.error && driveResponse.data) {
          driveStatus = driveResponse.data;
        }
      } catch (error) {
        // Non-fatal.
      }

      cardStatusCache = { google_drive: driveStatus };

      renderIntegrationsPage();
    }

    function renderIntegrationCard(def) {
      if (def.comingSoon) {
        return `
          <div class="ungani-card ungani-integration-card ungani-integration-card-soon">
            <div class="ungani-integration-card-head">
              <div class="ungani-integration-icon">${def.icon}</div>
              <span class="ungani-badge">Coming Soon</span>
            </div>
            <div>
              <p class="ungani-integration-category">${UnganiClientShared.safe(def.category)}</p>
              <h3 style="margin:0 0 6px;">${UnganiClientShared.safe(def.label)}</h3>
              <p class="ungani-integration-detail">${UnganiClientShared.safe(def.description)}</p>
            </div>
          </div>
        `;
      }

      if (def.key === "google_drive") {
        const status = cardStatusCache.google_drive || { connected: false };
        const connected = !!status.connected;

        const statusBadge = connected
          ? `<span class="ungani-badge green">Connected</span>`
          : `<span class="ungani-badge">Not Connected</span>`;

        const detail = connected
          ? `<p class="ungani-integration-detail"><strong>${UnganiClientShared.safe(status.connected_email || "Connected")}</strong></p>
             <p class="ungani-integration-meta">${status.connected_at ? "Connected " + UnganiClientShared.formatDate(status.connected_at) : ""}</p>`
          : `<p class="ungani-integration-detail">${UnganiClientShared.safe(def.description)}</p>`;

        return `
          <div class="ungani-card ungani-integration-card">
            <div class="ungani-integration-card-head">
              <div class="ungani-integration-icon">${def.icon}</div>
              ${statusBadge}
            </div>
            <div>
              <p class="ungani-integration-category">${UnganiClientShared.safe(def.category)}</p>
              <h3 style="margin:0 0 6px;">${UnganiClientShared.safe(def.label)}</h3>
              ${detail}
            </div>
            <a class="ungani-btn dark" href="${UnganiClientShared.attr(def.manageHref)}">${connected ? "Manage" : "Connect"}</a>
          </div>
        `;
      }

      // Every remaining registry entry is either comingSoon or google_drive,
      // both handled above - nothing else reaches this point.
      return "";
    }

    function renderIntegrationsPage() {
      const eligibleCards = INTEGRATIONS_REGISTRY.filter(isEligible);

      UnganiClientShared.setContent(`
        <section class="ungani-card ungani-hero">
          <h2>Integrations</h2>
          <p>
            See what's connected to your business in one place, and connect the tools you already use.
            UNGANI OS doesn't sell or provide any of these systems - it links to what you already have.
          </p>
        </section>

        <section class="ungani-integration-grid">
          ${eligibleCards.map(renderIntegrationCard).join("")}
        </section>
      `);
    }

  </script>
</body>
</html>

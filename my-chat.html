<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>UNGANI OS - Chat with UNGANI</title>

  <style>
    /* Nia's reused HELP_TOPICS/HOW_TO_TOPICS answers (via getGuidanceHtml())
       carry an a.nia-link-btn - nia-assistant.js only styles that inside its
       own .nia-bubble (the floating panel's message markup), which this
       page's Nia widget doesn't use, so it renders unstyled without this. */
    a.nia-link-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #D4A63A;
      color: #061C3D;
      font-weight: 800;
      font-size: 12px;
      text-decoration: none;
    }

    /* Brief "thinking" beat before Nia's reply appears - matches
       nia-assistant.js's showTypingIndicator()/replyWithDelay() on the
       floating panel, so this widget doesn't feel robotic by comparison. */
    .nia-typing-dots span {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #D4A63A;
      margin-right: 5px;
      animation: niaChatTypingBounce 1s infinite ease-in-out;
    }

    .nia-typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .nia-typing-dots span:nth-child(3) { animation-delay: 0.3s; margin-right: 0; }

    @keyframes niaChatTypingBounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .nia-typing-dots span { animation: none; }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="pwa-register.js"></script>
  <script src="ungani-theme.js"></script>
  <script src="client-shared.js" onerror="window.__unganiClientSharedFailed = true;"></script>
  <script src="team-chat-shared.js"></script>
  <script src="ungani-nav-config.js"></script>
  <script>
    (function () {
      function showUnganiLoadError() {
        if (typeof UnganiClientShared !== "undefined") return;

        var banner = document.createElement("div");
        banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#B91C1C;color:#fff;padding:12px 16px;font:14px/1.4 -apple-system,sans-serif;text-align:center;";
        banner.innerHTML = "Some page resources failed to load. Please check your connection. " +
          "<button style=\"margin-left:10px;padding:4px 12px;border:none;border-radius:6px;background:#fff;color:#B91C1C;font-weight:700;cursor:pointer;\" onclick=\"window.location.reload()\">Reload</button>";

        if (document.body) {
          document.body.prepend(banner);
        } else {
          document.addEventListener("DOMContentLoaded", function () {
            document.body.prepend(banner);
          });
        }
      }

      if (window.__unganiClientSharedFailed) {
        showUnganiLoadError();
      } else {
        setTimeout(function () {
          if (typeof UnganiClientShared === "undefined") showUnganiLoadError();
        }, 4000);
      }
    })();
  </script>
  <script src="nia-assistant.js"></script>
</head>

<body>
  <script>
    let currentContext = null;
    let messages = [];
    let refreshTimer = null;

    // Nia first-responder widget - see CHAT_CATEGORIES below for the full
    // behavior of each category. State is tracked here (not just left in
    // the DOM) because renderChatPage() fully replaces the page content
    // every 20s (loadMessages(true) on refreshTimer) and after every send -
    // rebuilding the widget from this state on each render is what keeps
    // it from silently resetting mid-conversation.
    //
    // Phase 2 (append-only transcript): niaTranscript is a growing list of
    // {from: "nia"|"user", html} turns, pushed to and never overwritten -
    // the full back-and-forth (question, answer, "didn't help", follow-up,
    // escalation ack) all stay visible at once instead of each stage
    // replacing the last. niaStage/niaPendingCategoryKey/niaHadShownAnswer
    // are small pieces of *control* state (what live input to show next,
    // and context needed by escalateToAdmin) - deliberately kept separate
    // from the transcript itself, which is pure display history.
    let niaTranscript = [];
    let niaStage = "categories";
    let niaThinking = false;
    let niaPendingCategoryKey = null;
    let niaHadShownAnswer = false;
    const NIA_CHAT_THINK_DELAY_MS = 320; // matches nia-assistant.js's replyWithDelay()

    // Small conversational touch: a fresh greeting each time the widget
    // resets, rather than the identical line every single visit -
    // stays put for the rest of the session so it doesn't shuffle mid-
    // conversation on re-render. Real content is unchanged, just less
    // robotic to encounter repeatedly.
    const NIA_GREETINGS = [
      "Hi! What can I help you with today?",
      "Hey there - what's going on?",
      "Welcome to UNGANI! How can I help you today?",
      "Hi again - what do you need a hand with?"
    ];
    const niaGreeting = NIA_GREETINGS[Math.floor(Math.random() * NIA_GREETINGS.length)];

    // guidanceKey maps to a real NiaAssistant.getGuidanceHtml() key (from
    // HELP_TOPICS or HOW_TO_TOPICS in nia-assistant.js) - reusing Nia's
    // actual existing knowledge rather than writing new copy that could
    // drift out of sync with what she already says elsewhere in the app.
    // alwaysEscalate categories are ones a real human needs to act on
    // regardless of what guidance Nia can offer first.
    const CHAT_CATEGORIES = [
      { key: "login", label: "Trouble logging in", guidanceKey: "password", alwaysEscalate: false },
      { key: "registration", label: "Registration issues", guidanceKey: "registration-status", alwaysEscalate: true },
      { key: "document", label: "Document upload help", guidanceKey: "upload-document", alwaysEscalate: false },
      { key: "billing", label: "Billing question", guidanceKey: "subscription", alwaysEscalate: false },
      { key: "other", label: "Something else", guidanceKey: null, alwaysEscalate: true }
    ];

    window.addEventListener("load", function () {
      UnganiClientShared.initPage({
        pageKey: "chat",
        pageTitle: "Chat with UNGANI",
        pageSubtitle: "Send questions, updates, and support messages directly to UNGANI.",
        onReady: startChatPage
      });
    });

    window.addEventListener("beforeunload", function () {
      if (refreshTimer) {
        clearInterval(refreshTimer);
      }
    });

    async function startChatPage(context) {
      currentContext = context;
      await loadMessages();

      refreshTimer = setInterval(function () {
        loadMessages(true);
      }, 20000);
    }

    async function loadMessages(silent) {
      // renderChatPage() below rebuilds the ENTIRE page including the
      // message textarea - on the 20s auto-poll (silent=true) that means
      // a message in progress gets silently wiped out from under the
      // user's cursor, mid-keystroke on mobile. Skip this poll cycle
      // entirely while they're actively composing (focused or has typed
      // something) rather than destroying their draft; the next poll
      // after they stop picks the conversation back up.
      if (silent) {
        const draftEl = document.getElementById("messageBody");
        const userIsComposing = draftEl && (document.activeElement === draftEl || draftEl.value.trim().length > 0);
        if (userIsComposing) return;
      }

      if (!silent) {
        currentContext.contentEl.innerHTML = UnganiClientShared.loadingCard("Loading chat messages...");
      }

      let response;

      try {
        response = await currentContext.supabaseClient
          .from("admin_client_messages")
          .select("*")
          .eq("tenant_id", currentContext.tenantId)
          .order("created_at", { ascending: true });
      } catch (error) {
        if (!silent) {
          currentContext.contentEl.innerHTML = UnganiClientShared.errorCard("Could not load chat", error.message || "Network error. Please check your connection.");
        }
        return;
      }

      if (response.error) {
        if (!silent) {
          currentContext.contentEl.innerHTML = UnganiClientShared.errorCard("Could not load chat", response.error.message);
        }
        return;
      }

      messages = response.data || [];
      await markAdminMessagesRead();
      renderChatPage();
    }

    async function markAdminMessagesRead() {
      try {
        await currentContext.supabaseClient
          .from("admin_client_messages")
          .update({
            is_read: true,
            updated_at: new Date().toISOString()
          })
          .eq("tenant_id", currentContext.tenantId)
          .neq("sender_role", "client")
          .eq("is_read", false);
      } catch (error) {
        console.warn("Could not mark admin messages as read:", error.message);
      }
    }

    function renderChatPage() {
      const summary = calculateSummary();

      UnganiClientShared.setContent(`
        <section class="ungani-card ungani-hero">
          <h2>Chat with UNGANI</h2>
          <p class="ungani-small" style="margin:0 0 8px;font-weight:800;color:#D4A63A;display:flex;align-items:center;gap:6px;"><i data-lucide="message-circle" width="16" height="16"></i> Chatting with UNGANI Support</p>
          <p>
            Use this chat for support questions, setup requests, business workflow questions, and updates that need a response from UNGANI.
          </p>

          <div class="ungani-button-row">
            <button class="ungani-btn" onclick="loadMessages()">Refresh Chat</button>
            <a class="ungani-btn green" href="my-support.html">Create Support Issue</a>
            <a class="ungani-btn dark" href="my-notices.html">Notices</a>
          </div>
        </section>

        ${renderNiaWidget()}

        <section class="ungani-grid">
          ${UnganiClientShared.metricCard("Total Messages", messages.length, "All chat messages", "blue")}
          ${UnganiClientShared.metricCard("Your Messages", summary.clientMessages, "Sent by your business", "gold")}
          ${UnganiClientShared.metricCard("UNGANI Replies", summary.adminMessages, "Replies from UNGANI", "green")}
          ${UnganiClientShared.metricCard("Unread Replies", summary.unreadAdmin, "Unread UNGANI messages", summary.unreadAdmin > 0 ? "orange" : "green")}
        </section>

        <section class="ungani-two-col">
          <div class="ungani-card">
            <div class="ungani-section-title">
              <div>
                <h3>Conversation</h3>
                <p class="ungani-small">Messages refresh automatically every 20 seconds.</p>
              </div>

              <button class="ungani-btn green" onclick="loadMessages()">Refresh</button>
            </div>

            <div id="chatBox" style="max-height:620px;overflow:auto;padding-right:6px;">
              ${renderMessageList()}
            </div>
          </div>

          <div class="ungani-card">
            <div class="ungani-section-title">
              <h3>Send Message</h3>
            </div>

            ${renderMessageForm()}

            <div class="ungani-card" style="box-shadow:none;margin-top:16px;">
              <strong>Good uses for chat</strong>
              <p class="ungani-small">Ask setup questions, request help, clarify reports, ask how to organize your workflow, or send quick operational updates.</p>
            </div>

            <div class="ungani-card" style="box-shadow:none;">
              <strong>For serious issues</strong>
              <p class="ungani-small">Use Support Issues when you need a problem tracked with priority and status.</p>
              <a class="ungani-btn" href="my-support.html">Open Support</a>
            </div>
          </div>
        </section>

        <p class="ungani-small">
          Chat Version: Step 307C Shared Layout · ungani.com · info@ungani.com
        </p>
      `);

      scrollChatToBottom();
    }

    // Nia's own message bubbles reuse the exact same .ungani-card left-
    // border style renderMessageCard() already uses for "UNGANI" replies
    // (gold border) - visually it reads as one more voice in the same
    // conversation, not a separate bolted-on widget.
    function niaBubble(html) {
      return `
        <div class="ungani-card" style="box-shadow:none;border-left:5px solid #D4A63A;background:rgba(212,166,58,0.14);margin-bottom:12px;">
          <div class="ungani-section-title">
            <div><h3>Nia</h3></div>
          </div>
          <div style="white-space:pre-wrap;">${html}</div>
        </div>
      `;
    }

    function clientChoiceBubble(label) {
      return `
        <div class="ungani-card" style="box-shadow:none;border-left:5px solid #061C3D;background:rgba(6,28,61,0.05);margin-bottom:12px;">
          <div class="ungani-section-title">
            <div><h3>You</h3></div>
          </div>
          <p style="margin:0;">${UnganiClientShared.safe(label)}</p>
        </div>
      `;
    }

    function niaChip(label, onclick) {
      return `<button type="button" class="ungani-btn small gold" onclick="${onclick}">${UnganiClientShared.safe(label)}</button>`;
    }

    // Bare three-dot "thinking" indicator, styled like a Nia bubble but
    // with no text - shown for NIA_CHAT_THINK_DELAY_MS before her actual
    // reply is appended, so responses don't feel instant/robotic.
    function niaTypingBubble() {
      return `
        <div class="ungani-card" style="box-shadow:none;border-left:5px solid #D4A63A;background:rgba(212,166,58,0.14);margin-bottom:12px;">
          <div class="ungani-section-title">
            <div><h3>Nia</h3></div>
          </div>
          <div class="nia-typing-dots"><span></span><span></span><span></span></div>
        </div>
      `;
    }

    // The one place a user action turns into a transcript update: appends
    // the user's turn immediately (no delay - their own message should
    // never feel laggy), shows the typing indicator, waits
    // NIA_CHAT_THINK_DELAY_MS, then runs buildNiaReply (which pushes
    // Nia's turn(s) onto niaTranscript and sets niaStage) before the final
    // render. buildNiaReply may be async (escalateToAdmin does a real DB
    // insert) - awaited so the "escalated" acknowledgment only appears
    // once the message has actually been routed, same ordering guarantee
    // the original single-stage version had.
    async function appendUserTurnThenNiaReply(userLabel, buildNiaReply) {
      niaTranscript.push({ from: "user", html: userLabel });
      niaThinking = true;
      renderChatPage();

      await new Promise(function (resolve) { setTimeout(resolve, NIA_CHAT_THINK_DELAY_MS); });

      niaThinking = false;
      await buildNiaReply();
      renderChatPage();
    }

    function renderNiaWidget() {
      // Seed once per conversation (transcript starts empty on load and
      // after "Ask something else") - never re-added on subsequent
      // renders, since renderChatPage() re-runs this on every 20s poll
      // and after every action.
      if (niaTranscript.length === 0) {
        niaTranscript.push({ from: "nia", html: niaGreeting });
        niaTranscript.push({ from: "nia", html: "Type your question below, or pick a quick option if that's easier." });
      }

      const parts = niaTranscript.map(function (turn) {
        return turn.from === "nia" ? niaBubble(turn.html) : clientChoiceBubble(turn.html);
      });

      if (niaThinking) {
        parts.push(niaTypingBubble());
        return `<section class="ungani-card">${parts.join("")}</section>`;
      }

      // Phase 3 (hierarchy inversion): free text is the primary, most
      // prominent input - category chips are a secondary "quick option"
      // row underneath, not the leading action. Reversed from the
      // original chips-first layout now that Phase 1 proved free-text
      // matching (matchFreeTextGuidance) works well on real questions.
      if (niaStage === "categories") {
        parts.push(`
          <form onsubmit="submitNiaFreeStart(event)" style="margin-bottom:14px;">
            <label for="niaFreeStartInput" style="display:block;font-weight:800;margin-bottom:6px;">Type your question</label>
            <textarea id="niaFreeStartInput" placeholder="e.g. How do I upload a document?" style="min-height:70px;"></textarea>
            <div class="ungani-button-row" style="margin-top:10px;">
              <button class="ungani-btn gold" type="submit">Send</button>
            </div>
          </form>
          <p class="ungani-small" style="margin:0 0 8px;color:#64748B;">Or pick a quick option:</p>
          <div class="ungani-button-row" style="margin-bottom:4px;">${CHAT_CATEGORIES.map(function (c) {
            return niaChip(c.label, "selectNiaCategory('" + c.key + "')");
          }).join("")}</div>
        `);
      } else if (niaStage === "answered") {
        parts.push(`<div class="ungani-button-row" style="margin-bottom:4px;">
          ${niaChip("Yes, thanks!", "niaFeedback(true)")}
          ${niaChip("No, I still need help", "niaFeedback(false)")}
        </div>`);
      } else if (niaStage === "composing") {
        parts.push(`
          <form onsubmit="submitNiaCompose(event)" style="margin-bottom:4px;">
            <textarea id="niaComposeInput" required placeholder="Type your question or message here..." style="min-height:90px;"></textarea>
            <div class="ungani-button-row" style="margin-top:10px;">
              <button class="ungani-btn gold" type="submit">Send to UNGANI</button>
            </div>
          </form>
        `);
      } else if (niaStage === "resolved" || niaStage === "escalated") {
        parts.push(`<div class="ungani-button-row" style="margin-bottom:4px;">${niaChip("Ask something else", "resetNiaWidget()")}</div>`);
      }

      return `<section class="ungani-card">${parts.join("")}</section>`;
    }

    function resetNiaWidget() {
      niaTranscript = [];
      niaStage = "categories";
      niaThinking = false;
      niaPendingCategoryKey = null;
      niaHadShownAnswer = false;
      renderChatPage();
    }

    function selectNiaCategory(key) {
      const category = CHAT_CATEGORIES.find(function (c) { return c.key === key; });
      if (!category) return;

      appendUserTurnThenNiaReply(category.label, function () {
        const guidance = category.guidanceKey && window.NiaAssistant && typeof window.NiaAssistant.getGuidanceHtml === "function"
          ? window.NiaAssistant.getGuidanceHtml(category.guidanceKey)
          : null;

        niaPendingCategoryKey = key;

        if (category.alwaysEscalate && !guidance) {
          // Real bug (pre-existing, unrelated to this redesign): "Something
          // else" (and any future no-guidance category) escalated
          // immediately with zero client-typed content - admin just saw
          // "client selected: Something else." with nothing to go on. Let
          // them actually say what's going on first.
          niaHadShownAnswer = false;
          niaTranscript.push({ from: "nia", html: "Sure - what's going on? I'll pass this straight to the UNGANI team." });
          niaStage = "composing";
          return;
        }

        if (category.alwaysEscalate) {
          if (guidance) niaTranscript.push({ from: "nia", html: guidance.html });
          niaTranscript.push({ from: "nia", html: "Thanks for reaching out - I've noted your message and our team will respond to you shortly." });
          niaStage = "escalated";
          return escalateToAdmin(category, guidance ? guidance.spoken : null);
        }

        niaHadShownAnswer = true;
        niaTranscript.push({ from: "nia", html: guidance.html });
        niaTranscript.push({ from: "nia", html: "Did this solve it?" });
        niaStage = "answered";
      });
    }

    function niaFeedback(helped) {
      const label = helped ? "Yes, thanks!" : "No, I still need help";

      appendUserTurnThenNiaReply(label, function () {
        if (helped) {
          niaTranscript.push({ from: "nia", html: "Glad I could help! If anything else comes up, I'm right here." });
          niaStage = "resolved";
          return;
        }

        // Same fix as "Something else" - rather than escalate with only a
        // generic "didn't help" note, let the client say what's actually
        // still wrong so admin has real content to act on.
        niaTranscript.push({ from: "nia", html: "Sorry that didn't help - what's still going on? I'll make sure the team sees it." });
        niaStage = "composing";
      });
    }

    // Real content instead of a guaranteed human hand-off: nia-assistant.js
    // already has 35 FAQ/how-to answers (the same ones getGuidanceHtml()
    // serves to category chips) and a pure, side-effect-free matcher for
    // them (matchFreeTextGuidance) - typed text tries that FIRST, and only
    // falls through to escalation if nothing matches. Deliberately not
    // using nia-assistant.js's fuller interpretMessage() cascade here -
    // that one drives the floating panel directly (DOM appends,
    // navigation, live Supabase queries) and this page never calls
    // NiaAssistant.init(), so it has no panel/container for those side
    // effects to land in.
    function tryFreeTextGuidance(text) {
      return window.NiaAssistant && typeof window.NiaAssistant.matchFreeTextGuidance === "function"
        ? window.NiaAssistant.matchFreeTextGuidance(text)
        : null;
    }

    // Same escape hatch as submitNiaCompose, but reachable straight from
    // the very first screen - a client shouldn't have to click through a
    // category first just to type what's actually on their mind.
    async function submitNiaFreeStart(event) {
      event.preventDefault();

      const textarea = document.getElementById("niaFreeStartInput");
      const text = textarea ? textarea.value.trim() : "";
      if (!text) return;

      await appendUserTurnThenNiaReply(text, function () {
        const match = tryFreeTextGuidance(text);

        niaPendingCategoryKey = null;

        if (match) {
          niaHadShownAnswer = true;
          niaTranscript.push({ from: "nia", html: match.html });
          niaTranscript.push({ from: "nia", html: "Did this solve it?" });
          niaStage = "answered";
          return;
        }

        niaHadShownAnswer = false;
        niaTranscript.push({ from: "nia", html: "Thanks for reaching out - I've noted your message and our team will respond to you shortly." });
        niaStage = "escalated";
        return escalateToAdmin(null, null, text);
      });
    }

    async function submitNiaCompose(event) {
      event.preventDefault();

      const textarea = document.getElementById("niaComposeInput");
      const text = textarea ? textarea.value.trim() : "";

      if (!text) {
        if (textarea) textarea.focus();
        return;
      }

      await appendUserTurnThenNiaReply(text, function () {
        const match = tryFreeTextGuidance(text);

        if (match) {
          niaHadShownAnswer = true;
          niaTranscript.push({ from: "nia", html: match.html });
          niaTranscript.push({ from: "nia", html: "Did this solve it?" });
          niaStage = "answered";
          return;
        }

        // If an answer was already showing before this compose box
        // appeared (the "No, I still need help" path), let admin know
        // Nia already tried, rather than making them re-derive that from
        // a blank slate.
        const note = niaHadShownAnswer ? "Nia had already suggested an answer, but the client says it didn't resolve this." : null;
        const category = niaPendingCategoryKey ? CHAT_CATEGORIES.find(function (c) { return c.key === niaPendingCategoryKey; }) : null;

        niaTranscript.push({ from: "nia", html: "Thanks for reaching out - I've noted your message and our team will respond to you shortly." });
        niaStage = "escalated";
        return escalateToAdmin(category, note, text);
      });
    }

    // Routes an unresolved Nia conversation into the same admin_client_
    // messages flow the manual "Send Message" form below already uses -
    // same payload shape, so it shows up in admin-chat.html exactly like
    // any other client message. Best-effort: a failure here still leaves
    // the client seeing the acknowledgment (set by the caller regardless),
    // since the actual chat form is always right there as a fallback if
    // this silently doesn't land.
    async function escalateToAdmin(category, note, clientMessage) {
      const label = category ? category.label : "General inquiry";
      let body = "Nia chat routing - client selected: " + label + ".";

      if (note) {
        body += " " + note;
      }

      if (clientMessage) {
        body += "\n\nClient's message: " + clientMessage;
      }

      const messageId = crypto.randomUUID();

      const payload = {
        id: messageId,
        tenant_id: currentContext.tenantId,
        sender_user_id: currentContext.authUser.id,
        sender_role: "client",
        message_type: "support_request",
        message_body: body,
        message: body,
        body: body,
        attachment_url: null,
        is_read: false,
        created_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
      };

      try {
        await currentContext.supabaseClient.from("admin_client_messages").insert(payload);
        UnganiClientShared.triggerEventPush("client_admin_message", messageId);
        await loadMessages(true);
      } catch (error) {
        console.warn("Could not route Nia conversation to admin:", error.message);
      }
    }

    function renderMessageForm() {
      return `
        <form id="chatForm" onsubmit="sendMessage(event)">
          <label for="messageType">Message Type</label>
          <select id="messageType">
            <option value="message">General Message</option>
            <option value="question">Question</option>
            <option value="support_request">Support Request</option>
            <option value="setup_request">Setup Request</option>
            <option value="workflow_question">Workflow Question</option>
            <option value="document_question">Document Question</option>
            <option value="report_question">Report Question</option>
            <option value="other">Other</option>
          </select>

          <label for="messageBody">Message</label>
          <textarea id="messageBody" required placeholder="Type your message to UNGANI here..."></textarea>

          <label for="attachmentUrl">Optional Link</label>
          <input id="attachmentUrl" type="url" placeholder="Paste a Google Drive, document, or screenshot link if needed" />

          <div class="ungani-button-row">
            <button class="ungani-btn green" type="submit">Send Message</button>
            <button class="ungani-btn dark" type="button" onclick="clearForm()">Clear</button>
          </div>
        </form>
      `;
    }

    function renderMessageList() {
      if (messages.length === 0) {
        return `
          <div class="ungani-empty">
            <h3>No messages yet</h3>
            <p>Send your first message to UNGANI using the form on the right.</p>
          </div>
        `;
      }

      return messages.map(function (row) {
        return renderMessageCard(row);
      }).join("");
    }

    function renderMessageCard(row) {
      const role = String(UnganiClientShared.getValue(row, ["sender_role"], "client")).toLowerCase();
      const isClient = role === "client";
      const type = UnganiClientShared.getValue(row, ["message_type"], "message");
      const body = UnganiClientShared.getValue(row, ["message_body", "message", "body"], "");
      const attachmentUrl = UnganiClientShared.getValue(row, ["attachment_url"], "");
      const created = UnganiClientShared.getValue(row, ["created_at"], "");
      const read = UnganiClientShared.getValue(row, ["is_read"], false);

      const bg = isClient ? "rgba(6,28,61,0.05)" : "rgba(212,166,58,0.14)";
      const border = isClient ? "#061C3D" : "#D4A63A";
      const sender = isClient ? "You" : "UNGANI";

      return `
        <div class="ungani-card" style="box-shadow:none;border-left:5px solid ${border};background:${bg};">
          <div class="ungani-section-title">
            <div>
              <h3>${UnganiClientShared.safe(sender)}</h3>
              <p class="ungani-small">${UnganiClientShared.safe(UnganiClientShared.formatDate(created))}</p>
            </div>

            <div>
              ${badge(type, isClient ? "blue" : "gold")}
              ${isClient ? badge(read ? "read" : "sent", read ? "green" : "orange") : ""}
            </div>
          </div>

          <p style="white-space:pre-wrap;margin-bottom:12px;">${UnganiClientShared.safe(body)}</p>

          ${attachmentUrl ? `
            <a class="ungani-btn green" href="${UnganiClientShared.attr(attachmentUrl)}" target="_blank" rel="noopener">Open Link</a>
          ` : ""}
        </div>
      `;
    }

    function calculateSummary() {
      let clientMessages = 0;
      let adminMessages = 0;
      let unreadAdmin = 0;

      messages.forEach(function (row) {
        const role = String(UnganiClientShared.getValue(row, ["sender_role"], "client")).toLowerCase();
        const read = UnganiClientShared.getValue(row, ["is_read"], false);

        if (role === "client") {
          clientMessages++;
        } else {
          adminMessages++;

          if (!read) {
            unreadAdmin++;
          }
        }
      });

      return { clientMessages, adminMessages, unreadAdmin };
    }

    async function sendMessage(event) {
      event.preventDefault();

      const body = UnganiClientShared.value("messageBody");

      if (!body) {
        alert("Please type a message.");
        return;
      }

      const messageId = crypto.randomUUID();

      const payload = {
        id: messageId,
        tenant_id: currentContext.tenantId,
        sender_user_id: currentContext.authUser.id,
        sender_role: "client",
        message_type: UnganiClientShared.value("messageType") || "message",
        message_body: body,
        message: body,
        body: body,
        attachment_url: UnganiClientShared.value("attachmentUrl") || null,
        is_read: false,
        created_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
      };

      let response;

      try {
        response = await currentContext.supabaseClient
          .from("admin_client_messages")
          .insert(payload);
      } catch (error) {
        alert(error.message || "Could not send message. Please check your connection.");
        return;
      }

      if (response.error) {
        alert(response.error.message);
        return;
      }

      UnganiClientShared.triggerEventPush("client_admin_message", messageId);

      clearForm();
      UnganiClientShared.showToast("Message sent ✓");
      await loadMessages(true);
    }

    function clearForm() {
      const form = document.getElementById("chatForm");

      if (form) {
        form.reset();
      }
    }

    function scrollChatToBottom() {
      setTimeout(function () {
        const box = document.getElementById("chatBox");

        if (box) {
          box.scrollTop = box.scrollHeight;
        }
      }, 100);
    }

    function badge(text, color) {
      return `<span class="ungani-badge ${UnganiClientShared.attr(color || "blue")}">${UnganiClientShared.safe(text)}</span>`;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>UNGANI OS Admin M-Pesa Callbacks</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="pwa-register.js"></script>
  <script src="admin-shared.js"></script>
  <script src="ungani-admin-nav-config.js"></script>

  <style>
    .page-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .metric-card {
      background: var(--ungani-card);
      border: 1px solid var(--ungani-border);
      border-left: 6px solid var(--ungani-gold);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 24px var(--ungani-shadow);
    }

    .metric-card h3 {
      margin: 0 0 8px;
      color: var(--ungani-muted);
      font-size: 14px;
    }

    .metric-card p {
      margin: 0;
      font-size: 28px;
      font-weight: bold;
      color: var(--ungani-text);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: bold;
      cursor: pointer;
      background: var(--ungani-gold);
      color: var(--ungani-navy);
      text-decoration: none;
      display: inline-block;
    }

    .section-title-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .section-title-row h2 {
      margin: 0;
    }

    .badge {
      display: inline-block;
      background: var(--ungani-navy);
      color: #FFFFFF;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }

    .badge.green { background: var(--ungani-green); }
    .badge.red { background: var(--ungani-red); }
    .badge.orange { background: var(--ungani-orange); }
    .badge.gray { background: #64748B; }

    .empty {
      text-align: center;
      padding: 28px;
      background: var(--ungani-card);
      border: 1px dashed var(--ungani-border);
      border-radius: 18px;
    }

    .empty h3 {
      margin: 0 0 8px;
      color: var(--ungani-text);
    }

    .empty p {
      margin: 0;
      color: var(--ungani-muted);
    }

    .small-text {
      color: var(--ungani-muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .ungani-table-wrap {
      overflow-x: auto;
    }

    .ungani-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 900px;
    }

    .ungani-table thead th {
      text-align: left;
      padding: 10px 12px;
      color: var(--ungani-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--ungani-border);
      white-space: nowrap;
    }

    .ungani-table td {
      padding: 12px;
      border-bottom: 1px solid var(--ungani-border);
      vertical-align: top;
    }

    .ungani-table .row-time {
      white-space: nowrap;
      color: var(--ungani-muted);
      font-size: 13px;
    }

    .mono {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12px;
    }

    details.raw-payload summary {
      cursor: pointer;
      color: var(--ungani-muted);
      font-size: 12px;
    }

    details.raw-payload pre {
      margin: 6px 0 0;
      padding: 8px;
      background: var(--ungani-bg, rgba(0,0,0,0.04));
      border-radius: 8px;
      max-width: 320px;
      overflow-x: auto;
      font-size: 11px;
    }

    tr.row-resolved {
      opacity: 0.55;
    }

    label.checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: normal;
      color: var(--ungani-text);
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div id="adminRoot"></div>

  <script>
    let supabaseClient = null;
    let currentAdmin = null;
    let currentRows = [];

    const pageMainHtml = `
      <section class="ungani-card ungani-hero-card">
        <div style="position: relative; z-index: 1;">
          <h2>M-Pesa Callbacks</h2>
          <p>
            Every Daraja C2B confirmation is logged before any tenant lookup, so a matching or processing failure never silently loses a real payment. This list shows only the ones that still need a look - unmatched (no active connection for that shortcode) or errored during processing.
          </p>
          <div style="margin-top: 16px;">
            <a class="ungani-btn gold" href="admin-home.html">Admin Home</a>
            <a class="ungani-btn" href="admin-error-log.html">Error Log</a>
          </div>
        </div>
      </section>

      <section class="page-grid" id="summaryTiles">
        <div class="metric-card"><h3>Shown</h3><p id="metricShown">0</p></div>
        <div class="metric-card"><h3>Unmatched</h3><p id="metricUnmatched">0</p></div>
        <div class="metric-card"><h3>Error</h3><p id="metricError">0</p></div>
      </section>

      <section class="ungani-card">
        <div class="section-title-row">
          <h2>Unmatched / Error Callbacks</h2>
          <div class="button-row" style="margin-top: 0;">
            <label class="checkbox-row"><input type="checkbox" id="includeResolvedToggle" onchange="loadCallbacks()" /> Include resolved</label>
            <button class="ungani-btn green" onclick="loadCallbacks()">Refresh</button>
          </div>
        </div>

        <div class="ungani-table-wrap">
          <table class="ungani-table">
            <thead>
              <tr>
                <th>Received</th>
                <th>Status</th>
                <th>Shortcode</th>
                <th>TransID</th>
                <th>Reason</th>
                <th>Tenant</th>
                <th>Raw</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="logsListBox">
              <tr><td colspan="8"><div class="empty"><h3>Loading...</h3><p>Please wait.</p></div></td></tr>
            </tbody>
          </table>
        </div>
      </section>
    `;

    window.addEventListener("load", function () {
      UnganiAdminShared.renderShell("adminRoot", {
        activeKey: "mpesaCallbacks",
        pageTitle: "M-Pesa Callbacks",
        pageSubtitle: "Unmatched or errored Daraja C2B confirmations awaiting review.",
        footerTitle: "M-Pesa Callbacks",
        footerVersion: "M-Pesa Callbacks Version: v1",
        mainHtml: pageMainHtml
      });

      UnganiAdminShared.requireAdmin({
        onNoSession: function () {
          document.getElementById("unganiLoadingShell").classList.add("hidden");
          document.getElementById("unganiLoginShell").classList.remove("hidden");
        },
        onBlocked: function (reason) {
          document.getElementById("unganiLoadingShell").classList.add("hidden");
          document.getElementById("unganiBlockedShell").classList.remove("hidden");
          document.getElementById("unganiBlockedReason").innerText = reason;
        },
        onReady: async function (admin, client) {
          currentAdmin = admin;
          supabaseClient = client;

          UnganiAdminShared.renderSidebar("adminSidebar", {
            activeKey: "mpesaCallbacks",
            adminName: admin.full_name || "Admin Workspace",
            footerTitle: "M-Pesa Callbacks",
            footerVersion: "M-Pesa Callbacks Version: v1"
          });

          document.getElementById("unganiLoadingShell").classList.add("hidden");
          document.getElementById("unganiAppShell").classList.remove("hidden");

          await loadCallbacks();
        }
      });
    });

    function safe(value) {
      return UnganiAdminShared.safe(value);
    }

    function formatDateTime(value) {
      if (!value) return "N/A";
      const dateObj = new Date(value);
      if (isNaN(dateObj.getTime())) return "N/A";
      return dateObj.toLocaleString("en-KE", {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function statusBadge(status) {
      const clean = String(status || "").toLowerCase();
      if (clean === "error") return `<span class="badge red">Error</span>`;
      if (clean === "unmatched") return `<span class="badge orange">Unmatched</span>`;
      return `<span class="badge gray">${safe(clean || "Unknown")}</span>`;
    }

    async function loadCallbacks() {
      const includeResolved = document.getElementById("includeResolvedToggle").checked;
      const box = document.getElementById("logsListBox");
      box.innerHTML = `<tr><td colspan="8"><div class="empty"><h3>Loading...</h3><p>Please wait.</p></div></td></tr>`;

      const { data, error } = await supabaseClient.rpc("admin_list_ungani_mpesa_unmatched_callbacks", {
        p_include_resolved: includeResolved
      });

      if (error) {
        box.innerHTML = `<tr><td colspan="8"><div class="empty"><h3>Could not load callbacks</h3><p>${safe(error.message)}</p></div></td></tr>`;
        return;
      }

      currentRows = data || [];
      renderLogs();
    }

    async function markResolved(id, button) {
      button.disabled = true;
      button.textContent = "Saving...";

      const { error } = await supabaseClient.rpc("admin_mark_ungani_mpesa_callback_resolved", { p_id: id });

      if (error) {
        UnganiAdminShared.showToast("Could not mark resolved: " + error.message);
        button.disabled = false;
        button.textContent = "Mark Resolved";
        return;
      }

      const row = currentRows.find(r => r.id === id);
      if (row) {
        row.resolved = true;
        row.resolved_at = new Date().toISOString();
      }

      renderLogs();
    }

    function renderLogs() {
      const box = document.getElementById("logsListBox");

      if (!currentRows.length) {
        box.innerHTML = `<tr><td colspan="8"><div class="empty"><h3>Nothing to review</h3><p>No unmatched or errored M-Pesa callbacks right now.</p></div></td></tr>`;
      } else {
        box.innerHTML = currentRows.map(function (row) {
          return `
            <tr class="${row.resolved ? "row-resolved" : ""}">
              <td class="row-time">${safe(formatDateTime(row.received_at))}</td>
              <td>${statusBadge(row.status)}</td>
              <td class="mono">${safe(row.shortcode || "-")}</td>
              <td class="mono">${safe(row.trans_id || "-")}</td>
              <td>${safe(row.error_reason || "-")}</td>
              <td class="mono">${safe(row.tenant_id ? String(row.tenant_id).slice(0, 8) : "-")}</td>
              <td>
                <details class="raw-payload">
                  <summary>View</summary>
                  <pre>${safe(JSON.stringify(row.raw_payload, null, 2))}</pre>
                </details>
              </td>
              <td>
                ${row.resolved
                  ? `<span class="badge green">Resolved</span>`
                  : `<button class="ungani-btn small" onclick="markResolved('${row.id}', this)">Mark Resolved</button>`}
              </td>
            </tr>
          `;
        }).join("");
      }

      document.getElementById("metricShown").innerText = String(currentRows.length);
      document.getElementById("metricUnmatched").innerText = String(currentRows.filter(r => r.status === "unmatched").length);
      document.getElementById("metricError").innerText = String(currentRows.filter(r => r.status === "error").length);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>UNGANI OS - Calendar</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="pwa-register.js"></script>
  <script src="ungani-theme.js"></script>
  <script src="client-shared.js" onerror="window.__unganiClientSharedFailed = true;"></script>
  <script src="team-chat-shared.js"></script>
  <script src="ungani-nav-config.js"></script>
  <script>
    (function () {
      function showUnganiLoadError() {
        if (typeof UnganiClientShared !== "undefined") return;

        var banner = document.createElement("div");
        banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#B91C1C;color:#fff;padding:12px 16px;font:14px/1.4 -apple-system,sans-serif;text-align:center;";
        banner.innerHTML = "Some page resources failed to load. Please check your connection. " +
          "<button style=\"margin-left:10px;padding:4px 12px;border:none;border-radius:6px;background:#fff;color:#B91C1C;font-weight:700;cursor:pointer;\" onclick=\"window.location.reload()\">Reload</button>";

        if (document.body) {
          document.body.prepend(banner);
        } else {
          document.addEventListener("DOMContentLoaded", function () {
            document.body.prepend(banner);
          });
        }
      }

      if (window.__unganiClientSharedFailed) {
        showUnganiLoadError();
      } else {
        setTimeout(function () {
          if (typeof UnganiClientShared === "undefined") showUnganiLoadError();
        }, 4000);
      }
    })();
  </script>
  <script src="ungani-business-config.js"></script>
  <script src="ungani-analytics.js"></script>
  <script src="ungani-presets.js"></script>
  <script src="nia-assistant.js"></script>
</head>

<body>
  <script>
    let currentContext = null;
    let businessPreset = null;
    let eventRows = [];
    let editingEventId = null;
    let highlightApplied = false;
    let sectionOptions = [];
    let currentSectionFilter = "";
    let isLogistics = false;
    let tripVehicleOptions = [];
    let tripDriverOptions = [];
    let tripClientOptions = [];
    let tripManagerOptions = [];
    let isBookingBusinessType = false;
    let isSecurity = false;
    let isCleaning = false;
    let isTourismDeployment = false;
    let deployedPersonOptions = [];
    let deployedSiteOptions = [];
    let tourGuideOptions = [];
    let tourVehicleOptions = [];
    let isSalon = false;
    let isHealthcare = false;
    let isGym = false;
    let appointmentStaffOptions = [];
    let eventCustomerOptions = [];

    window.addEventListener("load", function () {
      UnganiClientShared.initPage({
        pageKey: "calendar",
        pageTitle: "Calendar",
        pageSubtitle: "Manage appointments, deadlines, meetings, follow-ups, and business activities.",
        onReady: startCalendarPage
      });
    });

    async function startCalendarPage(context) {
      currentContext = context;

      if (window.UnganiAnalytics) {
        UnganiAnalytics.injectChartStyles();
      }

      businessPreset = UnganiPresets.getPreset(context.tenant);
      sectionOptions = businessPreset.selectedSectionLabels || [];
      currentSectionFilter = new URLSearchParams(window.location.search).get("section") || "";
      isLogistics = detectLogistics(context.tenant);
      isBookingBusinessType = detectTourism(context.tenant) || detectEvents(context.tenant) || detectPhotography(context.tenant) || detectHospitality(context.tenant);
      isSecurity = detectSecurity(context.tenant);
      isCleaning = detectCleaning(context.tenant);
      isTourismDeployment = detectTourism(context.tenant);
      isSalon = detectSalon(context.tenant);
      isHealthcare = detectHealthcare(context.tenant);
      isGym = detectGym(context.tenant);

      if (isLogistics && logisticsTripFieldsAllowed()) {
        await loadLogisticsTripOptions();
      }

      if (isSecurity || isCleaning) {
        await loadDeploymentOptions();
      }

      if (isTourismDeployment) {
        await loadTourGuideVehicleOptions();
      }

      if (isSalon || isHealthcare || isGym) {
        await loadAppointmentStaffOptions();
      }

      // Phase 4 (Business Events 360): customer_person_id, shared by
      // Booking/Deployment/Appointment - Trip already has its own
      // client_person_id via loadLogisticsTripOptions() above, untouched.
      if (isBookingBusinessType || isSecurity || isCleaning || isSalon || isHealthcare || isGym) {
        await loadEventCustomerOptions();
      }

      const titleEl = document.querySelector(".ungani-topbar h2");
      const subEl = document.querySelector(".ungani-topbar p");

      if (titleEl) {
        titleEl.innerText = businessPreset.calendarLabel;
      }

      if (subEl) {
        subEl.innerText = "Appointments, deadlines, meetings, reminders, and activities for " + businessPreset.name + ".";
      }

      await loadEventRows();
    }

    // Same detectLogistics logic as client.html/my-items.html/my-money.html's
    // copies - each page keeps its own local copy, established pattern in
    // this codebase since many pages don't load client-shared.js's helpers
    // for this.
    function detectLogistics(tenant) {
      if (window.UnganiBusinessConfig && typeof UnganiBusinessConfig.resolve === "function") {
        const matched = UnganiBusinessConfig.resolve(tenant);
        if (matched) return matched.key === "logistics";
      }

      const businessType = String(UnganiClientShared.getValue(tenant, ["business_type", "business_type_key"], "")).toLowerCase();
      const businessTypeKey = String(UnganiClientShared.getValue(tenant, ["business_type_key"], "")).toLowerCase();

      return businessType.includes("logistics") || businessType.includes("transport") || businessType.includes("fleet") || businessTypeKey.includes("logistics");
    }

    // Same local-copy pattern as detectLogistics above. Booking/deposit
    // fields (Total Amount, Deposit Required, Deposit Due Date) apply to
    // these 4 business types - Tourism, Events (incl. Catering), Photography,
    // Hospitality - matching computeBookingSettlement() in client.html.
    function detectTourism(tenant) {
      if (window.UnganiBusinessConfig && typeof UnganiBusinessConfig.resolve === "function") {
        const matched = UnganiBusinessConfig.resolve(tenant);
        if (matched) return matched.key === "tourism";
      }

      const businessType = String(UnganiClientShared.getValue(tenant, ["business_type", "business_type_key"], "")).toLowerCase();
      const businessTypeKey = String(UnganiClientShared.getValue(tenant, ["business_type_key"], "")).toLowerCase();

      return businessType.includes("tourism") || businessType.includes("travel") || businessType.includes("tour ") || businessType.includes("safari") || businessType.includes("excursion") || businessTypeKey.includes("tourism");
    }

    function detectEvents(tenant) {
      if (window.UnganiBusinessConfig && typeof UnganiBusinessConfig.resolve === "function") {
        const matched = UnganiBusinessConfig.resolve(tenant);
        if (matched) return matched.key === "events";
      }

      const businessType = String(UnganiClientShared.getValue(tenant, ["business_type", "business_type_key"], "")).toLowerCase();
      const businessTypeKey = String(UnganiClientShared.getValue(tenant, ["business_type_key"], "")).toLowerCase();

      return businessType.includes("events") || businessType.includes("catering") || businessType.includes("caterer") || businessTypeKey.includes("events");
    }

    function detectPhotography(tenant) {
      if (window.UnganiBusinessConfig && typeof UnganiBusinessConfig.resolve === "function") {
        const matched = UnganiBusinessConfig.resolve(tenant);
        if (matched) return matched.key === "photography";
      }

      const businessType = String(UnganiClientShared.getValue(tenant, ["business_type", "business_type_key"], "")).toLowerCase();
      const businessTypeKey = String(UnganiClientShared.getValue(tenant, ["business_type_key"], "")).toLowerCase();

      return businessType.includes("photography") || businessType.includes("videography") || businessTypeKey.includes("photography");
    }

    function detectHospitality(tenant) {
      if (window.UnganiBusinessConfig && typeof UnganiBusinessConfig.resolve === "function") {
        const matched = UnganiBusinessConfig.resolve(tenant);
        if (matched) return matched.key === "hospitality";
      }

      const businessType = String(UnganiClientShared.getValue(tenant, ["business_type", "business_type_key"], "")).toLowerCase();
      const businessTypeKey = String(UnganiClientShared.getValue(tenant, ["business_type_key"], "")).toLowerCase();

      return businessType.includes("hospitality") || businessType.includes("hotel") || businessTypeKey.includes("hospitality");
    }

    // Cluster 3 (Deployment/roster scheduling) detectors - same local-copy
    // pattern as the others above. Security/Cleaning get their own
    // Guard/Cleaner + Site + Rate fields; Tourism reuses the SAME
    // vehicle_item_id/driver_person_id/route/rate columns Logistics' Trip
    // fields already use (a guide fills the driver slot) via its own
    // separate gated block below, rather than sharing the isLogistics gate -
    // keeps the already-shipped, working Trip block untouched.
    function detectSecurity(tenant) {
      if (window.UnganiBusinessConfig && typeof UnganiBusinessConfig.resolve === "function") {
        const matched = UnganiBusinessConfig.resolve(tenant);
        if (matched) return matched.key === "security";
      }

      const businessType = String(UnganiClientShared.getValue(tenant, ["business_type", "business_type_key"], "")).toLowerCase();
      const businessTypeKey = String(UnganiClientShared.getValue(tenant, ["business_type_key"], "")).toLowerCase();

      return businessType.includes("security") || businessType.includes("guarding") || businessType.includes("guards") || businessTypeKey.includes("security");
    }

    function detectCleaning(tenant) {
      if (window.UnganiBusinessConfig && typeof UnganiBusinessConfig.resolve === "function") {
        const matched = UnganiBusinessConfig.resolve(tenant);
        if (matched) return matched.key === "cleaning";
      }

      const businessType = String(UnganiClientShared.getValue(tenant, ["business_type", "business_type_key"], "")).toLowerCase();
      const businessTypeKey = String(UnganiClientShared.getValue(tenant, ["business_type_key"], "")).toLowerCase();

      return businessType.includes("cleaning") || businessType.includes("facilities management") || businessType.includes("facility management") || businessType.includes("janitorial") || businessTypeKey.includes("cleaning");
    }

    // Trip depth (vehicle/driver/client/route/rate) only fits Transport and
    // Cold Chain - a Clearing & Forwarding container's operational unit is
    // a customs-clearance case, not a vehicle trip (see
    // LOGISTICS_CLEARING_FIELD_SET's client_name/clearance_fee fields
    // instead). A tenant with no sub-sector chosen yet defaults to showing
    // the fields (most single-section Logistics tenants are Transport).
    function logisticsTripFieldsAllowed() {
      if (!sectionOptions || sectionOptions.length === 0) return true;
      return sectionOptions.indexOf("Transport") !== -1 || sectionOptions.indexOf("Cold Chain") !== -1;
    }

    async function loadLogisticsTripOptions() {
      const [vehiclesRes, driversRes, clientsRes] = await Promise.all([
        currentContext.supabaseClient
          .from("business_items")
          .select("id, item_name, name, item_type, type")
          .eq("tenant_id", currentContext.tenantId),
        currentContext.supabaseClient
          .from("client_people")
          .select("id, full_name, person_type")
          .eq("tenant_id", currentContext.tenantId)
          .ilike("person_type", "driver"),
        currentContext.supabaseClient
          .from("client_people")
          .select("id, full_name, person_type")
          .eq("tenant_id", currentContext.tenantId)
      ]);

      const vehicleTypes = ["truck", "vehicle", "genset", "reefer"];
      tripVehicleOptions = ((vehiclesRes && vehiclesRes.data) || []).filter(function (item) {
        const type = String(UnganiClientShared.getValue(item, ["item_type", "type"], "")).toLowerCase();
        return vehicleTypes.indexOf(type) !== -1;
      });

      tripDriverOptions = (driversRes && driversRes.data) || [];

      const allPeople = (clientsRes && clientsRes.data) || [];

      tripClientOptions = allPeople.filter(function (person) {
        const type = String(UnganiClientShared.getValue(person, ["person_type"], "")).toLowerCase();
        return type === "client" || type === "customer";
      });

      tripManagerOptions = allPeople.filter(function (person) {
        return String(UnganiClientShared.getValue(person, ["person_type"], "")).toLowerCase() === "transport manager";
      });
    }

    // Cluster 3 (Deployment/roster scheduling) - Security/Cleaning only.
    // Guard/Cleaner assignment + Site assignment for a Shift/Cleaning
    // Schedule activity, same shape as Trip's vehicle/driver options above.
    async function loadDeploymentOptions() {
      try {
        const personType = isSecurity ? "guard" : "cleaner";

        const [peopleRes, sitesRes] = await Promise.all([
          currentContext.supabaseClient
            .from("client_people")
            .select("id, full_name, person_type")
            .eq("tenant_id", currentContext.tenantId)
            .ilike("person_type", personType),
          currentContext.supabaseClient
            .from("business_items")
            .select("id, item_name, name, item_type, type")
            .eq("tenant_id", currentContext.tenantId)
        ]);

        deployedPersonOptions = (peopleRes && peopleRes.data) || [];
        deployedSiteOptions = ((sitesRes && sitesRes.data) || []).filter(function (item) {
          return String(UnganiClientShared.getValue(item, ["item_type", "type"], "")).trim().toLowerCase() === "site";
        });
      } catch (error) {
        console.warn("Deployment options skipped:", error.message);
        deployedPersonOptions = [];
        deployedSiteOptions = [];
      }
    }

    // Tourism's roster side - reuses the SAME vehicle_item_id/driver_person_id/
    // route/rate columns Logistics' Trip fields already use (a guide fills
    // the driver slot), via its own gated form block so the working
    // isLogistics Trip block stays untouched.
    async function loadTourGuideVehicleOptions() {
      try {
        const [guidesRes, vehiclesRes] = await Promise.all([
          currentContext.supabaseClient
            .from("client_people")
            .select("id, full_name, person_type")
            .eq("tenant_id", currentContext.tenantId)
            .ilike("person_type", "guide"),
          currentContext.supabaseClient
            .from("business_items")
            .select("id, item_name, name, item_type, type")
            .eq("tenant_id", currentContext.tenantId)
        ]);

        tourGuideOptions = (guidesRes && guidesRes.data) || [];
        tourVehicleOptions = ((vehiclesRes && vehiclesRes.data) || []).filter(function (item) {
          return String(UnganiClientShared.getValue(item, ["item_type", "type"], "")).trim().toLowerCase() === "vehicle";
        });
      } catch (error) {
        console.warn("Tour guide/vehicle options skipped:", error.message);
        tourGuideOptions = [];
        tourVehicleOptions = [];
      }
    }

    // Cluster 5 (Appointment scheduling) detectors - same local-copy pattern
    // as above.
    function detectSalon(tenant) {
      if (window.UnganiBusinessConfig && typeof UnganiBusinessConfig.resolve === "function") {
        const matched = UnganiBusinessConfig.resolve(tenant);
        if (matched) return matched.key === "salon";
      }

      const businessType = String(UnganiClientShared.getValue(tenant, ["business_type", "business_type_key"], "")).toLowerCase();
      const businessTypeKey = String(UnganiClientShared.getValue(tenant, ["business_type_key"], "")).toLowerCase();

      return businessType.includes("salon") || businessType.includes("barber") || businessType.includes("spa") || businessType.includes("beauty") || businessTypeKey.includes("salon");
    }

    function detectHealthcare(tenant) {
      if (window.UnganiBusinessConfig && typeof UnganiBusinessConfig.resolve === "function") {
        const matched = UnganiBusinessConfig.resolve(tenant);
        if (matched) return matched.key === "healthcare";
      }

      const businessType = String(UnganiClientShared.getValue(tenant, ["business_type", "business_type_key"], "")).toLowerCase();
      const businessTypeKey = String(UnganiClientShared.getValue(tenant, ["business_type_key"], "")).toLowerCase();

      return businessType.includes("clinic") || businessType.includes("health") || businessType.includes("medical") || businessType.includes("hospital") || businessTypeKey.includes("healthcare");
    }

    function detectGym(tenant) {
      if (window.UnganiBusinessConfig && typeof UnganiBusinessConfig.resolve === "function") {
        const matched = UnganiBusinessConfig.resolve(tenant);
        if (matched) return matched.key === "gym";
      }

      const businessType = String(UnganiClientShared.getValue(tenant, ["business_type", "business_type_key"], "")).toLowerCase();
      const businessTypeKey = String(UnganiClientShared.getValue(tenant, ["business_type_key"], "")).toLowerCase();

      return businessType.includes("gym") || businessType.includes("fitness") || businessType.includes("wellness") || businessTypeKey.includes("gym");
    }

    // Staff options for the appointment/class staff-assignment picker.
    // Unlike Deployment's single fixed person_type (guard/cleaner), each of
    // these 3 business types has MULTIPLE valid staff person_types (matches
    // ungani-business-config.js's peoplePrimaryTypes for each), so this
    // queries with .in() against the full list rather than a single .ilike().
    async function loadAppointmentStaffOptions() {
      try {
        const personTypes = isSalon ? ["staff", "stylist", "barber", "therapist"]
          : isHealthcare ? ["staff", "doctor", "nurse", "dentist", "surgeon", "lab technician"]
          : ["trainer", "staff"];

        const response = await currentContext.supabaseClient
          .from("client_people")
          .select("id, full_name, person_type")
          .eq("tenant_id", currentContext.tenantId)
          .in("person_type", personTypes);

        appointmentStaffOptions = (response && response.data) || [];
      } catch (error) {
        console.warn("Appointment staff options skipped:", error.message);
        appointmentStaffOptions = [];
      }
    }

    // Phase 4 (Business Events 360): "customer" isn't a single canonical
    // person_type the way staff roles are (Tourism/Events/Photography/
    // Hospitality/Security/Cleaning/Salon/Healthcare/Gym each use different
    // tags - client, customer, guest, patient, member...), so this
    // deliberately loads ALL active people for the tenant rather than
    // filtering by person_type like the staff-side loaders above do.
    async function loadEventCustomerOptions() {
      try {
        const response = await currentContext.supabaseClient
          .from("client_people")
          .select("id, full_name, person_type")
          .eq("tenant_id", currentContext.tenantId)
          .is("deleted_at", null)
          .order("full_name", { ascending: true });

        eventCustomerOptions = (response && response.data) || [];
      } catch (error) {
        console.warn("Event customer options skipped:", error.message);
        eventCustomerOptions = [];
      }
    }

    // No-double-booking check for Cluster 5 - the first cluster in this
    // codebase to add real scheduling-conflict detection. Optimistic/
    // client-side only (queries then blocks the save if a conflict is
    // found) - not a DB-level exclusion constraint, so a true race under
    // concurrent simultaneous saves for the same staff member remains
    // possible, same honest-gap category as the earlier branch-creation
    // race-condition finding. Only runs when a staff member AND both start/
    // end times are set - can't determine overlap otherwise.
    async function checkAppointmentConflict(staffPersonId, eventDate, startTime, endTime, excludeEventId) {
      if (!staffPersonId || !eventDate || !startTime || !endTime) return null;

      try {
        let query = currentContext.supabaseClient
          .from("business_events")
          .select("id, event_title, start_time, end_time, status")
          .eq("tenant_id", currentContext.tenantId)
          .eq("staff_person_id", staffPersonId)
          .eq("event_date", eventDate)
          .not("status", "ilike", "%cancelled%");

        if (excludeEventId) {
          query = query.neq("id", excludeEventId);
        }

        const response = await query;
        const rows = (response && response.data) || [];

        const conflict = rows.find(function (row) {
          if (!row.start_time || !row.end_time) return false;
          return startTime < row.end_time && row.start_time < endTime;
        });

        if (!conflict) return null;

        return "That staff member already has \"" + (conflict.event_title || "an appointment") + "\" from " + conflict.start_time + " to " + conflict.end_time + " on this date.";
      } catch (error) {
        console.warn("Appointment conflict check skipped:", error.message);
        return null;
      }
    }

    async function loadEventRows() {
      currentContext.contentEl.innerHTML = UnganiClientShared.loadingCard("Loading calendar activities...");

      let response;

      try {
        response = await currentContext.supabaseClient
          .from("business_events")
          .select("*")
          .eq("tenant_id", currentContext.tenantId)
          .order("event_date", { ascending: true })
          .order("created_at", { ascending: false });
      } catch (error) {
        UnganiClientShared.setContent(
          UnganiClientShared.errorCard("Could not load calendar activities", error.message || "Network error. Please check your connection.")
        );
        return;
      }

      if (response.error) {
        UnganiClientShared.setContent(
          UnganiClientShared.errorCard("Could not load calendar activities", response.error.message)
        );
        return;
      }

      eventRows = response.data || [];
      renderCalendarPage();
    }

    function renderCalendarPage() {
      const filteredRows = getFilteredRows();
      const summary = calculateCalendarSummary(filteredRows);
      const typeRows = buildTypeRows(filteredRows);
      const statusRows = buildStatusRows(filteredRows);
      const priorityRows = buildPriorityRows(filteredRows);

      UnganiClientShared.setContent(`
        <style>
          .calendar-hero-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
            gap: 18px;
            align-items: stretch;
          }

          .calendar-preset-box {
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(255,255,255,0.09);
            border-radius: 24px;
            padding: 18px;
          }

          .calendar-preset-box h3 {
            color: white;
            margin: 0 0 8px;
          }

          .calendar-preset-box p {
            color: rgba(255,255,255,0.74);
            margin: 0;
            line-height: 1.55;
          }

          .calendar-chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;

          .calendar-chip {

            border-radius: 999px;

             that floating cluster was sitting squarely on top of card
             text/badges/buttons while scrolling instead of just grazing a
             sliver of one row - real, reported overlap bug.

             The original fix here used padding-right:94px, which does
             correctly keep TEXT/buttons clear (confirmed - the Delete
             button never actually sits under a FAB) - but padding only
             moves inner content, not the card's own box. The white

    function applyHighlightFromUrl() {
      if (highlightApplied) return;

      const highlightId = new URLSearchParams(window.location.search).get("highlight");
      if (!highlightId) return;

      setTimeout(function () {
        const el = document.getElementById("event-" + highlightId);

        if (!el) return;

        highlightApplied = true;
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        el.classList.add("ungani-highlighted");

        setTimeout(function () {
          el.classList.remove("ungani-highlighted");
        }, 3000);
      }, 250);
    }

    async function renderCalendarCharts(typeRows, statusRows, priorityRows) {
      try {
        if (hasValues(typeRows)) {
          await UnganiAnalytics.renderHorizontalBarChart("calendarTypeChart", typeRows, "Activities");
        }

        if (hasValues(statusRows)) {
          await UnganiAnalytics.renderDoughnutStatusChart("calendarStatusChart", statusRows);
        }
      } catch (error) {
        console.warn("Calendar charts warning:", error.message);
      }
    }

      if (!rows || rows.length === 0) {
        return `
          <div class="ungani-empty">
            <h3>No calendar activities yet</h3>
            <p>Add your first appointment, delivery, viewing, meeting, reminder, or follow-up.</p>
          </div>
        `;
      }

      const todayStr = new Date().toISOString().slice(0, 10);

      return `
        <div class="calendar-list">
          ${rows.map(function (row) {
            const title = getEventTitle(row);
            const type = UnganiClientShared.getValue(row, ["event_type", "type"], "Calendar Activity");
            const status = UnganiClientShared.getValue(row, ["status"], "scheduled");
            const priority = UnganiClientShared.getValue(row, ["priority"], "normal");
            const date = UnganiClientShared.getValue(row, ["event_date", "date", "start_date", "created_at"], "");
            const startTime = UnganiClientShared.getValue(row, ["start_time"], "");
            const endTime = UnganiClientShared.getValue(row, ["end_time"], "");
            const location = UnganiClientShared.getValue(row, ["location"], "");
            const relatedPerson = UnganiClientShared.getValue(row, ["related_person"], "");
            const relatedItem = UnganiClientShared.getValue(row, ["related_item"], "");
            const notes = UnganiClientShared.getValue(row, ["notes", "description"], "");

    function eventDateBox(dateValue) {

    function calculateCalendarSummary(rows) {
      const today = new Date().toISOString().slice(0, 10);
      let upcoming = 0;
      let todayCount = 0;
      let completed = 0;
      let overdue = 0;
      let noShow = 0;

      rows.forEach(function (row) {
        const status = String(UnganiClientShared.getValue(row, ["status"], "scheduled")).toLowerCase();
        const date = String(UnganiClientShared.getValue(row, ["event_date", "date", "start_date"], "")).slice(0, 10);

        if (status.includes("completed")) {
          completed++;
          return;
        }

        if (status.includes("no show")) {
          noShow++;
          return;
        }

        if (date === today) {
          todayCount++;
        } else if (date && date > today) {
          upcoming++;
        } else if (date && date < today && !status.includes("cancelled")) {
          overdue++;
        }
      });

      return {
        upcoming,
        today: todayCount,
        completed,
        overdue,
        noShow
      };
    }

    function buildTypeRows(rows) {
      const map = {};

      rows.forEach(function (row) {
        const type = UnganiClientShared.getValue(row, ["event_type", "type"], "Calendar Activity");

      });

      return UnganiAnalytics.mapToRows(map);

    function buildStatusRows(rows) {

      rows.forEach(function (row) {
        const status = getSmartStatus(row);
        map[status] = (map[status] || 0) + 1;
      });

      return UnganiAnalytics.mapToRows(map);
    }

    function buildPriorityRows(rows) {
      const map = {};

      rows.forEach(function (row) {
        const priority = UnganiClientShared.getValue(row, ["priority"], "normal");
        map[priority] = (map[priority] || 0) + 1;

    function getSmartStatus(row) {
      const status = String(UnganiClientShared.getValue(row, ["status"], "scheduled")).toLowerCase();
      const date = String(UnganiClientShared.getValue(row, ["event_date", "date", "start_date"], "")).slice(0, 10);
      const today = new Date().toISOString().slice(0, 10);

      if (date && date < today && !status.includes("completed") && !status.includes("cancelled")) {
        return "Overdue";
      }

      return UnganiAnalytics.toTitle(status || "Scheduled");
    }

    function getFilteredRows() {
      const filterType = getStoredOrInput("filterType", "ungani_calendar_filter_type").toLowerCase();
      const filterStatus = getStoredOrInput("filterStatus", "ungani_calendar_filter_status").toLowerCase();
      const search = getStoredOrInput("filterSearch", "ungani_calendar_filter_search").toLowerCase();

      return eventRows.filter(function (row) {
        const type = String(UnganiClientShared.getValue(row, ["event_type", "type"], "calendar activity")).toLowerCase();
        const status = String(UnganiClientShared.getValue(row, ["status"], "scheduled")).toLowerCase();
        const haystack = JSON.stringify(row || {}).toLowerCase();

        if (currentSectionFilter && UnganiClientShared.getValue(row, ["section_label"], "") !== currentSectionFilter) return false;
        if (filterType && !type.includes(filterType)) return false;
        if (filterStatus && !status.includes(filterStatus)) return false;
        if (search && !haystack.includes(search)) return false;

        return true;
      });
    }

    async function saveEvent(event) {
      event.preventDefault();

      if (!title) {
        UnganiClientShared.showToast("Enter an activity title.");

        event_date: eventDate,
        start_time: UnganiClientShared.value("eventStartTime") || null,

      };

      if (isLogistics && logisticsTripFieldsAllowed() && document.getElementById("eventTripVehicle")) {
        payload.vehicle_item_id = UnganiClientShared.value("eventTripVehicle") || null;
        payload.driver_person_id = UnganiClientShared.value("eventTripDriver") || null;
        payload.manager_person_id = UnganiClientShared.value("eventTripManager") || null;
        payload.client_person_id = UnganiClientShared.value("eventTripClient") || null;
        payload.trip_type = UnganiClientShared.value("eventTripType") || null;
        payload.route = UnganiClientShared.value("eventTripRoute") || null;
        payload.rate = UnganiClientShared.value("eventTripRate") ? Number(UnganiClientShared.value("eventTripRate")) : null;
        payload.rate_currency = UnganiClientShared.value("eventTripRateCurrency") || "KES";
        payload.trip_issue = UnganiClientShared.value("eventTripIssue") || null;
        payload.trip_issue_notes = UnganiClientShared.value("eventTripIssue") ? (UnganiClientShared.value("eventTripIssueNotes") || null) : null;
      }

      if (isBookingBusinessType && document.getElementById("eventBookingTotalAmount")) {
        payload.booking_total_amount = UnganiClientShared.value("eventBookingTotalAmount") ? Number(UnganiClientShared.value("eventBookingTotalAmount")) : null;
        payload.booking_deposit_required = UnganiClientShared.value("eventBookingDepositRequired") ? Number(UnganiClientShared.value("eventBookingDepositRequired")) : null;
        payload.booking_deposit_due_date = UnganiClientShared.value("eventBookingDepositDueDate") || null;
      }

      if ((isSecurity || isCleaning) && document.getElementById("eventDeployedPerson")) {
        payload.deployed_person_id = UnganiClientShared.value("eventDeployedPerson") || null;
        payload.deployed_site_item_id = UnganiClientShared.value("eventDeployedSite") || null;
        payload.deployment_rate = UnganiClientShared.value("eventDeploymentRate") ? Number(UnganiClientShared.value("eventDeploymentRate")) : null;
      }

      // Phase 4 (Business Events 360) - one shared field/column across
      // Booking/Deployment/Appointment, mirroring Trip's own
      // client_person_id (set separately above, untouched).
      if ((isBookingBusinessType || isSecurity || isCleaning || isSalon || isHealthcare || isGym) && document.getElementById("eventCustomerPerson")) {
        payload.customer_person_id = UnganiClientShared.value("eventCustomerPerson") || null;
      }

      if (isTourismDeployment && document.getElementById("eventTourGuide")) {
        payload.driver_person_id = UnganiClientShared.value("eventTourGuide") || null;
        payload.vehicle_item_id = UnganiClientShared.value("eventTourVehicle") || null;
        payload.route = UnganiClientShared.value("eventTourRoute") || null;
        payload.rate = UnganiClientShared.value("eventTourRate") ? Number(UnganiClientShared.value("eventTourRate")) : null;
      }

      if ((isSalon || isHealthcare || isGym) && document.getElementById("eventAppointmentStaff")) {
        payload.staff_person_id = UnganiClientShared.value("eventAppointmentStaff") || null;
        payload.appointment_amount = UnganiClientShared.value("eventAppointmentAmount") ? Number(UnganiClientShared.value("eventAppointmentAmount")) : null;

        if (payload.staff_person_id) {
          const conflictMessage = await checkAppointmentConflict(payload.staff_person_id, payload.event_date, payload.start_time, payload.end_time, editingEventId);
          if (conflictMessage) {
            UnganiClientShared.showToast(conflictMessage);
            return;
          }
        }
      }

      let response;

      try {
        if (editingEventId) {
          response = await currentContext.supabaseClient
            .from("business_events")
            .update(payload)
            .eq("id", editingEventId)
            .eq("tenant_id", currentContext.tenantId);
        } else {
          response = await currentContext.supabaseClient
            .from("business_events")
            .insert([payload]);
        }
      } catch (error) {
        UnganiClientShared.showToast("Could not save activity: " + (error.message || "Network error. Please check your connection."));
        return;
      }

      if (response.error) {
        UnganiClientShared.showToast("Could not save activity: " + response.error.message);
        return;
      }

      UnganiClientShared.showToast(editingEventId ? "Calendar activity updated ✓" : "Calendar activity added ✓");
      clearEventForm();
      await loadEventRows();
    }

    // Phase 4c (Business Events 360): the first detail/profile view any
    // calendar activity has ever had in this codebase - previously the
    // only way to see an activity's own info was the inline edit form.
    // Deliberately lightweight rather than duplicating client.html's 4
    // settlement calculators (computeTripSettlement etc.) here: shows the
    // event's own type-specific fields directly off the row, its customer
    // (client_person_id for Trip, customer_person_id for Booking/
    // Deployment/Appointment - whichever is set) with a click-through to
    // that person's own 360 profile, and any Money records linked via the
    // existing transactions.related_event_id column.
    async function openEventProfile(id) {
      const row = eventRows.find(function (item) { return String(item.id) === String(id); });

      if (!row) {
        UnganiClientShared.showToast("Activity not found.");
        return;
      }

      UnganiClientShared.openSidePanel({
        title: getEventTitle(row),
        bodyHtml: UnganiClientShared.loadingCard("Loading activity...")
      });

      const customerId = row.customer_person_id || row.client_person_id || null;

      let customer = null;
      let payments = [];

      try {
        const [customerRes, paymentsRes] = await Promise.all([
          customerId
            ? currentContext.supabaseClient.from("client_people").select("id, full_name, is_organization").eq("id", customerId).maybeSingle()
            : Promise.resolve({ data: null }),
          currentContext.supabaseClient
            .from("transactions")
            .select("id, transaction_date, description, category, category_name, transaction_type, amount, amount_kes")
            .eq("tenant_id", currentContext.tenantId)
            .eq("related_event_id", id)
            .is("deleted_at", null)
            .order("transaction_date", { ascending: false })
        ]);

        customer = (customerRes && customerRes.data) || null;
        payments = (paymentsRes && paymentsRes.data) || [];
      } catch (error) {
        document.getElementById("unganiPanelBody").innerHTML = UnganiClientShared.errorCard("Could not load activity", error.message || "Network error.");
        return;
      }

      renderEventProfilePanel(row, customer, payments);
    }

    function capitalizeWords(value) {
      return String(value || "").replace(/_/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    }

    function renderEventProfilePanel(row, customer, payments) {
      const type = UnganiClientShared.getValue(row, ["event_type", "type"], "Calendar Activity");
      const status = UnganiClientShared.getValue(row, ["status"], "scheduled");

      const notes = UnganiClientShared.getValue(row, ["notes", "description"], "");

      if (row.trip_type) detailRows.push({ label: "Trip Type", value: capitalizeWords(row.trip_type) });
      if (row.rate != null) detailRows.push({ label: "Rate", value: UnganiClientShared.formatKES(Number(row.rate)) + (row.rate_currency ? " " + row.rate_currency : "") });
      if (row.trip_issue) detailRows.push({ label: "Issue", value: capitalizeWords(row.trip_issue) + (row.trip_issue_notes ? " - " + row.trip_issue_notes : "") });
      if (row.booking_total_amount != null) detailRows.push({ label: "Total Amount", value: UnganiClientShared.formatKES(Number(row.booking_total_amount)) });
      if (row.booking_deposit_required != null) detailRows.push({ label: "Deposit Required", value: UnganiClientShared.formatKES(Number(row.booking_deposit_required)) });
      if (row.booking_deposit_due_date) detailRows.push({ label: "Deposit Due", value: UnganiClientShared.formatDate(row.booking_deposit_due_date) });
      if (row.deployment_rate != null) detailRows.push({ label: "Deployment Rate", value: UnganiClientShared.formatKES(Number(row.deployment_rate)) });
      if (row.appointment_amount != null) detailRows.push({ label: "Appointment Amount", value: UnganiClientShared.formatKES(Number(row.appointment_amount)) });

      const customerRowHtml = customer ? `
        <div class="detail-row" onclick="openEventCustomerProfile('${UnganiClientShared.attr(customer.id)}')" style="cursor:pointer;">
          <span class="ungani-small">${customer.is_organization ? "Organization" : "Customer"}</span>

          <div class="detail-row">
            <span>${UnganiClientShared.safe(p.description || p.category_name || p.category || p.transaction_type || "Transaction")}</span>
            <span class="ungani-small">${UnganiClientShared.safe(UnganiClientShared.formatDate(p.transaction_date))} · ${UnganiClientShared.safe(UnganiClientShared.formatKES(amount))}</span>
          </div>
        `;
      }).join("");

      document.getElementById("unganiPanelBody").innerHTML = `
        <div class="ungani-card">
          <p class="ungani-small">${UnganiClientShared.safe(capitalizeWords(type))} · ${UnganiClientShared.safe(capitalizeWords(status))}${date ? " · " + UnganiClientShared.safe(UnganiClientShared.formatDate(date)) : ""}</p>
          <div class="ungani-button-row" style="margin-top:14px;">
            <button class="ungani-btn gold" type="button" onclick="UnganiClientShared.closeSidePanel(); editEvent('${UnganiClientShared.attr(row.id)}')">Edit</button>
            <button class="ungani-btn red" type="button" onclick="UnganiClientShared.closeSidePanel(); deleteEvent('${UnganiClientShared.attr(row.id)}')">Delete</button>
          </div>

        ${(customerRowHtml || detailRows.length) ? `
          <div class="ungani-card" style="margin-top:18px;">
            <div class="ungani-section-title"><div><h3>Details</h3></div></div>
            ${customerRowHtml}
            ${detailRows.map(function (d) {
              return `<div class="detail-row"><span class="ungani-small">${UnganiClientShared.safe(d.label)}</span><span>${UnganiClientShared.safe(d.value)}</span></div>`;
            }).join("")}
          </div>
        ` : ""}

        <div class="ungani-card" style="margin-top:18px;">
          <div class="ungani-section-title"><div><h3>Linked Payments</h3></div></div>
          ${paymentRowsHtml || `<p class="ungani-small" style="padding:10px 0;">No payments linked yet.</p>`}

            <div class="ungani-section-title"><div><h3>Notes</h3></div></div>
            <p class="ungani-small" style="white-space:pre-wrap;">${UnganiClientShared.safe(notes)}</p>
          </div>

      if (window.lucide && typeof window.lucide.createIcons === "function") {
        window.lucide.createIcons();
      }

          document.getElementById("eventBookingDepositRequired").value = row.booking_deposit_required != null ? row.booking_deposit_required : "";
          document.getElementById("eventBookingDepositDueDate").value = row.booking_deposit_due_date || "";
        }

        if (document.getElementById("eventDeployedPerson")) {
          document.getElementById("eventDeployedPerson").value = row.deployed_person_id || "";
          document.getElementById("eventDeployedSite").value = row.deployed_site_item_id || "";
          document.getElementById("eventDeploymentRate").value = row.deployment_rate != null ? row.deployment_rate : "";
        }

        if (document.getElementById("eventTourGuide")) {
          document.getElementById("eventTourGuide").value = row.driver_person_id || "";
          document.getElementById("eventTourVehicle").value = row.vehicle_item_id || "";
          document.getElementById("eventTourRoute").value = row.route || "";
          document.getElementById("eventTourRate").value = row.rate != null ? row.rate : "";
        }

        if (document.getElementById("eventAppointmentStaff")) {
          document.getElementById("eventAppointmentStaff").value = row.staff_person_id || "";
          document.getElementById("eventAppointmentAmount").value = row.appointment_amount != null ? row.appointment_amount : "";
        }

        if (document.getElementById("eventCustomerPerson")) {
          document.getElementById("eventCustomerPerson").value = row.customer_person_id || "";
        }

        document.getElementById("eventNotes").value = UnganiClientShared.getValue(row, ["notes", "description"], "");
      }, 150);
    }

    async function markEventCompleted(id) {
      await markEventOutcome(id, "completed");
    }

    async function markEventOutcome(id, outcomeStatus) {
      let response;

      try {
        response = await currentContext.supabaseClient
          .from("business_events")
          .update({ status: outcomeStatus })
          .eq("id", id)
          .eq("tenant_id", currentContext.tenantId);
      } catch (error) {
        UnganiClientShared.showToast("Could not update activity: " + (error.message || "Network error. Please check your connection."));
        return;
      }

      if (response.error) {
        UnganiClientShared.showToast("Could not update activity: " + response.error.message);
        return;
      }

      const outcomeLabel = outcomeStatus === "no show" ? "marked as no-show" : "marked completed ✓";
      UnganiClientShared.showToast("Calendar activity " + outcomeLabel);
      await loadEventRows();
    }

    function rescheduleEvent(id) {
      editEvent(id);

      setTimeout(function () {
        const dateField = document.getElementById("eventDate");
        if (dateField) dateField.focus();
        UnganiClientShared.showToast("Pick a new date and save to reschedule.");
      }, 250);
    }

    async function deleteEvent(id) {
      if (
        window.UnganiClientShared &&
        typeof UnganiClientShared.ensureCanWrite === "function" &&
        !UnganiClientShared.ensureCanWrite("delete calendar activity")
      ) {
        return;
      }

      const confirmed = confirm("Move this calendar activity to Recently Deleted? You can restore it within 30 days.");

      if (!confirmed) return;

      let response;

      try {
        response = await currentContext.supabaseClient.rpc("soft_delete_ungani_record", {
          p_table_name: "business_events",
          p_record_id: id,
          p_delete_reason: "Deleted from Calendar page"
        });
      } catch (error) {
        UnganiClientShared.showToast("Could not delete activity: " + (error.message || "Network error. Please check your connection."));
        return;
      }

      if (response.error) {
        UnganiClientShared.showToast("Could not delete activity: " + response.error.message);
        return;
      }

      if (response.data && response.data.ok === false) {
        UnganiClientShared.showToast(response.data.message || "Could not delete activity.");
        return;
      }

      UnganiClientShared.showToast("Calendar activity moved to Recently Deleted ✓");
      UnganiClientShared.logAuditEvent("record_deleted", { entityType: "business_events", entityId: String(id), description: "Deleted from Calendar page" });
      await loadEventRows();
    }

    function getEventTitle(row) {
      return UnganiClientShared.getValue(row, ["event_title", "title", "name"], "Calendar Activity");
    }

    function statusBadge(status, dateValue) {
      const lower = String(status || "").toLowerCase();
      const date = String(dateValue || "").slice(0, 10);
      const today = new Date().toISOString().slice(0, 10);

      if (lower.includes("no show") || lower.includes("no-show")) {
        return `<span class="ungani-badge red">No-show</span>`;
      }

      if (date && date < today && !lower.includes("completed") && !lower.includes("cancelled")) {
        return `<span class="ungani-badge red">Overdue</span>`;
      }

      if (lower.includes("completed")) {
        return `<span class="ungani-badge green">Completed</span>`;
      }

      if (lower.includes("progress")) {
        return `<span class="ungani-badge blue">In Progress</span>`;
      }

      if (lower.includes("cancelled")) {
        return `<span class="ungani-badge red">Cancelled</span>`;
      }

      return `<span class="ungani-badge gold">Scheduled</span>`;
    }

    function priorityBadge(priority) {
      const lower = String(priority || "normal").toLowerCase();

      if (lower.includes("urgent") || lower.includes("high")) {
        return `<span class="ungani-badge red">${UnganiClientShared.safe(UnganiAnalytics.toTitle(priority))}</span>`;
      }

      if (lower.includes("low")) {
        return `<span class="ungani-badge blue">Low</span>`;
      }

      return `<span class="ungani-badge gold">Normal</span>`;
    }

    function formatTimeRange(startTime, endTime) {
      const start = String(startTime || "").slice(0, 5);
      const end = String(endTime || "").slice(0, 5);

      if (start && end) return start + " - " + end;
      if (start) return start;
      return "No time set";
    }

    function hasValues(rows) {
      return (rows || []).some(function (row) {
        return Number(row.value || 0) > 0;
      });
    }

    function renderSectionSwitcher() {
      if (sectionOptions.length <= 1) return "";

      const pills = [{ label: "All Sections", value: "" }].concat(
        sectionOptions.map(function (label) { return { label: label, value: label }; })
      );

      return `
        <div class="ungani-button-row" style="margin-top:10px;">
          ${pills.map(function (pill) {
            const active = currentSectionFilter === pill.value;
            return `<button class="ungani-btn ${active ? "gold" : "dark"}" type="button" onclick="switchSection('${UnganiClientShared.attr(pill.value)}')">${UnganiClientShared.safe(pill.label)}</button>`;
          }).join("")}
        </div>
      `;
    }

    function switchSection(value) {
      const url = new URL(window.location.href);

      if (value) {
        url.searchParams.set("section", value);
      } else {
        url.searchParams.delete("section");
      }

      window.location.href = url.toString();
    }

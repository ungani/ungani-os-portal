<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>UNGANI OS - Leases / Memberships / Contracts</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="pwa-register.js"></script>
  <script src="ungani-theme.js"></script>
  <script src="client-shared.js" onerror="window.__unganiClientSharedFailed = true;"></script>
  <script src="team-chat-shared.js"></script>
  <script src="ungani-connect-panel.js"></script>
  <script src="ungani-context-menu.js"></script>
  <script src="ungani-nav-config.js"></script>
  <script src="ungani-print-branding.js"></script>
  <script>
    (function () {
      function showUnganiLoadError() {
        if (typeof UnganiClientShared !== "undefined") return;

        var banner = document.createElement("div");
        banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#B91C1C;color:#fff;padding:12px 16px;font:14px/1.4 -apple-system,sans-serif;text-align:center;";
        banner.innerHTML = "Some page resources failed to load. Please check your connection. " +
          "<button style=\"margin-left:10px;padding:4px 12px;border:none;border-radius:6px;background:#fff;color:#B91C1C;font-weight:700;cursor:pointer;\" onclick=\"window.location.reload()\">Reload</button>";

        if (document.body) {
          document.body.prepend(banner);
        } else {
          document.addEventListener("DOMContentLoaded", function () {
            document.body.prepend(banner);
          });
        }
      }

      if (window.__unganiClientSharedFailed) {
        showUnganiLoadError();
      } else {
        setTimeout(function () {
          if (typeof UnganiClientShared === "undefined") showUnganiLoadError();
        }, 4000);
      }
    })();
  </script>
  <script src="ungani-business-config.js"></script>
  <script src="ungani-analytics.js"></script>
  <script src="ungani-presets.js"></script>
  <script src="ungani-stock-status.js"></script>
  <script src="nia-assistant.js"></script>
</head>

<body>
  <script>
    let currentContext = null;
    let businessPreset = null;
    let commitmentRows = [];
    let personOptions = [];
    let linkedItemOptions = [];
    let editingCommitmentId = null;
    let printCommitmentId = null;

    // Cluster 4 type mapping, per the approved plan: which commitment_type
    // this tenant's business type implies, and what to call the whole
    // feature/each field in THEIR vocabulary - a Real Estate owner sees
    // "Leases"/"Tenant"/"Unit", a Gym owner sees "Memberships"/"Member",
    // never a generic "Commitment" label. Falls back to a neutral generic
    // labelset for any other type that turns the toggle on (opt-in, so
    // this is reachable by any business type, not just these 4).
    const COMMITMENT_TYPE_BY_BUSINESS_KEY = {
      real_estate: "lease",
      gym: "membership",
      security: "service_contract",
      cleaning: "service_contract"
    };

    const COMMITMENT_VOCAB = {
      lease: {
        pageTitle: "Leases", singular: "Lease", personLabel: "Tenant", itemLabel: "Unit / Property",
        amountLabel: "Monthly Rent", planLabel: "Plan / Notes", showLinkedItem: true
      },
      membership: {
        pageTitle: "Memberships", singular: "Membership", personLabel: "Member", itemLabel: "",
        amountLabel: "Membership Fee", planLabel: "Plan / Tier", showLinkedItem: false
      },
      service_contract: {
        pageTitle: "Contracts", singular: "Contract", personLabel: "Client Contact", itemLabel: "Site / Location",
        amountLabel: "Contract Rate", planLabel: "Plan / Notes", showLinkedItem: true
      },
      generic: {
        pageTitle: "Leases / Memberships / Contracts", singular: "Commitment", personLabel: "Person", itemLabel: "Linked Unit / Site",
        amountLabel: "Amount", planLabel: "Plan / Notes", showLinkedItem: true
      }
    };

    function commitmentTypeForTenant() {
      const key = businessPreset ? businessPreset.key : null;
      return COMMITMENT_TYPE_BY_BUSINESS_KEY[key] || "generic";
    }

    function vocabFor(commitmentType) {
      return COMMITMENT_VOCAB[commitmentType] || COMMITMENT_VOCAB.generic;
    }

    window.addEventListener("load", function () {
      printCommitmentId = new URLSearchParams(window.location.search).get("print");

      UnganiClientShared.initPage({
        pageKey: "commitments",
        pageTitle: "Leases / Memberships / Contracts",
        pageSubtitle: "Recurring leases, memberships, and service contracts - with renewal dates tracked in one place.",
        onReady: startCommitmentsPage
      });

      if (window.UnganiContextMenu) {
        UnganiContextMenu.init({
          ungani_commitments: [
            { key: "delete", label: "Delete", icon: "trash-2", danger: true, handler: function (el) { deleteCommitmentRecord(el.getAttribute("data-record-id")); } }
          ]
        });
      }
    });

    async function startCommitmentsPage(context) {
      currentContext = context;
      businessPreset = (window.UnganiPresets && typeof UnganiPresets.getPreset === "function")
        ? UnganiPresets.getPreset(context.tenant)
        : null;

      const vocab = vocabFor(commitmentTypeForTenant());
      const titleEl = document.querySelector(".ungani-topbar h2");
      const subEl = document.querySelector(".ungani-topbar p");
      if (titleEl) titleEl.innerText = vocab.pageTitle;
      if (subEl) subEl.innerText = "Recurring " + vocab.singular.toLowerCase() + "s, with renewal dates tracked in one place.";

      if (!context.tenant || context.tenant.commitments_enabled !== true) {
        UnganiClientShared.setContent(`
          <section class="ungani-card ungani-hero">
            <span class="ungani-badge gold">${UnganiClientShared.safe(vocab.pageTitle)}</span>
            <h2 style="font-size:clamp(24px,3.6vw,36px);line-height:1.1;margin:16px 0 12px;">${UnganiClientShared.safe(vocab.pageTitle)} isn't turned on yet.</h2>
            <p>Enable it from My Settings' Add-ons panel to start tracking ${UnganiClientShared.safe(vocab.singular.toLowerCase())} renewal dates and get "expiring soon" alerts on your dashboard.</p>
            <div class="ungani-button-row">
              <a class="ungani-btn gold" href="my-settings.html">Go to Settings</a>
            </div>
          </section>
        `);
        return;
      }

      await Promise.all([loadPersonOptions(), loadLinkedItemOptions()]);
      await loadCommitmentRows();

      if (printCommitmentId) {
        await renderCommitmentPrintView(printCommitmentId);
        return;
      }

      renderCommitmentsPage();

      const applyAction = new URLSearchParams(window.location.search).get("action");
      if (applyAction === "add") {
        setTimeout(function () { openCommitmentModal(); }, 250);
      }
    }

    async function loadPersonOptions() {
      try {
        const response = await currentContext.supabaseClient
          .from("client_people")
          .select("id, full_name")
          .eq("tenant_id", currentContext.tenantId)
          .is("deleted_at", null)
          .order("full_name")
          .limit(1000);

        personOptions = (!response.error && response.data) ? response.data : [];
      } catch (error) {
        console.warn("Could not load People for commitment picker:", error.message);
        personOptions = [];
      }
    }

    async function loadLinkedItemOptions() {
      try {
        const response = await currentContext.supabaseClient
          .from("business_items")
          .select("id, item_name, name, title, property_name")
          .eq("tenant_id", currentContext.tenantId)
          .is("deleted_at", null)
          .order("created_at", { ascending: false })
          .limit(1000);

        linkedItemOptions = (!response.error && response.data) ? response.data : [];
      } catch (error) {
        console.warn("Could not load Items for commitment picker:", error.message);
        linkedItemOptions = [];
      }
    }

    function linkedItemLabel(item) {
      return item.item_name || item.name || item.title || item.property_name || "Item";
    }

    async function loadCommitmentRows() {
      try {
        const response = await currentContext.supabaseClient.rpc("get_my_ungani_commitments");
        commitmentRows = (!response.error && response.data && response.data.ok === true)
          ? (response.data.commitments || [])
          : [];
      } catch (error) {
        console.warn("Could not load commitments:", error.message);
        commitmentRows = [];
      }
    }

    // ---- List page ----

    function renderCommitmentsPage() {
      const vocab = vocabFor(commitmentTypeForTenant());
      const todayStr = UnganiClientShared.todayISO();

      const withStatus = commitmentRows.map(function (row) {
        return { row: row, status: UnganiClientShared.computeCommitmentStatus(row, todayStr) };
      });

      const activeCount = withStatus.filter(function (x) { return x.status.statusKey === "active"; }).length;
      const expiringCount = withStatus.filter(function (x) { return x.status.statusKey === "expiring_soon"; }).length;
      const expiredCount = withStatus.filter(function (x) { return x.status.statusKey === "expired"; }).length;

      UnganiClientShared.setContent(`
        <style>
          .commitments-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 18px; }
          .commitment-card { cursor: pointer; border-left: 3px solid var(--accent, #D4A63A); }
          .commitment-card:hover { border-color: rgba(212,166,58,0.5); }
          .commitment-status-pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
          .commitment-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 18px; }
          .commitment-kpi { background: var(--ungani-card-bg, rgba(255,255,255,0.04)); border-radius: 12px; padding: 14px 16px; }
          .commitment-kpi .value { font-size: 26px; font-weight: 800; }
          .commitment-kpi .label { font-size: 12.5px; opacity: 0.75; margin-top: 2px; }
        </style>

        <section class="ungani-card ungani-hero">
          <span class="ungani-badge gold">${UnganiClientShared.safe(vocab.pageTitle)}</span>
          <h2 style="font-size:clamp(28px,4vw,44px);line-height:1.05;margin:16px 0 12px;">Never miss a renewal.</h2>
          <p>Track ${UnganiClientShared.safe(vocab.singular.toLowerCase())} start/end dates in one place - the dashboard flags anything expiring within 7 days automatically.</p>

          <div class="ungani-button-row">
            <button class="ungani-btn gold" onclick="openCommitmentModal()">+ New ${UnganiClientShared.safe(vocab.singular)}</button>
            <button class="ungani-btn green" onclick="refreshCommitmentsPage()">Refresh</button>
          </div>

          <div class="commitment-kpis">
            <div class="commitment-kpi"><div class="value">${activeCount}</div><div class="label">Active</div></div>
            <div class="commitment-kpi"><div class="value" style="color:#D4A63A;">${expiringCount}</div><div class="label">Expiring within 7 days</div></div>
            <div class="commitment-kpi"><div class="value" style="color:#DC2626;">${expiredCount}</div><div class="label">Expired</div></div>
          </div>
        </section>

        <section class="ungani-card" style="margin-top:18px;">
          <div class="ungani-section-title">
            <div>
              <h3>All ${UnganiClientShared.safe(vocab.pageTitle)}</h3>
              <p class="ungani-small">${commitmentRows.length} record(s).</p>
            </div>
          </div>

          ${renderCommitmentsGrid(withStatus)}
        </section>

        <p class="ungani-small">${UnganiClientShared.safe(vocab.pageTitle)} · ungani.com · info@ungani.com</p>
      `);
    }

    function renderCommitmentsGrid(withStatus) {
      if (!withStatus.length) {
        const vocab = vocabFor(commitmentTypeForTenant());
        return `<p class="ungani-small" style="padding:18px 0;">No ${UnganiClientShared.safe(vocab.singular.toLowerCase())}s yet. Click "+ New ${UnganiClientShared.safe(vocab.singular)}" to create your first one.</p>`;
      }

      return `
        <div class="commitments-grid">
          ${withStatus.map(function (x) {
            const row = x.row;
            const vocab = vocabFor(row.commitment_type);
            const title = row.plan_name || row.person_name || row.linked_item_name || vocab.singular;
            const subtitleParts = [];
            if (row.person_name) subtitleParts.push(row.person_name);
            if (row.linked_item_name) subtitleParts.push(row.linked_item_name);

            return `
              <div class="ungani-card commitment-card" data-record-id="${UnganiClientShared.attr(row.id)}" data-record-table="ungani_commitments" style="--accent:${UnganiClientShared.attr(x.status.color)};" onclick="openCommitmentModal('${UnganiClientShared.attr(row.id)}')">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                  <div style="font-size:16px;font-weight:800;">${UnganiClientShared.safe(title)}</div>
                  <span class="commitment-status-pill" style="background:${UnganiClientShared.attr(x.status.color)}22;color:${UnganiClientShared.attr(x.status.color)};">${UnganiClientShared.safe(x.status.label)}</span>
                </div>
                ${subtitleParts.length ? `<p class="ungani-small" style="margin-top:4px;">${UnganiClientShared.safe(subtitleParts.join(" · "))}</p>` : ""}
                <p class="ungani-small" style="margin-top:10px;color:var(--ungani-muted,#6B7280);">
                  ${row.amount != null ? UnganiClientShared.formatKES(row.amount) + " / " + UnganiClientShared.safe(row.billing_frequency || "monthly") + " · " : ""}
                  ${row.end_date ? "Ends " + UnganiClientShared.formatDate(row.end_date) : "No end date set"}
                </p>
                ${row.deposit_amount_kes ? `
                  <span class="ungani-small" style="display:inline-block;margin-top:8px;padding:2px 9px;border-radius:999px;background:${row.deposit_status === "settled" ? "rgba(107,114,128,0.15)" : "rgba(212,166,58,0.18)"};color:${row.deposit_status === "settled" ? "#6B7280" : "#8A6A1A"};font-weight:700;">
                    Deposit ${row.deposit_status === "settled" ? "settled" : "held"}: Ksh ${Number(row.deposit_amount_kes).toLocaleString()}
                  </span>
                ` : ""}
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function printCommitmentFromModal(id) {
      window.open("my-commitments.html?print=" + encodeURIComponent(id), "_blank");
    }

    // Standalone print document (Lease Agreement / Membership Agreement /
    // Contract) - same ?print=<id> pattern as my-customer-invoices.html's
    // invoice/receipt print views, reusing UnganiPrintBranding for the
    // header/footer so it matches every other printable document.
    async function renderCommitmentPrintView(id) {
      const row = commitmentRows.find(function (r) { return String(r.id) === String(id); });

      if (!row) {
        UnganiClientShared.setContent(`<p style="padding:40px;">Could not find this record. It may have been deleted.</p>`);
        return;
      }

      const vocab = vocabFor(row.commitment_type);
      const tenant = currentContext.tenant;
      const status = UnganiClientShared.computeCommitmentStatus(row, UnganiClientShared.todayISO());

      // account_number lives on business_items, not on the commitment row
      // itself (get_my_ungani_commitments doesn't return it) - a separate
      // lookup here, rather than extending that live RPC, avoids touching
      // a function already relied on everywhere else.
      let unitAccountNumber = null;
      if (row.linked_item_id) {
        try {
          const unitResponse = await currentContext.supabaseClient
            .from("business_items")
            .select("account_number")
            .eq("id", row.linked_item_id)
            .maybeSingle();
          unitAccountNumber = (unitResponse && unitResponse.data && unitResponse.data.account_number) || null;
        } catch (error) {
          unitAccountNumber = null;
        }
      }

      UnganiClientShared.setContent(`
        <style>
          .lease-print-toolbar { display: flex; gap: 10px; margin-bottom: 18px; }
          .lease-print-shell { background: #FFFFFF; color: #111827; border-radius: 16px; border: 1px solid #E5E7EB; max-width: 760px; margin: 0 auto; padding: 40px 44px; }
          .lease-print-title { font-size: 26px; font-weight: 900; color: #061C3D; margin: 22px 0 4px; }
          .lease-print-sub { font-size: 13px; color: #6B7280; margin-bottom: 26px; }
          .lease-print-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; margin: 22px 0; }
          .lease-print-field { border-bottom: 1px solid #EEF0F3; padding-bottom: 10px; }
          .lease-print-field .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #9CA3AF; font-weight: 700; }
          .lease-print-field .value { font-size: 15px; font-weight: 700; color: #111827; margin-top: 3px; }
          .lease-print-status { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; margin-bottom: 18px; }
          .lease-print-notes { margin-top: 24px; font-size: 13.5px; color: #374151; white-space: pre-wrap; }
          .lease-print-signatures { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 56px; }
          .lease-print-sig-line { border-top: 1px solid #111827; padding-top: 8px; font-size: 12.5px; color: #6B7280; }

          @media print {
            @page { size: A4; margin: 12mm; }
            body { background: #FFFFFF !important; }
            .no-print, .ungani-sidebar, .ungani-mobile-bottom, .ungani-mobile-nav, .ungani-topbar, .ungani-toast,
            .lease-print-toolbar, #niaFabBtn, #niaTagline, #niaHelpBtn, #unganiPushBanner, .nia-fab, .nia-tagline, .ungani-push-banner {
              display: none !important;
            }
            .ungani-app-shell, .ungani-main, .ungani-content { display: block !important; margin: 0 !important; padding: 0 !important; width: 100% !important; max-width: none !important; }
            .lease-print-shell { box-shadow: none !important; border: none !important; border-radius: 0 !important; }
          }
        </style>

        <div class="lease-print-toolbar no-print">
          <button class="ungani-btn gold" onclick="window.print()">Print / Save PDF</button>
          <a class="ungani-btn light" href="my-commitments.html">Back to ${UnganiClientShared.safe(vocab.pageTitle)}</a>
        </div>

        <div class="lease-print-shell">
          ${UnganiPrintBranding.renderHeaderBlock(tenant, { logoSize: 70, contactColor: "#6B7280", nameColor: "#061C3D" })}

          <div class="lease-print-title">${UnganiClientShared.safe(vocab.singular)} Agreement</div>
          <div class="lease-print-sub">Generated ${UnganiClientShared.formatDate(UnganiClientShared.todayISO())}</div>

          <span class="lease-print-status" style="background:${status.color}22;color:${status.color};">${UnganiClientShared.safe(status.label)}</span>

          <div class="lease-print-grid">
            <div class="lease-print-field"><div class="label">${UnganiClientShared.safe(vocab.personLabel)}</div><div class="value">${UnganiClientShared.safe(row.person_name || "—")}</div></div>
            ${vocab.showLinkedItem ? `<div class="lease-print-field"><div class="label">${UnganiClientShared.safe(vocab.itemLabel)}</div><div class="value">${UnganiClientShared.safe(row.linked_item_name || "—")}</div></div>` : ""}
            ${unitAccountNumber ? `<div class="lease-print-field"><div class="label">M-Pesa Account Number</div><div class="value">${UnganiClientShared.safe(unitAccountNumber)}</div></div>` : ""}
            <div class="lease-print-field"><div class="label">${UnganiClientShared.safe(vocab.amountLabel)}</div><div class="value">${row.amount != null ? UnganiClientShared.formatKES(row.amount) : "—"} / ${UnganiClientShared.safe(row.billing_frequency || "monthly")}</div></div>
            <div class="lease-print-field"><div class="label">${UnganiClientShared.safe(vocab.planLabel)}</div><div class="value">${UnganiClientShared.safe(row.plan_name || "—")}</div></div>
            <div class="lease-print-field"><div class="label">Start Date</div><div class="value">${row.start_date ? UnganiClientShared.formatDate(row.start_date) : "—"}</div></div>
            <div class="lease-print-field"><div class="label">End / Renewal Date</div><div class="value">${row.end_date ? UnganiClientShared.formatDate(row.end_date) : "No end date set"}</div></div>
          </div>

          ${row.deposit_amount_kes ? `
            <div class="lease-print-field" style="border-bottom:none;margin-top:4px;">
              <div class="label">Security Deposit</div>
              <div class="value">
                ${row.deposit_status === "settled"
                  ? `Settled — Ksh ${Number(row.deposit_refunded_kes || 0).toLocaleString()} refunded${row.deposit_refund_method ? " via " + row.deposit_refund_method : ""}, Ksh ${Number(row.deposit_deducted_kes || 0).toLocaleString()} deducted (${row.deposit_deduction_type === "unpaid_rent" ? "unpaid rent" : "damages"}) on ${UnganiClientShared.formatDate(row.deposit_settled_at)}`
                  : `Ksh ${Number(row.deposit_amount_kes).toLocaleString()} held (not income - refundable at move-out)`}
              </div>
            </div>
          ` : ""}

          ${row.notes ? `<div class="lease-print-notes"><strong>Notes:</strong><br />${UnganiClientShared.safe(row.notes)}</div>` : ""}

          <div class="lease-print-signatures">
            <div class="lease-print-sig-line">${UnganiClientShared.safe(UnganiPrintBranding.getDisplayName(tenant))} (Owner)</div>
            <div class="lease-print-sig-line">${UnganiClientShared.safe(row.person_name || vocab.personLabel)}</div>
          </div>

          ${UnganiPrintBranding.renderPoweredByFooter()}
        </div>
      `);
    }

    async function refreshCommitmentsPage() {
      await loadCommitmentRows();
      renderCommitmentsPage();
      UnganiClientShared.showToast("Refreshed ✓");
    }

    // ---- Add/Edit modal ----

    function personOptionsHtml(selectedId) {
      const options = personOptions.map(function (person) {
        const selected = String(person.id) === String(selectedId) ? " selected" : "";
        return `<option value="${UnganiClientShared.attr(person.id)}"${selected}>${UnganiClientShared.safe(person.full_name)}</option>`;
      }).join("");

      return `<option value="">— Choose a person —</option>${options}`;
    }

    function linkedItemOptionsHtml(selectedId) {
      const options = linkedItemOptions.map(function (item) {
        const selected = String(item.id) === String(selectedId) ? " selected" : "";
        return `<option value="${UnganiClientShared.attr(item.id)}"${selected}>${UnganiClientShared.safe(linkedItemLabel(item))}</option>`;
      }).join("");

      return `<option value="">— Not linked —</option>${options}`;
    }

    function openCommitmentModal(id) {
      const row = id ? commitmentRows.find(function (item) { return String(item.id) === String(id); }) : null;

      if (id && !row) {
        UnganiClientShared.showToast("Not found.");
        return;
      }

      editingCommitmentId = row ? row.id : null;
      const commitmentType = row ? row.commitment_type : commitmentTypeForTenant();
      const vocab = vocabFor(commitmentType);

      const bodyHtml = `
        <form onsubmit="saveCommitmentRecord(event)">
          <input type="hidden" id="commitmentType" value="${UnganiClientShared.attr(commitmentType)}" />

          <label for="commitmentPerson">${UnganiClientShared.safe(vocab.personLabel)}</label>
          <select id="commitmentPerson">${personOptionsHtml(row ? row.person_id : null)}</select>

          ${vocab.showLinkedItem ? `
            <label for="commitmentLinkedItem">${UnganiClientShared.safe(vocab.itemLabel)}</label>
            <select id="commitmentLinkedItem">${linkedItemOptionsHtml(row ? row.linked_item_id : null)}</select>
          ` : ""}

          <label for="commitmentPlanName">${UnganiClientShared.safe(vocab.planLabel)}</label>
          <input type="text" id="commitmentPlanName" value="${row ? UnganiClientShared.attr(row.plan_name || "") : ""}" />

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div>
              <label for="commitmentAmount">${UnganiClientShared.safe(vocab.amountLabel)}</label>
              <input type="number" min="0" step="0.01" id="commitmentAmount" value="${row && row.amount != null ? UnganiClientShared.attr(row.amount) : ""}" />
            </div>
            <div>
              <label for="commitmentFrequency">Billing Frequency</label>
              <select id="commitmentFrequency">
                ${["monthly", "weekly", "quarterly", "annual", "once"].map(function (freq) {
                  const selected = (row ? row.billing_frequency : "monthly") === freq ? " selected" : "";
                  return `<option value="${freq}"${selected}>${freq.charAt(0).toUpperCase() + freq.slice(1)}</option>`;
                }).join("")}
              </select>
            </div>
          </div>

          ${commitmentType === "lease" ? `
            <div style="margin-top:12px;">
              <label for="commitmentDepositAmount">Deposit Held (Ksh)</label>
              <input type="number" min="0" step="0.01" id="commitmentDepositAmount"
                value="${row && row.deposit_amount_kes != null ? UnganiClientShared.attr(row.deposit_amount_kes) : ""}"
                ${row && row.deposit_status === "settled" ? "disabled" : ""} />
              ${row && row.deposit_status === "settled" ? `
                <p style="margin:4px 0 0;font-size:0.85em;color:var(--muted-text,#8a8f98);">
                  Deposit already settled (refunded Ksh ${UnganiClientShared.safe(Number(row.deposit_refunded_kes || 0).toLocaleString())}, deducted Ksh ${UnganiClientShared.safe(Number(row.deposit_deducted_kes || 0).toLocaleString())}) - amount is locked.
                </p>
              ` : `
                <p style="margin:4px 0 0;font-size:0.85em;color:var(--muted-text,#8a8f98);">Held money, not income. Leave blank if no deposit was collected.</p>
              `}
            </div>
          ` : ""}

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div>
              <label for="commitmentStart">Start Date</label>
              <input type="date" id="commitmentStart" value="${row ? UnganiClientShared.attr(String(row.start_date || "").slice(0, 10)) : ""}" />
            </div>
            <div>
              <label for="commitmentEnd">End / Renewal Date</label>
              <input type="date" id="commitmentEnd" value="${row ? UnganiClientShared.attr(String(row.end_date || "").slice(0, 10)) : ""}" />
            </div>
          </div>

          <label for="commitmentStatus">Status</label>
          <select id="commitmentStatus">
            ${["active", "terminated", "frozen"].map(function (s) {
              const selected = (row ? row.status : "active") === s ? " selected" : "";
              return `<option value="${s}"${selected}>${s.charAt(0).toUpperCase() + s.slice(1)}</option>`;
            }).join("")}
          </select>

          <label style="display:flex;align-items:center;gap:8px;margin-top:12px;">
            <input type="checkbox" id="commitmentAutoRenew" ${row && row.auto_renew ? "checked" : ""} style="width:auto;" />
            Auto-renews
          </label>

          <label for="commitmentNotes">Notes</label>
          <textarea id="commitmentNotes" rows="3">${row ? UnganiClientShared.safe(row.notes || "") : ""}</textarea>

          <div class="ungani-button-row" style="margin-top:18px;justify-content:space-between;">
            <div style="display:flex;gap:8px;">
              ${row ? `<button type="button" class="ungani-btn red" onclick="deleteCommitmentRecord('${UnganiClientShared.attr(row.id)}')">Delete</button>` : ""}
              ${row ? `<button type="button" class="ungani-btn dark" onclick="printCommitmentFromModal('${UnganiClientShared.attr(row.id)}')">Print</button>` : ""}
              ${row && row.deposit_status === "held" ? `<button type="button" class="ungani-btn gold" onclick="openSettleDepositModal('${UnganiClientShared.attr(row.id)}')">Settle Deposit</button>` : ""}
            </div>
            <div class="ungani-button-row" style="margin:0;">
              <button type="button" class="ungani-btn light" onclick="UnganiClientShared.closeModal()">Close</button>
              <button type="submit" class="ungani-btn gold">${row ? "Update" : "Create"} ${UnganiClientShared.safe(vocab.singular)}</button>
            </div>
          </div>
        </form>
      `;

      UnganiClientShared.openModal({
        title: row ? vocab.singular + ": " + (row.plan_name || row.person_name || "") : "New " + vocab.singular,
        bodyHtml: bodyHtml
      });
    }

    // ---- Settle Deposit ----

    function openSettleDepositModal(id) {
      const row = commitmentRows.find(function (item) { return String(item.id) === String(id); });
      if (!row || row.deposit_status !== "held") {
        UnganiClientShared.showToast("No held deposit found on this lease.");
        return;
      }

      const depositAmount = Number(row.deposit_amount_kes || 0);

      const bodyHtml = `
        <form onsubmit="saveDepositSettlement(event, '${UnganiClientShared.attr(row.id)}')">
          <p style="margin-top:0;">Deposit held: <strong>Ksh ${depositAmount.toLocaleString()}</strong> for ${UnganiClientShared.safe(row.person_name || "this tenant")}.</p>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div>
              <label for="depositRefundAmount">Refund Amount (Ksh)</label>
              <input type="number" min="0" max="${depositAmount}" step="0.01" id="depositRefundAmount" value="${depositAmount}" />
            </div>
            <div>
              <label for="depositDeductionAmount">Deduction Amount (Ksh)</label>
              <input type="number" min="0" max="${depositAmount}" step="0.01" id="depositDeductionAmount" value="0" />
            </div>
          </div>

          <label for="depositDeductionType" style="margin-top:12px;">Deduction Reason (only if deducting)</label>
          <select id="depositDeductionType">
            <option value="">— N/A, no deduction —</option>
            <option value="damages">Damages (becomes income)</option>
            <option value="unpaid_rent">Unpaid rent (clears rent owed)</option>
          </select>

          <label for="depositRefundMethod" style="margin-top:12px;">Refund Method (only if refunding)</label>
          <input type="text" id="depositRefundMethod" placeholder="e.g. Cash, M-Pesa, Bank Transfer" />

          <label for="depositSettlementNote">Note</label>
          <textarea id="depositSettlementNote" rows="2" placeholder="e.g. Ksh 5,000 deducted for a broken window, balance refunded."></textarea>

          <p style="font-size:0.85em;color:var(--muted-text,#8a8f98);">Refund + deduction must not exceed the deposit held. A deduction posts as real income; a refund does not touch Money — it's recorded on the deposit itself. This cannot be edited once saved.</p>

          <div class="ungani-button-row" style="margin-top:18px;justify-content:flex-end;">
            <button type="button" class="ungani-btn light" onclick="UnganiClientShared.closeModal()">Cancel</button>
            <button type="submit" class="ungani-btn gold">Settle Deposit</button>
          </div>
        </form>
      `;

      UnganiClientShared.openModal({ title: "Settle Deposit", bodyHtml: bodyHtml });
    }

    async function saveDepositSettlement(event, commitmentId) {
      event.preventDefault();

      const refundAmount = Number(UnganiClientShared.value("depositRefundAmount") || 0);
      const deductionAmount = Number(UnganiClientShared.value("depositDeductionAmount") || 0);
      const deductionType = UnganiClientShared.value("depositDeductionType") || null;

      if (deductionAmount > 0 && !deductionType) {
        UnganiClientShared.showToast("Choose a deduction reason.");
        return;
      }

      const submitBtn = event.target.querySelector("button[type=submit]");

      await UnganiClientShared.withButtonLoading(submitBtn, async () => {
        try {
          const response = await currentContext.supabaseClient.rpc("owner_settle_ungani_commitment_deposit", {
            p_commitment_id: commitmentId,
            p_refund_amount: refundAmount,
            p_deduction_amount: deductionAmount,
            p_deduction_type: deductionType,
            p_refund_method: UnganiClientShared.value("depositRefundMethod") || null,
            p_note: UnganiClientShared.value("depositSettlementNote") || null
          });

          if (response.error || !response.data || response.data.ok !== true) {
            UnganiClientShared.showToast("Could not settle deposit: " + (response.error ? response.error.message : (response.data && response.data.message)));
            return;
          }

          UnganiClientShared.closeModal();
          UnganiClientShared.showToast("Deposit settled ✓");
          await loadCommitmentRows();
          renderCommitmentsPage();
        } catch (error) {
          UnganiClientShared.showToast("Could not settle deposit: " + error.message);
        }
      });
    }

    async function saveCommitmentRecord(event) {
      event.preventDefault();

      const submitBtn = event.target.querySelector("button[type=submit]");

      await UnganiClientShared.withButtonLoading(submitBtn, async () => {
        try {
          const response = await currentContext.supabaseClient.rpc("owner_upsert_ungani_commitment", {
            p_commitment_id: editingCommitmentId,
            p_commitment_type: UnganiClientShared.value("commitmentType"),
            p_person_id: UnganiClientShared.value("commitmentPerson") || null,
            p_linked_item_id: document.getElementById("commitmentLinkedItem") ? (UnganiClientShared.value("commitmentLinkedItem") || null) : null,
            p_plan_name: UnganiClientShared.value("commitmentPlanName") || null,
            p_amount: UnganiClientShared.value("commitmentAmount") ? Number(UnganiClientShared.value("commitmentAmount")) : null,
            p_billing_frequency: UnganiClientShared.value("commitmentFrequency") || "monthly",
            p_start_date: UnganiClientShared.value("commitmentStart") || null,
            p_end_date: UnganiClientShared.value("commitmentEnd") || null,
            p_status: UnganiClientShared.value("commitmentStatus") || "active",
            p_auto_renew: !!document.getElementById("commitmentAutoRenew").checked,
            p_notes: UnganiClientShared.value("commitmentNotes") || null,
            p_deposit_amount: document.getElementById("commitmentDepositAmount") && !document.getElementById("commitmentDepositAmount").disabled && UnganiClientShared.value("commitmentDepositAmount")
              ? Number(UnganiClientShared.value("commitmentDepositAmount"))
              : null
          });

          if (response.error || !response.data || response.data.ok !== true) {
            UnganiClientShared.showToast("Could not save: " + (response.error ? response.error.message : (response.data && response.data.message)));
            return;
          }

          UnganiClientShared.closeModal();
          UnganiClientShared.showToast(editingCommitmentId ? "Updated ✓" : "Created ✓");
          await loadCommitmentRows();
          renderCommitmentsPage();
        } catch (error) {
          UnganiClientShared.showToast("Could not save: " + error.message);
        }
      });
    }

    async function deleteCommitmentRecord(id) {
      if (!confirm("Move this to Recently Deleted? You can restore it within 30 days.")) return;

      try {
        const response = await currentContext.supabaseClient.rpc("soft_delete_ungani_record", {
          p_table_name: "ungani_commitments",
          p_record_id: id,
          p_delete_reason: "Deleted from Leases / Memberships / Contracts page"
        });

        if (response.error || !response.data || response.data.ok !== true) {
          UnganiClientShared.showToast("Could not delete: " + (response.error ? response.error.message : (response.data && response.data.message)));
          return;
        }

        UnganiClientShared.closeModal();
        UnganiClientShared.showToast("Deleted ✓");
        await loadCommitmentRows();
        renderCommitmentsPage();
      } catch (error) {
        UnganiClientShared.showToast("Could not delete: " + error.message);
      }
    }
  </script>

  <script src="pwa-register.js"></script>
</body>
</html>
